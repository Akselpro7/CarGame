<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street Racing - Open World</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #101820;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-size: 22px;
}

#hud {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: white;
    background: rgba(0,0,0,.65);
    padding: 15px 20px;
    border-radius: 12px;
    min-width: 180px;
    z-index: 5;
}

#speed {
    font-size: 42px;
    font-weight: bold;
}

#gear {
    font-size: 20px;
    color: #00eaff;
}

#help {
    position: fixed;
    top: 15px;
    left: 15px;
    color: white;
    background: rgba(0,0,0,.6);
    padding: 12px;
    border-radius: 8px;
    z-index: 5;
    line-height: 1.7;
}

#cameraButton {
    position: fixed;
    right: 20px;
    top: 20px;
    padding: 13px 18px;
    background: #00a9d6;
    border: 0;
    color: white;
    border-radius: 8px;
    font-weight: bold;
    z-index: 6;
}

#error {
    display: none;
    position: fixed;
    inset: 0;
    background: #171717;
    color: white;
    z-index: 30;
    padding: 30px;
    font-size: 18px;
}
</style>
</head>

<body>

<div id="loading">
    <h1>STREET RACING</h1>
    <p>Loading city and car...</p>
</div>

<div id="error"></div>

<div id="help">
    <b>CONTROLS</b><br>
    W / ↑ = Accelerate<br>
    S / ↓ = Brake<br>
    A / ← = Left<br>
    D / → = Right<br>
    SPACE = Handbrake<br>
    C = Change camera
</div>

<button id="cameraButton">CHANGE CAMERA</button>

<div id="hud">
    <div id="speed">0 KM/H</div>
    <div id="gear">GEAR: 1</div>
    <div id="rpm">RPM: 900</div>
    <div id="status">ENGINE ON</div>
</div>

<script>
window.onerror = function(message) {
    const error = document.getElementById("error");
    error.style.display = "block";
    error.innerHTML =
        "<h2>Game error</h2><p>" + message +
        "</p><p>Check your internet connection and try again.</p>";
};

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function() {

if (!window.THREE) {
    document.getElementById("loading").innerHTML =
        "Three.js could not load.<br>Check your internet connection.";
    return;
}

// ==========================================
// GAME SETTINGS
// ==========================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87b9df);
scene.fog = new THREE.Fog(0x87b9df, 100, 650);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    1500
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;

document.body.appendChild(renderer.domElement);

// ==========================================
// LIGHTING
// ==========================================

const sunlight = new THREE.DirectionalLight(0xffffff, 1.5);
sunlight.position.set(-100, 150, 80);
sunlight.castShadow = true;
sunlight.shadow.mapSize.width = 2048;
sunlight.shadow.mapSize.height = 2048;
scene.add(sunlight);

scene.add(new THREE.HemisphereLight(
    0xc9e7ff,
    0x56504b,
    1.0
));

// ==========================================
// MATERIALS
// ==========================================

function material(color, roughness = 0.7, metalness = 0) {
    return new THREE.MeshStandardMaterial({
        color: color,
        roughness: roughness,
        metalness: metalness
    });
}

const roadMat = material(0x292d32);
const concreteMat = material(0x777777);
const grassMat = material(0x426c36);
const whiteMat = material(0xffffff);
const yellowMat = material(0xffd52a);
const glassMat = new THREE.MeshStandardMaterial({
    color: 0x142b3c,
    roughness: 0.15,
    metalness: 0.5,
    transparent: true,
    opacity: 0.8
});

// ==========================================
// GROUND
// ==========================================

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1500, 1500),
    grassMat
);

ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.12;
ground.receiveShadow = true;
scene.add(ground);

// ==========================================
// ROADS
// ==========================================

const road = new THREE.Mesh(
    new THREE.PlaneGeometry(20, 1400),
    roadMat
);

road.rotation.x = -Math.PI / 2;
road.position.y = 0;
road.receiveShadow = true;
scene.add(road);

function createRoadLine(x, z, width, length, color) {
    const line = new THREE.Mesh(
        new THREE.BoxGeometry(width, 0.025, length),
        material(color)
    );

    line.position.set(x, 0.035, z);
    scene.add(line);
}

for (let z = -700; z < 700; z += 12) {
    createRoadLine(0, z, 0.25, 5, 0xffffff);
}

for (let z = -700; z < 700; z += 15) {
    createRoadLine(-9.6, z, 0.2, 15, 0xffffff);
    createRoadLine(9.6, z, 0.2, 15, 0xffffff);
}

// Sidewalks
for (const x of [-12, 12]) {
    const sidewalk = new THREE.Mesh(
        new THREE.BoxGeometry(4, 0.3, 1400),
        concreteMat
    );

    sidewalk.position.set(x, 0.05, 0);
    scene.add(sidewalk);
}

// ==========================================
// CITY BUILDINGS
// ==========================================

const buildingMaterials = [
    0x777d85,
    0x596a79,
    0x8b8176,
    0x4b535f,
    0x9b9b91,
    0x566f78
];

function createBuilding(x, z) {

    const width = 12 + Math.random() * 18;
    const height = 12 + Math.random() * 65;
    const depth = 12 + Math.random() * 20;

    const building = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        material(
            buildingMaterials[
                Math.floor(Math.random() * buildingMaterials.length)
            ]
        )
    );

    building.position.set(
        x,
        height / 2,
        z
    );

    building.castShadow = true;
    building.receiveShadow = true;
    scene.add(building);

    // Windows
    const windowMat = material(0x9fc4d9, 0.25, 0.2);

    for (let y = 3; y < height - 2; y += 4) {
        for (let wx = -width / 2 + 2; wx < width / 2 - 1; wx += 4) {

            const windowMesh = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, 2, 0.08),
                windowMat
            );

            windowMesh.position.set(
                x + wx,
                y,
                z + depth / 2 + 0.05
            );

            scene.add(windowMesh);
        }
    }
}

for (let z = -650; z < 650; z += 45) {
    createBuilding(-28 - Math.random() * 20, z);
    createBuilding(28 + Math.random() * 20, z);
}

// ==========================================
// TREES
// ==========================================

function createTree(x, z) {

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25, 0.4, 3, 8),
        material(0x64452c)
    );

    trunk.position.set(x, 1.5, z);
    scene.add(trunk);

    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(2.2, 10, 10),
        material(0x276a32)
    );

    leaves.position.set(x, 4, z);
    leaves.castShadow = true;
    scene.add(leaves);
}

for (let z = -650; z < 650; z += 18) {
    createTree(-16, z);
    createTree(16, z);
}

// ==========================================
// STREETLIGHTS
// ==========================================

function createStreetLight(x, z) {

    const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.15, 8, 8),
        material(0x333333, 0.4, 0.6)
    );

    pole.position.set(x, 4, z);
    scene.add(pole);

    const arm = new THREE.Mesh(
        new THREE.BoxGeometry(2, 0.12, 0.12),
        material(0x333333)
    );

    arm.position.set(x + (x < 0 ? 1 : -1), 7.8, z);
    scene.add(arm);

    const lamp = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 0.2, 0.5),
        material(0xffffcc)
    );

    lamp.position.set(x + (x < 0 ? 2 : -2), 7.7, z);
    scene.add(lamp);
}

for (let z = -650; z < 650; z += 35) {
    createStreetLight(-13, z);
    createStreetLight(13, z);
}

// ==========================================
// PLAYER CAR
// ==========================================

const car = new THREE.Group();
scene.add(car);

const carBodyMat = material(0x0b32c7, 0.25, 0.7);
const blackMat = material(0x101114, 0.35, 0.3);
const rubberMat = material(0x090909);
const metalMat = material(0x888888, 0.2, 0.9);
const lightMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0xeeeeff,
    emissiveIntensity: 1
});

function box(parent, w, h, d, mat, x, y, z) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        mat
    );

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
}

// Main chassis
box(car, 2.15, 0.65, 4.5, carBodyMat, 0, 0.85, 0);

// Hood
box(car, 2.05, 0.22, 1.4, carBodyMat, 0, 1.18, -1.45);

// Rear body
box(car, 2.05, 0.35, 1.2, carBodyMat, 0, 1.1, 1.6);

// Roof
box(car, 1.75, 0.2, 1.8, carBodyMat, 0, 1.85, 0.15);

// Windshield
const windshield = new THREE.Mesh(
    new THREE.BoxGeometry(1.65, 0.85, 0.06),
    glassMat
);

windshield.position.set(0, 1.55, -0.85);
windshield.rotation.x = -0.25;
car.add(windshield);

// Rear window
const rearWindow = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.7, 0.06),
    glassMat
);

rearWindow.position.set(0, 1.55, 1.05);
rearWindow.rotation.x = 0.25;
car.add(rearWindow);

// Spoiler
box(car, 2.2, 0.12, 0.35, blackMat, 0, 1.7, 2.15);
box(car, 0.12, 0.35, 0.12, blackMat, -0.75, 1.5, 2.1);
box(car, 0.12, 0.35, 0.12, blackMat, 0.75, 1.5, 2.1);

// Front lights
for (const x of [-0.7, 0.7]) {
    box(car, 0.55, 0.18, 0.08, lightMat, x, 1.1, -2.28);
}

// Rear lights
const rearLightMat = new THREE.MeshStandardMaterial({
    color: 0xff1111,
    emissive: 0xaa0000
});

for (const x of [-0.75, 0.75]) {
    box(car, 0.5, 0.18, 0.08, rearLightMat, x, 1.1, 2.28);
}

// ==========================================
// WHEELS
// ==========================================

const wheels = [];
const frontWheels = [];

function createWheel(x, z, isFront) {

    const wheel = new THREE.Group();

    const tire = new THREE.Mesh(
        new THREE.CylinderGeometry(0.42, 0.42, 0.28, 24),
        rubberMat
    );

    tire.rotation.z = Math.PI / 2;
    wheel.add(tire);

    const rim = new THREE.Mesh(
        new THREE.CylinderGeometry(0.23, 0.23, 0.3, 16),
        metalMat
    );

    rim.rotation.z = Math.PI / 2;
    wheel.add(rim);

    wheel.position.set(x, 0.48, z);
    car.add(wheel);

    wheels.push(wheel);

    if (isFront) {
        frontWheels.push(wheel);
    }
}

createWheel(-1.05, -1.5, true);
createWheel(1.05, -1.5, true);
createWheel(-1.05, 1.5, false);
createWheel(1.05, 1.5, false);

// ==========================================
// COCKPIT
// ==========================================

const cockpit = new THREE.Group();
camera.add(cockpit);

const dashboardMat = material(0x17191c);
const leatherMat = material(0x191919);

box(cockpit, 1.8, 0.35, 0.8, dashboardMat, 0, -0.55, -0.8);

// Steering wheel
const steeringWheel = new THREE.Mesh(
    new THREE.TorusGeometry(0.32, 0.045, 10, 32),
    blackMat
);

steeringWheel.position.set(0.38, -0.38, -0.75);
cockpit.add(steeringWheel);

const steeringCenter = box(
    cockpit, 0.18, 0.18, 0.08,
    metalMat, 0.38, -0.38, -0.75
);

// Driver
const driverBody = new THREE.Mesh(
    new THREE.BoxGeometry(0.48, 0.8, 0.35),
    material(0x171717)
);

driverBody.position.set(-0.45, -0.25, -1.1);
cockpit.add(driverBody);

const driverHead = new THREE.Mesh(
    new THREE.SphereGeometry(0.19, 16, 16),
    material(0xc18d69)
);

driverHead.position.set(-0.45, 0.27, -1.1);
cockpit.add(driverHead);

// Arms
const arm1 = new THREE.Mesh(
    new THREE.BoxGeometry(0.15, 0.48, 0.15),
    leatherMat
);

arm1.position.set(-0.05, -0.35, -0.85);
arm1.rotation.z = -0.7;
cockpit.add(arm1);

const arm2 = arm1.clone();
arm2.position.x = 0.65;
arm2.rotation.z = 0.7;
cockpit.add(arm2);

// Cockpit hidden initially
cockpit.visible = false;

// ==========================================
// TRAFFIC
// ==========================================

const traffic = [];

function createTrafficCar(x, z, color) {

    const trafficCar = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.8, 0.7, 3.8),
        material(color, 0.35, 0.4)
    );

    body.position.y = 0.8;
    trafficCar.add(body);

    const roof = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 0.6, 1.8),
        glassMat
    );

    roof.position.set(0, 1.35, 0);
    trafficCar.add(roof);

    trafficCar.position.set(x, 0, z);
    scene.add(trafficCar);

    traffic.push({
        object: trafficCar,
        speed: 10 + Math.random() * 10
    });
}

for (let i = 0; i < 12; i++) {
    createTrafficCar(
        i % 2 === 0 ? -5 : 5,
        -100 - i * 45,
        [0xff2222, 0xffffff, 0x222222, 0xeeee00][i % 4]
    );
}

// ==========================================
// DRIVING PHYSICS
// ==========================================

const keys = {};

window.addEventListener("keydown", function(event) {
    keys[event.key.toLowerCase()] = true;

    if (event.key.toLowerCase() === "c" && !event.repeat) {
        changeCamera();
    }
});

window.addEventListener("keyup", function(event) {
    keys[event.key.toLowerCase()] = false;
});

let speed = 0;
let steering = 0;
let steeringTarget = 0;
let carX = 0;
let carZ = 0;
let yaw = 0;
let verticalBounce = 0;
let cameraMode = 0;
let handbrake = false;
let rpm = 900;
let gear = 1;

function approach(current, target, amount) {
    return current + (target - current) * amount;
}

function changeCamera() {
    cameraMode = 1 - cameraMode;
    cockpit.visible = cameraMode === 1;
}

document.getElementById("cameraButton").onclick = changeCamera;

// ==========================================
// ENGINE AND GEARBOX
// ==========================================

function updateGear() {

    if (speed < 35) gear = 1;
    else if (speed < 75) gear = 2;
    else if (speed < 120) gear = 3;
    else if (speed < 170) gear = 4;
    else if (speed < 230) gear = 5;
    else gear = 6;

    rpm = 900 + (speed % 40) * 90;

    rpm = Math.min(rpm, 7500);
}

// ==========================================
// CAMERA
// ==========================================

function updateCamera() {

    if (cameraMode === 0) {

        const desiredPosition = new THREE.Vector3(
            carX + Math.sin(yaw) * 7,
            4.2,
            carZ + Math.cos(yaw) * 7
        );

        camera.position.lerp(desiredPosition, 0.09);

        const lookPosition = new THREE.Vector3(
            carX - Math.sin(yaw) * 3,
            1.3,
            carZ - Math.cos(yaw) * 3
        );

        camera.lookAt(lookPosition);

    } else {

        camera.position.set(
            carX - Math.sin(yaw) * 0.2,
            2.0 + verticalBounce,
            carZ - Math.cos(yaw) * 0.2
        );

        camera.rotation.set(0, yaw, 0);
    }
}

// ==========================================
// GAME LOOP
// ==========================================

const clock = new THREE.Clock();

function updateGame(delta) {

    delta = Math.min(delta, 0.04);

    const accelerating =
        keys["w"] || keys["arrowup"];

    const braking =
        keys["s"] || keys["arrowdown"];

    const left =
        keys["a"] || keys["arrowleft"];

    const right =
        keys["d"] || keys["arrowright"];

    handbrake = keys[" "];

    // Acceleration
    if (accelerating) {
        speed += 26 * delta;
    } else {
        speed -= 5 * delta;
    }

    // Brake
    if (braking) {
        speed -= 55 * delta;
    }

    // Handbrake
    if (handbrake) {
        speed -= 22 * delta;
    }

    speed = Math.max(0, Math.min(speed, 320));

    // Steering input
    steeringTarget = 0;

    if (left) steeringTarget = 1;
    if (right) steeringTarget = -1;

    // Delayed steering response
    steering = approach(
        steering,
        steeringTarget,
        delta * 3.5
    );

    // Steering gets weaker at high speeds
    const speedFactor = 1 - Math.min(speed / 420, 0.55);

    // Turn angle
    const turnStrength = 0.75 * speedFactor;

    yaw += steering * turnStrength * delta *
        Math.min(speed / 35, 1);

    // Car movement
    const movement = speed / 3.6;

    carX -= Math.sin(yaw) * movement * delta;
    carZ -= Math.cos(yaw) * movement * delta;

    // Slight side slip
    if (handbrake && speed > 20) {
        carX += steering * delta * 2;
    }

    // Road boundaries
    if (carX > 8.2) carX = 8.2;
    if (carX < -8.2) carX = -8.2;

    // Suspension bounce
    const bump = Math.sin(carZ * 0.8) * 0.015;
    verticalBounce = approach(
        verticalBounce,
        bump,
        delta * 4
    );

    // Position and rotation
    car.position.set(carX, verticalBounce, carZ);
    car.rotation.y = yaw;

    // Body roll
    car.rotation.z = -steering * Math.min(speed / 100, 1) * 0.08;

    // Wheel steering and rotation
    for (const wheel of frontWheels) {
        wheel.rotation.y = steering * 0.35;
    }

    for (const wheel of wheels) {
        wheel.rotation.x -= movement * delta * 1.5;
    }

    steeringWheel.rotation.z = -steering * 0.65;

    updateGear();

    // Traffic movement
    for (const vehicle of traffic) {

        vehicle.object.position.z -=
            vehicle.speed * delta;

        if (vehicle.object.position.z < carZ - 120) {
            vehicle.object.position.z = carZ - 500 - Math.random() * 300;
        }
    }

    // HUD
    document.getElementById("speed").textContent =
        Math.round(speed) + " KM/H";

    document.getElementById("gear").textContent =
        "GEAR: " + gear;

    document.getElementById("rpm").textContent =
        "RPM: " + Math.round(rpm);

    document.getElementById("status").textContent =
        handbrake ? "HANDBRAKE" :
        braking ? "BRAKING" :
        accelerating ? "ACCELERATING" : "DRIVING";
}

// ==========================================
// MAIN RENDER LOOP
// ==========================================

function animate() {

    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    updateGame(delta);
    updateCamera();

    renderer.render(scene, camera);
}

// ==========================================
// RESIZE
// ==========================================

window.addEventListener("resize", function() {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

// ==========================================
// START GAME
// ==========================================

document.getElementById("loading").style.display = "none";

camera.position.set(0, 5, 10);

animate();

})();
</script>

</body>
</html>
