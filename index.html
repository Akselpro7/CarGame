<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Los Santos - GT-R Open World</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87b9dc;font-family:Arial,sans-serif}
canvas{display:block}
#hud{
 position:fixed;right:22px;bottom:20px;color:white;
 background:rgba(5,10,18,.78);padding:15px 20px;
 border:1px solid rgba(255,255,255,.2);border-radius:12px;
 min-width:165px;text-align:right;text-shadow:1px 2px 3px black
}
#speed{font-size:40px;font-weight:900}
#unit{font-size:12px;color:#ccc}
#gear,#rpm{font-size:16px;margin-top:5px}
#help{
 position:fixed;left:18px;bottom:18px;color:white;
 background:rgba(5,10,18,.7);padding:12px 15px;
 border-radius:9px;font-size:13px;line-height:1.7
}
#camera{
 position:fixed;top:18px;right:20px;color:white;
 background:rgba(0,0,0,.6);padding:10px 15px;border-radius:8px
}
#title{
 position:fixed;top:16px;left:50%;transform:translateX(-50%);
 color:white;font-weight:bold;letter-spacing:4px;
 text-shadow:2px 2px 5px black;font-size:18px
}
#gameover{
 display:none;position:fixed;inset:0;z-index:10;
 background:rgba(5,5,10,.88);color:white;
 align-items:center;justify-content:center;text-align:center;
 flex-direction:column
}
#gameover h1{font-size:65px;color:#ed2929;margin:0 0 10px}
#gameover p{font-size:20px}
#gameover button{
 background:#d82121;border:0;color:white;font-size:20px;
 font-weight:bold;padding:15px 35px;border-radius:8px;cursor:pointer
}
#flash{
 position:fixed;inset:0;pointer-events:none;
 background:rgba(255,255,255,0);z-index:5
}
#message{
 position:fixed;top:30%;left:50%;transform:translateX(-50%);
 color:white;font-weight:bold;font-size:28px;
 text-shadow:2px 3px 5px black;display:none
}
#error{
 display:none;position:fixed;inset:15px;background:#171717;
 color:white;padding:20px;z-index:20;white-space:pre-wrap
}
</style>
</head>
<body>
<div id="title">LOS SANTOS</div>
<div id="camera">CAMERA: THIRD PERSON</div>
<div id="hud">
 <div id="speed">0</div>
 <div id="unit">KM/H</div>
 <div id="gear">GEAR: N</div>
 <div id="rpm">RPM: 800</div>
</div>
<div id="help">
 <b>CONTROLS</b><br>
 W / ↑ Accelerate<br>
 S / ↓ Brake / Reverse<br>
 A / ← Turn left<br>
 D / → Turn right<br>
 SPACE Handbrake<br>
 C Change camera
</div>
<div id="flash"></div>
<div id="message"></div>
<div id="gameover">
 <h1>GAME OVER</h1>
 <p>Your Nissan GT-R crashed!</p>
 <p id="finalSpeed">Crash speed: 0 KM/H</p>
 <button onclick="restartGame()">RESTART GAME</button>
</div>
<div id="error"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

const errorBox=document.getElementById('error');
function showError(msg){
 errorBox.style.display='block';
 errorBox.textContent='GAME ERROR\n\n'+msg;
}
if(!window.THREE){showError('Three.js did not load.');return;}

try{

// SCENE
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x82b8df);
scene.fog=new THREE.Fog(0x82b8df,160,1000);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,2500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xcceaff,0x4a5037,1.5));

const sun=new THREE.DirectionalLight(0xffe5bd,2.3);
sun.position.set(-100,180,100);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-180;
sun.shadow.camera.right=180;
sun.shadow.camera.top=180;
sun.shadow.camera.bottom=-180;
scene.add(sun);

const mat=(color,roughness=.65,metalness=0)=>
 new THREE.MeshStandardMaterial({color,roughness,metalness});

const black=mat(0x080a0d,.35,.2);
const rubber=mat(0x101114,.9);
const metal=mat(0xb7c2ce,.25,.9);
const paint=mat(0x0c2e50,.22,.85);
const glass=mat(0x152b3d,.15,.5);
const roadMat=mat(0x292b30,.95);
const grass=mat(0x648d48);
const sidewalk=mat(0x99958b);
const yellow=mat(0xf2c94c);
const white=mat(0xffffff);
const red=mat(0xd20d18);
const buildingMats=[
 mat(0xc9a88e),mat(0xd3c5a6),mat(0x9caeae),
 mat(0xb4a08c),mat(0xd1b78e),mat(0x8d9da2),
 mat(0xbdb9ad),mat(0x9e8e83)
];

function box(parent,w,h,d,material,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

function cylinder(parent,r1,r2,h,material,x,y,z,segments=16){
 const m=new THREE.Mesh(
  new THREE.CylinderGeometry(r1,r2,h,segments),material
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 parent.add(m);
 return m;
}

// GROUND AND ROAD
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(1800,2600),grass
);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.2,-500);
ground.receiveShadow=true;
scene.add(ground);

const road=box(scene,34,.15,2200,roadMat,0,0,-500);
road.receiveShadow=true;
box(scene,1.5,.025,2200,yellow,0,.09,-500);

for(let z=400;z>-1700;z-=20){
 box(scene,.18,.025,9,white,6,.1,z);
 box(scene,.18,.025,9,white,-6,.1,z);
}
box(scene,5,.2,2200,sidewalk,20,.02,-500);
box(scene,5,.2,2200,sidewalk,-20,.02,-500);

// CITY
function building(x,z,w,h,d,index){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 scene.add(g);
 box(g,w,h,d,buildingMats[index%buildingMats.length],0,h/2,0);
 box(g,w+.4,.4,d+.4,mat(0x55595a),0,h,0);
 const windowMat=mat(0x263e50,.2,.4);
 for(let y=3;y<h-2;y+=4){
  for(let xx=-w/2+2;xx<w/2-1;xx+=4){
   box(g,1.5,1.6,.08,windowMat,xx,y,d/2+.05);
   box(g,1.5,1.6,.08,windowMat,xx,y,-d/2-.05);
  }
 }
}
for(let z=350;z>-1700;z-=65){
 for(const side of [-1,1]){
  building(side*(48+Math.random()*55),z,
   18+Math.random()*18,18+Math.random()*85,
   20+Math.random()*18,Math.floor(Math.random()*buildingMats.length));
 }
}

// PALM TREES
function palm(x,z){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 scene.add(g);
 cylinder(g,.25,.5,9,mat(0x795537),0,4.5,0,10);
 const leaves=mat(0x287541);
 for(let i=0;i<9;i++){
  const a=i*Math.PI*2/9;
  const leaf=new THREE.Mesh(
   new THREE.ConeGeometry(.55,7,5),leaves
  );
  leaf.position.set(Math.sin(a)*2.2,8,Math.cos(a)*2.2);
  leaf.rotation.z=Math.cos(a)*.9;
  leaf.rotation.x=Math.sin(a)*.9;
  g.add(leaf);
 }
}
for(let z=330;z>-1600;z-=40){
 palm(25,z);
 palm(-25,z-15);
}

// GTA 5 SIGN
const hill=new THREE.Mesh(
 new THREE.ConeGeometry(75,48,7),mat(0x526f38)
);
hill.position.set(105,22,-260);
hill.scale.set(1.6,1,.8);
hill.rotation.y=.3;
scene.add(hill);

const sign=new THREE.Group();
sign.position.set(105,43,-260);
scene.add(sign);
box(sign,58,13,1,mat(0xf1eee5),0,0,0);

const signCanvas=document.createElement('canvas');
signCanvas.width=1800;
signCanvas.height=400;
const ctx=signCanvas.getContext('2d');
ctx.fillStyle='#f5f2e9';
ctx.fillRect(0,0,1800,400);
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.font='bold 255px Arial';
ctx.fillStyle='#202020';
ctx.fillText('GTA 5',900,200);
const texture=new THREE.CanvasTexture(signCanvas);
const face=new THREE.Mesh(
 new THREE.PlaneGeometry(57,12),
 new THREE.MeshBasicMaterial({map:texture,side:THREE.DoubleSide})
);
face.position.z=.56;
sign.add(face);
for(const x of [-24,24]){
 box(sign,.8,9,.8,black,x,-10,0);
}

// NISSAN GT-R STYLE CAR
const car=new THREE.Group();
scene.add(car);

// Main body
box(car,4.6,1.05,8.5,paint,0,1.05,0);
box(car,4.4,.35,2.3,paint,0,1.55,-2.9);
box(car,4.3,.4,1.8,paint,0,1.5,3.3);

// Cabin
box(car,3.55,1.25,3.7,paint,0,2.05,-.25);
box(car,3.3,1.02,3.35,glass,0,2.2,-.25);
box(car,3.75,.15,3.8,black,0,2.72,-.25);

// Hood details
for(const x of [-1.15,1.15]){
 box(car,.45,.08,1.3,black,x,1.64,-2.8);
}
box(car,4.2,.12,2.7,paint,0,1.6,-2.7);

// Front grille
box(car,2.4,.48,.1,black,0,.85,-4.3);
box(car,1.3,.12,.12,metal,0,.9,-4.38);

// Headlights
const headlight=new THREE.MeshStandardMaterial({
 color:0xffffff,emissive:0xffffff,emissiveIntensity:2
});
for(const x of [-1.55,1.55]){
 box(car,.9,.2,.15,headlight,x,1.45,-4.32);
 box(car,.95,.22,.15,red,x,1.35,4.25);
}

// Rear spoiler
box(car,3.8,.15,.75,paint,0,2.05,3.9);
for(const x of [-1.35,1.35]){
 box(car,.12,.75,.12,black,x,2.3,3.7);
}
box(car,4,.15,.65,paint,0,2.7,3.8);

// Wheels
const wheels=[];
const wheelPivots=[];
for(const x of [-2.2,2.2]){
 for(const z of [-2.7,2.8]){
  const pivot=new THREE.Group();
  pivot.position.set(x,.72,z);
  car.add(pivot);
  wheelPivots.push(pivot);

  const tyre=new THREE.Mesh(
   new THREE.CylinderGeometry(.72,.72,.42,32),rubber
  );
  tyre.rotation.z=Math.PI/2;
  pivot.add(tyre);
  wheels.push(tyre);

  const rim=new THREE.Mesh(
   new THREE.CylinderGeometry(.45,.45,.44,24),metal
  );
  rim.rotation.z=Math.PI/2;
  pivot.add(rim);

  for(let i=0;i<8;i++){
   const a=i*Math.PI/4;
   const spoke=box(pivot,.08,.42,.08,black,
    0,Math.cos(a)*.22,Math.sin(a)*.22);
   spoke.rotation.x=a;
  }
 }
}

// Cockpit
box(car,3.4,.16,3.4,mat(0x191919),0,1.72,-.1);
box(car,3.2,.4,.6,black,0,2.1,-1.5);
box(car,1.2,.3,.12,mat(0x162d40),0,2.34,-1.6);

for(const x of [-.9,.9]){
 box(car,.9,1.2,.95,mat(0x171a1d),x,1.7,.4);
 box(car,.9,.8,.3,mat(0x24282c),x,2.25,.8);
}

// Steering wheel
const steering=new THREE.Group();
steering.position.set(-.9,2.3,-1.1);
car.add(steering);
const steeringRing=new THREE.Mesh(
 new THREE.TorusGeometry(.42,.065,12,32),black
);
steeringRing.rotation.y=Math.PI/2;
steering.add(steeringRing);
cylinder(steering,.13,.13,.16,metal,0,0,0);

// Driver
const skin=mat(0xc18b65);
const driverHead=new THREE.Mesh(
 new THREE.SphereGeometry(.26,18,18),skin
);
driverHead.position.set(-.9,2.62,.15);
car.add(driverHead);
box(car,.6,.65,.45,mat(0x202b3a),-.9,2.05,.2);
for(const x of [-.6,-1.1]){
 const arm=new THREE.Mesh(
  new THREE.CylinderGeometry(.09,.12,.85,12),mat(0x202b3a)
 );
 arm.position.set(x,2.15,-.45);
 arm.rotation.z=x<-.8?.5:-.5;
 car.add(arm);
}

// TRAFFIC
const traffic=[];
const trafficColors=[0xffffff,0x101010,0x174e8a,0x9b2222,0x888888,0xd4c29a];

function makeTraffic(z){
 const t=new THREE.Group();
 const body=mat(trafficColors[Math.floor(Math.random()*trafficColors.length)],.3,.45);
 box(t,3.5,1.05,6,body,0,1,0);
 box(t,2.8,.9,2.8,glass,0,1.85,-.1);
 for(const x of [-1.7,1.7]){
  for(const zz of [-2,2]){
   const w=new THREE.Mesh(
    new THREE.CylinderGeometry(.48,.48,.3,20),rubber
   );
   w.rotation.z=Math.PI/2;
   w.position.set(x,.52,zz);
   t.add(w);
  }
 }
 t.position.set((Math.random()-.5)*13,.1,z);
 t.userData.speed=8+Math.random()*15;
 scene.add(t);
 traffic.push(t);
}
for(let i=0;i<16;i++)makeTraffic(-55-i*65);

// GAME STATE
const keys={};
let velocity=0;
let steer=0;
let yaw=0;
let cameraMode=0;
let crashed=false;
let shake=0;
let crashTimer=0;
let lastTime=performance.now();
let sparks=[];

addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
 if(e.key.toLowerCase()==='c'&&!e.repeat&&!crashed){
  cameraMode=(cameraMode+1)%3;
 }
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

function crash(){
 if(crashed)return;
 crashed=true;
 const impactSpeed=Math.round(Math.abs(velocity)*3.6);
 document.getElementById('finalSpeed').textContent='Crash speed: '+impactSpeed+' KM/H';
 document.getElementById('gameover').style.display='flex';
 document.getElementById('message').style.display='block';
 document.getElementById('message').textContent='CRASH!';
 document.getElementById('flash').style.background='rgba(255,255,255,.85)';
 setTimeout(()=>{
  document.getElementById('flash').style.background='rgba(255,255,255,0)';
 },160);
 shake=1.5;
 velocity=0;
 createCrashSparks();
}

function createCrashSparks(){
 const sparkMat=new THREE.MeshBasicMaterial({color:0xffb52b});
 for(let i=0;i<35;i++){
  const p=new THREE.Mesh(
   new THREE.SphereGeometry(.07,6,6),sparkMat
  );
  p.position.copy(car.position);
  p.position.x+=(Math.random()-.5)*4;
  p.position.y=Math.random()*2;
  p.position.z-=Math.random()*4;
  scene.add(p);
  sparks.push({
   mesh:p,
   velocity:new THREE.Vector3(
    (Math.random()-.5)*20,
    Math.random()*15,
    (Math.random()-.5)*20
   ),
   life:.8+Math.random()*.7
  });
 }
}

function updateSparks(dt){
 for(let i=sparks.length-1;i>=0;i--){
  const s=sparks[i];
  s.life-=dt;
  s.velocity.y-=20*dt;
  s.mesh.position.addScaledVector(s.velocity,dt);
  if(s.life<=0){
   scene.remove(s.mesh);
   s.mesh.geometry.dispose();
   sparks.splice(i,1);
  }
 }
}

// COLLISION CHECK
function checkCollisions(){
 for(const t of traffic){
  const dx=car.position.x-t.position.x;
  const dz=car.position.z-t.position.z;
  if(Math.abs(dx)<3.5&&Math.abs(dz)<6.3){
   crash();
   return;
  }
 }
}

// DRIVING PHYSICS
function updatePhysics(dt){
 if(crashed)return;

 const forward=keys.w||keys.arrowup;
 const backward=keys.s||keys.arrowdown;
 const left=keys.a||keys.arrowleft;
 const right=keys.d||keys.arrowright;
 const handbrake=keys[' '];

 const maxSpeed=1000/3.6;

 if(forward){
  velocity+=42*dt;
 }
 if(backward){
  if(velocity>0)velocity-=85*dt;
  else velocity-=24*dt;
 }
 if(!forward&&!backward){
  velocity*=Math.pow(.994,dt*60);
 }
 if(handbrake){
  velocity*=Math.pow(.94,dt*60);
 }

 // Limit to 1000 km/h
 velocity=THREE.MathUtils.clamp(velocity,-35,maxSpeed);

 const steerInput=(left?1:0)-(right?1:0);
 steer+=(steerInput-steer)*Math.min(1,dt*4);

 const speedFactor=Math.min(Math.abs(velocity)/12,1);
 const direction=velocity>=0?1:-1;
 yaw+=steer*1.3*speedFactor*direction*dt;

 car.position.x-=Math.sin(yaw)*velocity*dt;
 car.position.z-=Math.cos(yaw)*velocity*dt;
 car.rotation.y=yaw;
 car.rotation.z=-steer*.045*speedFactor;

 wheelPivots[0].rotation.y=-steer*.42;
 wheelPivots[1].rotation.y=-steer*.42;
 for(const w of wheels)w.rotation.x-=velocity*dt*1.8;
 steering.rotation.z=-steer*.75;

 // Keep car near road
 car.position.x=THREE.MathUtils.clamp(car.position.x,-14,14);
}

// TRAFFIC
function updateTraffic(dt){
 if(crashed)return;
 for(const t of traffic){
  t.position.z+=t.userData.speed*dt;
  if(t.position.z>car.position.z+65){
   t.position.z=car.position.z-850-Math.random()*200;
   t.position.x=(Math.random()-.5)*13;
   t.userData.speed=8+Math.random()*18;
  }
 }
 checkCollisions();
}

// CAMERA
const cameraTarget=new THREE.Vector3();
function updateCamera(dt){
 let offset,look;
 if(cameraMode===0){
  offset=new THREE.Vector3(0,6,12);
  look=new THREE.Vector3(0,1,-7);
  document.getElementById('camera').textContent='CAMERA: THIRD PERSON';
 }else if(cameraMode===1){
  offset=new THREE.Vector3(-.6,2.65,-.15);
  look=new THREE.Vector3(-.6,2.5,-8);
  document.getElementById('camera').textContent='CAMERA: INTERIOR';
 }else{
  offset=new THREE.Vector3(0,2.2,-3);
  look=new THREE.Vector3(0,1,-15);
  document.getElementById('camera').textContent='CAMERA: HOOD';
 }

 const c=Math.cos(yaw),s=Math.sin(yaw);
 const pos=new THREE.Vector3(
  car.position.x+offset.x*c+offset.z*s,
  offset.y,
  car.position.z-offset.x*s+offset.z*c
 );
 cameraTarget.lerp(pos,Math.min(1,dt*5));
 camera.position.copy(cameraTarget);

 if(shake>0){
  camera.position.x+=(Math.random()-.5)*shake;
  camera.position.y+=(Math.random()-.5)*shake;
  shake=Math.max(0,shake-dt*2);
 }

 const target=new THREE.Vector3(
  car.position.x+look.x*c+look.z*s,
  look.y,
  car.position.z-look.x*s+look.z*c
 );
 camera.lookAt(target);
}

// HUD
function updateHUD(){
 document.getElementById('speed').textContent=
  Math.round(Math.abs(velocity)*3.6);
 document.getElementById('gear').textContent=
  'GEAR: '+(velocity>1?'D':velocity< -1?'R':'N');
 document.getElementById('rpm').textContent=
  'RPM: '+Math.round(800+Math.abs(velocity)*75);
}

// RESTART
window.restartGame=function(){
 crashed=false;
 velocity=0;
 steer=0;
 yaw=0;
 car.position.set(0,0,0);
 car.rotation.set(0,0,0);
 for(let i=0;i<traffic.length;i++){
  traffic[i].position.set((Math.random()-.5)*13,.1,-65-i*65);
 }
 for(const s of sparks)scene.remove(s.mesh);
 sparks=[];
 shake=0;
 document.getElementById('gameover').style.display='none';
 document.getElementById('message').style.display='none';
 document.getElementById('flash').style.background='rgba(255,255,255,0)';
};

// ANIMATION
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-lastTime)/1000,.04);
 lastTime=now;

 updatePhysics(dt);
 updateTraffic(dt);
 updateSparks(dt);
 updateCamera(dt);
 updateHUD();

 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

}catch(e){
 showError(e.stack||e.message||String(e));
}
})();
</script>
</body>
</html>
