<!DOCTYPE html>
<html>
<head>
<title>Realistic Car Simulator</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  font-family: Arial;
  background: #87ceeb;
}

canvas {
  display: block;
}

#speed {
  position: absolute;
  bottom: 25px;
  right: 25px;
  color: white;
  background: #111d;
  padding: 20px;
  border-radius: 12px;
  font-size: 26px;
}

#help {
  position: absolute;
  top: 20px;
  left: 20px;
  color: white;
  background: #111d;
  padding: 12px;
  border-radius: 8px;
}
</style>
</head>

<body>

<div id="speed">0 KM/H</div>
<div id="help">W = Gas | S = Brake | A/D = Steering</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 40, 250);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  500
);

camera.position.set(0, 1.6, 0);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// LIGHTING

scene.add(new THREE.HemisphereLight(0xffffff, 0x667755, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(-20, 40, 20);
scene.add(sun);

// MATERIALS

const roadMaterial = new THREE.MeshStandardMaterial({
  color: 0x292929,
  roughness: 0.9
});

const grassMaterial = new THREE.MeshStandardMaterial({
  color: 0x397b35
});

const whiteMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff
});

// GRASS

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  grassMaterial
);

ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.1, -200);
scene.add(ground);

// ROAD

const road = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 500),
  roadMaterial
);

road.rotation.x = -Math.PI / 2;
road.position.set(0, 0, -200);
scene.add(road);

// ROAD MARKINGS

const roadLines = [];

for (let i = 0; i < 40; i++) {
  const line = new THREE.Mesh(
    new THREE.BoxGeometry(0.2, 0.03, 5),
    whiteMaterial
  );

  line.position.set(0, 0.02, -i * 12);
  scene.add(line);
  roadLines.push(line);
}

// TREES

const trees = [];

function createTree(x, z) {
  const tree = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.2, 2),
    new THREE.MeshStandardMaterial({color: 0x654321})
  );

  trunk.position.y = 1;
  tree.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(1.4, 3.5, 8),
    new THREE.MeshStandardMaterial({color: 0x145c24})
  );

  leaves.position.y = 3.5;
  tree.add(leaves);

  tree.position.set(x, 0, z);
  scene.add(tree);
  trees.push(tree);
}

for (let i = 0; i < 40; i++) {
  createTree(-11, -i * 12);
  createTree(11, -i * 12);
}

// CAR INTERIOR

const interior = new THREE.Group();
camera.add(interior);
scene.add(camera);

const black = new THREE.MeshStandardMaterial({
  color: 0x111111,
  roughness: 0.6
});

const dashboard = new THREE.Mesh(
  new THREE.BoxGeometry(3.2, 0.5, 0.8),
  new THREE.MeshStandardMaterial({color: 0x24201d})
);

dashboard.position.set(0, -0.85, -1.2);
interior.add(dashboard);

// STEERING WHEEL

const wheel = new THREE.Mesh(
  new THREE.TorusGeometry(0.42, 0.06, 16, 48),
  black
);

wheel.position.set(-0.45, -0.48, -1);
interior.add(wheel);

// WHEEL CENTER

const hub = new THREE.Mesh(
  new THREE.CylinderGeometry(0.12, 0.12, 0.12, 32),
  black
);

hub.rotation.x = Math.PI / 2;
hub.position.copy(wheel.position);
interior.add(hub);

// WINDSHIELD FRAME

const frame = new THREE.Mesh(
  new THREE.BoxGeometry(3.8, 0.12, 0.15),
  black
);

frame.position.set(0, 1.15, -1.5);
interior.add(frame);

// CONTROLS

const keys = {};

window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

let speed = 0;
let steering = 0;
let carX = 0;

// GAME

function animate() {
  requestAnimationFrame(animate);

  if (keys["w"] || keys["arrowup"]) {
    speed = Math.min(speed + 0.15, 160);
  } else {
    speed = Math.max(speed - 0.04, 0);
  }

  if (keys["s"] || keys["arrowdown"]) {
    speed = Math.max(speed - 0.4, 0);
  }

  if (keys["a"] || keys["arrowleft"]) {
    steering = Math.min(steering + 0.025, 0.6);
  } else if (keys["d"] || keys["arrowright"]) {
    steering = Math.max(steering - 0.025, -0.6);
  } else {
    steering *= 0.92;
  }

  carX += steering * speed * 0.0008;
  carX = THREE.MathUtils.clamp(carX, -5, 5);

  camera.position.x = carX;
  wheel.rotation.z = -steering * 1.5;

  const movement = speed * 0.018;

  roadLines.forEach(line => {
    line.position.z += movement;

    if (line.position.z > 5) {
      line.position.z -= 480;
    }
  });

  trees.forEach(tree => {
    tree.position.z += movement;

    if (tree.position.z > 5) {
      tree.position.z -= 480;
    }
  });

  document.getElementById("speed").textContent =
    Math.round(speed) + " KM/H";

  renderer.render(scene, camera);
}

animate();

// RESIZE

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
