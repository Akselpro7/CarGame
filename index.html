<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Los Santos GT-R</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#80b6dc;font-family:Arial,sans-serif}
canvas{display:block}
#hud{
 position:fixed;right:18px;bottom:18px;
 background:rgba(4,9,17,.82);color:white;
 padding:15px 20px;border-radius:12px;
 min-width:170px;text-align:right;
 border:1px solid #56606b;
 text-shadow:1px 2px 3px black
}
#speed{font-size:42px;font-weight:900}
#unit{font-size:12px;color:#ccc}
#gear,#rpm{font-size:15px;margin-top:5px}
#nitroBox{margin-top:12px;text-align:left}
#nitroBar{height:12px;background:#303b48;border-radius:8px;overflow:hidden}
#nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#087bff,#00eaff)}
#nitroText{font-size:12px;margin-bottom:5px;color:#00cfff}
#help{
 position:fixed;left:15px;bottom:15px;
 color:white;background:rgba(0,0,0,.7);
 padding:12px;border-radius:8px;
 font-size:13px;line-height:1.65
}
#camera{
 position:fixed;right:18px;top:18px;
 background:#0009;color:white;padding:10px;border-radius:8px
}
#logo{
 position:fixed;top:13px;left:50%;transform:translateX(-50%);
 font-size:23px;font-weight:1000;letter-spacing:3px;
 color:white;text-shadow:2px 3px 4px #222
}
#logo span{color:#35d65b}
#gameover{
 display:none;position:fixed;inset:0;z-index:10;
 background:#05050beF;color:white;
 align-items:center;justify-content:center;
 flex-direction:column;text-align:center
}
#gameover h1{font-size:65px;color:#ed2929;margin:0}
#gameover button{
 background:#db2020;color:white;border:0;
 padding:15px 35px;border-radius:8px;
 font-size:20px;font-weight:bold;cursor:pointer
}
#message{
 display:none;position:fixed;top:35%;left:50%;
 transform:translateX(-50%);color:white;
 font-size:40px;font-weight:bold;
 text-shadow:2px 2px 5px black;z-index:6
}
#error{
 display:none;position:fixed;inset:10px;
 z-index:20;background:#171717;color:white;padding:20px
}
</style>
</head>
<body>
<div id="logo">GRAND THEFT <span>LOS SANTOS</span></div>
<div id="camera">THIRD PERSON</div>
<div id="hud">
 <div id="speed">0</div>
 <div id="unit">KM/H</div>
 <div id="gear">GEAR: N</div>
 <div id="rpm">RPM: 800</div>
 <div id="nitroBox">
  <div id="nitroText">NITRO BOOST [SHIFT]</div>
  <div id="nitroBar"><div id="nitroFill"></div></div>
 </div>
</div>
<div id="help">
 <b>DRIVING CONTROLS</b><br>
 W / ↑ Accelerate<br>
 S / ↓ Brake<br>
 A / ← Turn left<br>
 D / → Turn right<br>
 SPACE Handbrake<br>
 SHIFT Nitro boost<br>
 C Change camera
</div>
<div id="message">CRASH!</div>
<div id="gameover">
 <h1>GAME OVER</h1>
 <p>Your GT-R crashed!</p>
 <p id="crashSpeed">Crash speed: 0 KM/H</p>
 <button onclick="restartGame()">RESTART GAME</button>
</div>
<div id="error"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';

const error=document.getElementById('error');
function fail(e){
 error.style.display='block';
 error.textContent='GAME ERROR\n'+e;
}
if(!window.THREE){fail('Three.js failed to load');return;}

try{

// PERFORMANCE SETTINGS
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x82b8df);
scene.fog=new THREE.Fog(0x82b8df,170,750);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.2,1800);
const renderer=new THREE.WebGLRenderer({
 antialias:false,powerPreference:'high-performance'
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=false;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd7efff,0x51513b,1.8));
const sun=new THREE.DirectionalLight(0xffe6bd,2);
sun.position.set(-80,150,70);
scene.add(sun);

const mat=(c,r=.7,m=0)=>new THREE.MeshStandardMaterial({
 color:c,roughness:r,metalness:m
});

const black=mat(0x090b0f,.4,.2);
const rubber=mat(0x101114,.95);
const metal=mat(0xb5c0cb,.25,.9);
const paint=mat(0x102e50,.2,.85);
const glass=mat(0x122a40,.15,.5);
const leather=mat(0x211b19,.9);
const dashboardMat=mat(0x111519,.85);
const red=mat(0xd20d18);
const roadMat=mat(0x292c31);
const grass=mat(0x658d49);
const sidewalk=mat(0x9a978c);
const white=mat(0xffffff);
const yellow=mat(0xeac64b);
const buildings=[
 mat(0xc9a98f),mat(0xd1c3a5),mat(0x9aabad),
 mat(0xb9a18d),mat(0xd1b68d),mat(0x929b9d)
];

function box(parent,w,h,d,material,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 o.position.set(x,y,z);
 parent.add(o);
 return o;
}
function cyl(parent,r1,r2,h,material,x,y,z,n=12){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,n),material);
 o.position.set(x,y,z);
 parent.add(o);
 return o;
}

// WORLD
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(900,1800),grass
);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.2,-400);
scene.add(ground);

const road=box(scene,34,.12,1800,roadMat,0,0,-400);
box(scene,1.5,.03,1800,yellow,0,.08,-400);
box(scene,4,.16,1800,sidewalk,20,.02,-400);
box(scene,4,.16,1800,sidewalk,-20,.02,-400);

for(let z=350;z>-1300;z-=22){
 box(scene,.18,.03,9,white,6,.09,z);
 box(scene,.18,.03,9,white,-6,.09,z);
}

// Buildings: reduced detail to improve FPS
function building(x,z,w,h,d,index){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 scene.add(g);
 box(g,w,h,d,buildings[index%buildings.length],0,h/2,0);
 box(g,w+.3,.35,d+.3,mat(0x55595c),0,h,0);
 const win=mat(0x263e50,.25,.35);
 for(let y=4;y<h-3;y+=8){
  for(let xx=-w/2+3;xx<w/2-1;xx+=7){
   box(g,2,2,.08,win,xx,y,d/2+.05);
  }
 }
}
for(let z=300;z>-1250;z-=85){
 for(const side of [-1,1]){
  building(side*(45+Math.random()*45),z,
   18+Math.random()*15,18+Math.random()*70,
   20+Math.random()*12,Math.floor(Math.random()*buildings.length));
 }
}

// PALM TREES
const trunkMat=mat(0x785437);
const leafMat=mat(0x287342);
function palm(x,z){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 scene.add(g);
 cyl(g,.25,.45,8,trunkMat,0,4,0);
 for(let i=0;i<7;i++){
  const a=i*Math.PI*2/7;
  const leaf=new THREE.Mesh(
   new THREE.ConeGeometry(.5,6,5),leafMat
  );
  leaf.position.set(Math.sin(a)*2,7,Math.cos(a)*2);
  leaf.rotation.z=Math.cos(a)*.9;
  leaf.rotation.x=Math.sin(a)*.9;
  g.add(leaf);
 }
}
for(let z=280;z>-1250;z-=65){
 palm(24,z);
 palm(-24,z-20);
}

// GTA-INSPIRED SIGN
const hill=new THREE.Mesh(
 new THREE.ConeGeometry(65,42,7),mat(0x526e38)
);
hill.position.set(95,19,-260);
hill.scale.set(1.5,1,.8);
scene.add(hill);

const sign=new THREE.Group();
sign.position.set(95,39,-260);
scene.add(sign);
box(sign,55,12,1,mat(0xf4f1e7),0,0,0);

const logoCanvas=document.createElement('canvas');
logoCanvas.width=1400;
logoCanvas.height=320;
const lc=logoCanvas.getContext('2d');
lc.fillStyle='#f5f2e9';
lc.fillRect(0,0,1400,320);
lc.textAlign='center';
lc.textBaseline='middle';
lc.font='bold 210px Arial Black,Arial';
lc.fillStyle='#151515';
lc.fillText('GTA 5',700,155);
const logoTexture=new THREE.CanvasTexture(logoCanvas);
const signFace=new THREE.Mesh(
 new THREE.PlaneGeometry(54,11),
 new THREE.MeshBasicMaterial({map:logoTexture,side:THREE.DoubleSide})
);
signFace.position.z=.56;
sign.add(signFace);

// CAR
const car=new THREE.Group();
scene.add(car);

// Body panels
box(car,4.6,1.05,8.5,paint,0,1.05,0);
box(car,4.4,.35,2.2,paint,0,1.55,-2.9);
box(car,4.3,.35,1.8,paint,0,1.5,3.3);

// Roof and windows
box(car,3.6,1.2,3.7,paint,0,2.05,-.2);
box(car,3.35,.95,3.4,glass,0,2.18,-.2);
box(car,3.8,.15,3.8,black,0,2.7,-.2);

// Hood vents
for(const x of [-1.15,1.15]){
 box(car,.5,.08,1.3,black,x,1.62,-2.8);
}

// Front grille and lights
box(car,2.3,.45,.12,black,0,.85,-4.3);
const lightMat=new THREE.MeshStandardMaterial({
 color:0xffffff,emissive:0xffffff,emissiveIntensity:1.5
});
for(const x of [-1.55,1.55]){
 box(car,.85,.2,.12,lightMat,x,1.48,-4.32);
 box(car,.9,.23,.12,red,x,1.45,4.25);
}

// Rear spoiler
box(car,3.8,.15,.7,paint,0,2.05,3.9);
for(const x of [-1.3,1.3])box(car,.12,.7,.12,black,x,2.3,3.7);
box(car,4,.15,.6,paint,0,2.7,3.8);

// Wheels
const wheels=[];
const pivots=[];
for(const x of [-2.2,2.2]){
 for(const z of [-2.7,2.8]){
  const p=new THREE.Group();
  p.position.set(x,.72,z);
  car.add(p);
  pivots.push(p);
  const tyre=new THREE.Mesh(
   new THREE.CylinderGeometry(.72,.72,.42,20),rubber
  );
  tyre.rotation.z=Math.PI/2;
  p.add(tyre);
  wheels.push(tyre);
  const rim=new THREE.Mesh(
   new THREE.CylinderGeometry(.44,.44,.44,16),metal
  );
  rim.rotation.z=Math.PI/2;
  p.add(rim);
 }
}

// IMPROVED INTERIOR
// Floor
box(car,3.5,.18,3.8,black,0,1.55,-.1);

// Dashboard with layered details
box(car,3.35,.55,.7,dashboardMat,0,2.1,-1.45);
box(car,1.2,.35,.12,mat(0x172c3a),0,2.4,-1.65);
box(car,.85,.2,.08,mat(0x050b12),0,2.12,-1.85);

// Instrument display
const displayCanvas=document.createElement('canvas');
displayCanvas.width=512;displayCanvas.height=256;
const dc=displayCanvas.getContext('2d');
dc.fillStyle='#06111c';dc.fillRect(0,0,512,256);
dc.fillStyle='#00cfff';dc.font='bold 48px Arial';
dc.fillText('GT-R',30,80);
dc.fillStyle='#b9f2ff';dc.font='25px Arial';
dc.fillText('SPORT MODE',30,145);
dc.fillText('ENGINE SYSTEM',30,190);
const displayTexture=new THREE.CanvasTexture(displayCanvas);
const display=new THREE.Mesh(
 new THREE.PlaneGeometry(.95,.43),
 new THREE.MeshBasicMaterial({map:displayTexture})
);
display.position.set(0,2.4,-1.56);
car.add(display);

// Center console
box(car,.8,.3,1.1,black,0,1.85,-.15);
box(car,.5,.08,.6,metal,0,2.02,-.25);
cyl(car,.12,.1,.38,black,0,2.12,.4,12);

// Seats
for(const x of [-.9,.9]){
 box(car,.9,1.15,1,leather,x,1.85,.5);
 box(car,.9,.75,.3,leather,x,2.4,.85);
 box(car,.65,.12,.6,mat(0x5a1717),x,2.25,.1);
}

// Door panels
for(const x of [-1.7,1.7]){
 box(car,.16,.75,3,leather,x,1.95,0);
 box(car,.08,.08,1,metal,x*1.01,2.15,-.2);
}

// Steering wheel
const steering=new THREE.Group();
steering.position.set(-.9,2.32,-1.05);
car.add(steering);
const wheelRing=new THREE.Mesh(
 new THREE.TorusGeometry(.4,.065,10,28),black
);
wheelRing.rotation.y=Math.PI/2;
steering.add(wheelRing);
cyl(steering,.13,.13,.18,metal,0,0,0);
box(steering,.12,.07,.55,metal,0,0,0);

// Mirrors
for(const x of [-1.85,1.85]){
 const mirror=box(car,.4,.2,.45,black,x,2.15,-1.2);
 mirror.rotation.z=x>0?-.1:.1;
}

// Driver
const skin=mat(0xc18b65);
const driverHead=new THREE.Mesh(
 new THREE.SphereGeometry(.25,14,14),skin
);
driverHead.position.set(-.9,2.65,.12);
car.add(driverHead);
box(car,.55,.7,.45,mat(0x202b3a),-.9,2.05,.2);
for(const x of [-.6,-1.1]){
 const arm=new THREE.Mesh(
  new THREE.CylinderGeometry(.09,.12,.8,8),mat(0x202b3a)
 );
 arm.position.set(x,2.18,-.45);
 arm.rotation.z=x<-.8?.5:-.5;
 car.add(arm);
}

// NITRO EXHAUSTS
const nitroFlames=[];
const flameMat=new THREE.MeshBasicMaterial({
 color:0x00bfff,transparent:true,opacity:.85
});
for(const x of [-.85,.85]){
 const flame=new THREE.Mesh(
  new THREE.ConeGeometry(.28,1.6,8),flameMat
 );
 flame.rotation.x=-Math.PI/2;
 flame.position.set(x,.8,4.65);
 flame.visible=false;
 car.add(flame);
 nitroFlames.push(flame);
}
const exhaustGlow=new THREE.PointLight(0x009dff,0,12);
exhaustGlow.position.set(0,1,4.5);
car.add(exhaustGlow);

// TRAFFIC
const traffic=[];
const trafficColors=[0xffffff,0x121212,0x164d82,0x9e2525,0x888888];
const trafficGlass=mat(0x223d52,.3,.25);
function createTraffic(z){
 const t=new THREE.Group();
 const color=mat(trafficColors[Math.floor(Math.random()*trafficColors.length)]);
 box(t,3.5,1.1,6,color,0,1,0);
 box(t,2.8,.8,2.8,trafficGlass,0,1.8,-.1);
 for(const x of [-1.7,1.7]){
  for(const zz of [-2,2]){
   const w=new THREE.Mesh(
    new THREE.CylinderGeometry(.45,.45,.3,12),rubber
   );
   w.rotation.z=Math.PI/2;
   w.position.set(x,.5,zz);
   t.add(w);
  }
 }
 t.position.set((Math.random()-.5)*13,.1,z);
 t.userData.speed=8+Math.random()*12;
 scene.add(t);
 traffic.push(t);
}
for(let i=0;i<12;i++)createTraffic(-65-i*85);

// INPUT
const keys={};
let velocity=0;
let steer=0;
let yaw=0;
let cameraMode=0;
let nitro=100;
let nitroActive=false;
let crashed=false;
let shake=0;
let sparks=[];
let lastTime=performance.now();

addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
 if(e.key.toLowerCase()==='c'&&!e.repeat&&!crashed)cameraMode=(cameraMode+1)%3;
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

// CRASH EFFECT
function makeSparks(){
 const sparkMaterial=new THREE.MeshBasicMaterial({color:0xffbd35});
 for(let i=0;i<24;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(.07,5,5),sparkMaterial);
  m.position.copy(car.position);
  m.position.y+=1+Math.random()*2;
  scene.add(m);
  sparks.push({
   mesh:m,
   vx:(Math.random()-.5)*22,
   vy:Math.random()*15,
   vz:(Math.random()-.5)*22,
   life:1
  });
 }
}
function crash(){
 if(crashed)return;
 crashed=true;
 nitroActive=false;
 const s=Math.round(Math.abs(velocity)*3.6);
 document.getElementById('crashSpeed').textContent='Crash speed: '+s+' KM/H';
 document.getElementById('gameover').style.display='flex';
 document.getElementById('message').style.display='block';
 makeSparks();
 shake=1.5;
 velocity=0;
}
function updateSparks(dt){
 for(let i=sparks.length-1;i>=0;i--){
  const s=sparks[i];
  s.life-=dt;
  s.vy-=18*dt;
  s.mesh.position.x+=s.vx*dt;
  s.mesh.position.y+=s.vy*dt;
  s.mesh.position.z+=s.vz*dt;
  if(s.life<=0){
   scene.remove(s.mesh);
   s.mesh.geometry.dispose();
   sparks.splice(i,1);
  }
 }
}

// DRIVING + NITRO
function updatePhysics(dt){
 if(crashed){
  nitroActive=false;
  nitroFlames.forEach(f=>f.visible=false);
  exhaustGlow.intensity=0;
  return;
 }

 const forward=keys.w||keys.arrowup;
 const backward=keys.s||keys.arrowdown;
 const left=keys.a||keys.arrowleft;
 const right=keys.d||keys.arrowright;
 const handbrake=keys[' '];

 nitroActive=!!keys.shift&&nitro>0&&velocity>0;

 const maxSpeed=1000/3.6;
 if(forward)velocity+=(nitroActive?115:42)*dt;
 if(backward)velocity-=velocity>0?85*dt:24*dt;
 if(!forward&&!backward)velocity*=Math.pow(.994,dt*60);
 if(handbrake)velocity*=Math.pow(.94,dt*60);

 if(nitroActive){
  nitro=Math.max(0,nitro-30*dt);
  velocity+=65*dt;
 }else{
  nitro=Math.min(100,nitro+9*dt);
 }

 velocity=THREE.MathUtils.clamp(velocity,-35,maxSpeed);

 const input=(left?1:0)-(right?1:0);
 steer+=(input-steer)*Math.min(1,dt*4);
 const factor=Math.min(Math.abs(velocity)/12,1);
 const direction=velocity>=0?1:-1;
 yaw+=steer*1.3*factor*direction*dt;

 car.position.x-=Math.sin(yaw)*velocity*dt;
 car.position.z-=Math.cos(yaw)*velocity*dt;
 car.rotation.y=yaw;
 car.rotation.z=-steer*.04*factor;

 pivots[0].rotation.y=-steer*.42;
 pivots[1].rotation.y=-steer*.42;
 for(const w of wheels)w.rotation.x-=velocity*dt*1.8;
 steering.rotation.z=-steer*.7;

 // Nitro flame animation
 for(const f of nitroFlames){
  f.visible=nitroActive;
  if(nitroActive){
   f.scale.setScalar(.7+Math.random()*.6);
  }
 }
 exhaustGlow.intensity=nitroActive?4:0;
 document.getElementById('nitroFill').style.width=nitro+'%';
 document.getElementById('nitroText').textContent=
  nitroActive?'NITRO ACTIVE!':'NITRO BOOST [SHIFT]';

 car.position.x=THREE.MathUtils.clamp(car.position.x,-14,14);
}

// TRAFFIC AND COLLISION
function updateTraffic(dt){
 if(crashed)return;
 for(const t of traffic){
  t.position.z+=t.userData.speed*dt;
  if(t.position.z>car.position.z+65){
   t.position.z=car.position.z-900-Math.random()*200;
   t.position.x=(Math.random()-.5)*13;
   t.userData.speed=8+Math.random()*15;
  }
  const dx=car.position.x-t.position.x;
  const dz=car.position.z-t.position.z;
  if(Math.abs(dx)<3.6&&Math.abs(dz)<6.1){
   crash();
   break;
  }
 }
}

// CAMERA
const cameraTarget=new THREE.Vector3();
function updateCamera(dt){
 let offset,look;
 if(cameraMode===0){
  offset=new THREE.Vector3(0,6,12);
  look=new THREE.Vector3(0,1,-7);
  document.getElementById('camera').textContent='THIRD PERSON';
 }else if(cameraMode===1){
  offset=new THREE.Vector3(-.6,2.65,-.15);
  look=new THREE.Vector3(-.6,2.5,-8);
  document.getElementById('camera').textContent='COCKPIT CAMERA';
 }else{
  offset=new THREE.Vector3(0,2.2,-3);
  look=new THREE.Vector3(0,1,-15);
  document.getElementById('camera').textContent='HOOD CAMERA';
 }

 const c=Math.cos(yaw),s=Math.sin(yaw);
 const pos=new THREE.Vector3(
  car.position.x+offset.x*c+offset.z*s,
  offset.y,
  car.position.z-offset.x*s+offset.z*c
 );
 cameraTarget.lerp(pos,Math.min(1,dt*5));
 camera.position.copy(cameraTarget);
 if(shake>0){
  camera.position.x+=(Math.random()-.5)*shake;
  camera.position.y+=(Math.random()-.5)*shake;
  shake=Math.max(0,shake-dt*2);
 }
 const target=new THREE.Vector3(
  car.position.x+look.x*c+look.z*s,
  look.y,
  car.position.z-look.x*s+look.z*c
 );
 camera.lookAt(target);
}

// HUD
function updateHUD(){
 document.getElementById('speed').textContent=
  Math.round(Math.abs(velocity)*3.6);
 document.getElementById('gear').textContent=
  'GEAR: '+(velocity>1?'D':velocity< -1?'R':'N');
 document.getElementById('rpm').textContent=
  'RPM: '+Math.round(800+Math.abs(velocity)*70);
}

// RESTART
window.restartGame=function(){
 crashed=false;
 velocity=0;steer=0;yaw=0;nitro=100;
 car.position.set(0,0,0);
 car.rotation.set(0,0,0);
 traffic.forEach((t,i)=>{
  t.position.set((Math.random()-.5)*13,.1,-70-i*85);
 });
 sparks.forEach(s=>scene.remove(s.mesh));
 sparks=[];
 shake=0;
 document.getElementById('gameover').style.display='none';
 document.getElementById('message').style.display='none';
 document.getElementById('nitroFill').style.width='100%';
};

// MAIN LOOP
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-lastTime)/1000,.035);
 lastTime=now;
 updatePhysics(dt);
 updateTraffic(dt);
 updateSparks(dt);
 updateCamera(dt);
 updateHUD();
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

}catch(e){fail(e.stack||e.message||String(e));}
})();
</script>
</body>
</html>
