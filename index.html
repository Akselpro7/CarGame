
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GT-R Ultimate Simulator</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;background:#87bde0;font-family:Arial}
canvas{display:block}
#hud{
position:fixed;inset:0;pointer-events:none;color:white;
}
.panel{
position:absolute;background:rgba(5,10,18,.85);
padding:14px 18px;border-radius:9px;
}
#help{top:15px;left:15px;line-height:1.8;font-size:14px}
#brand{top:15px;right:15px;color:#ff3048;font-weight:bold}
#speed{
right:22px;bottom:22px;font-size:30px;
border:2px solid #ed1935;border-radius:12px;
}
#gear{right:25px;bottom:100px;font-size:17px}
#rpm{right:25px;bottom:145px;font-size:15px}
#cameraMode{bottom:20px;left:20px}
#crosshair{
position:absolute;left:50%;top:50%;
width:5px;height:5px;border-radius:50%;
background:white;opacity:.3;
}
</style>
</head>

<body>

<div id="hud">
<div id="help" class="panel">
<b>CONTROLS</b><br>
W / ↑ — GAS<br>
S / ↓ — BRAKE<br>
A / ← — LEFT<br>
D / → — RIGHT<br>
C — CAMERA<br>
SPACE — HANDBRAKE
</div>

<div id="brand" class="panel">NISSAN GT-R R35</div>
<div id="rpm" class="panel">RPM: 800</div>
<div id="gear" class="panel">GEAR: 1</div>
<div id="speed" class="panel">0 KM/H</div>
<div id="cameraMode" class="panel">FIRST PERSON</div>
<div id="crosshair"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ===========================================
// 1. GAME ENGINE
// ===========================================

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x83c9ed);
scene.fog=new THREE.Fog(0x83c9ed,150,1600);

const camera=new THREE.PerspectiveCamera(
75,innerWidth/innerHeight,0.1,5000
);

const renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;

document.body.appendChild(renderer.domElement);

// ===========================================
// 2. LIGHTING
// ===========================================

scene.add(new THREE.HemisphereLight(0xd9edff,0x536044,2));

const sun=new THREE.DirectionalLight(0xffefcf,2.5);
sun.position.set(-100,180,100);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

// ===========================================
// 3. MATERIAL LIBRARY
// ===========================================

function material(color,roughness=.5,metalness=0){
return new THREE.MeshStandardMaterial({
color,roughness,metalness
});
}

const paint=material(0xb60020,.22,.8);
const paintDark=material(0x5d0010,.3,.6);
const black=material(0x090c11,.3,.5);
const rubber=material(0x101010,.9);
const chrome=material(0xb8c1c9,.2,.95);
const white=material(0xffffff,.25);
const leather=material(0x17191d,.8);
const skin=material(0xc88d6c);
const grass=material(0x527d3c);
const asphalt=material(0x292d33);
const concrete=material(0x888b88);
const glass=new THREE.MeshPhysicalMaterial({
color:0x263c50,
roughness:.1,
metalness:.4,
transparent:true,
opacity:.55
});

const windowDark=material(0x142332,.2,.4);

// ===========================================
// 4. OBJECT CREATION HELPERS
// ===========================================

function addBox(parent,w,h,d,mat,x,y,z){
const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
m.position.set(x,y,z);
m.castShadow=true;
m.receiveShadow=true;
parent.add(m);
return m;
}

function addCylinder(parent,r1,r2,h,mat,x,y,z,segments=24){
const m=new THREE.Mesh(
new THREE.CylinderGeometry(r1,r2,h,segments),mat
);
m.position.set(x,y,z);
m.castShadow=true;
parent.add(m);
return m;
}

// ===========================================
// 5. OPEN WORLD TERRAIN
// ===========================================

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(6000,16000),
grass
);

ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.2,-7500);
ground.receiveShadow=true;
scene.add(ground);

// Main highway

const highway=addBox(
scene,34,.12,16000,asphalt,0,-.08,-7500
);

// Road edges

for(const x of [-17,17]){
addBox(scene,2,.18,16000,concrete,x,-.02,-7500);
}

// Road markings

const roadMarks=[];

for(let i=0;i<400;i++){
const mark=addBox(
scene,.18,.04,10,white,0,.01,-i*40
);
roadMarks.push(mark);
}

// Additional lane lines

for(const x of [-6,6]){
for(let i=0;i<200;i++){
addBox(
scene,.1,.025,5,white,x,.02,-i*80
);
}
}

// ===========================================
// 6. MOUNTAINS
// ===========================================

for(let i=0;i<45;i++){

const mountain=new THREE.Mesh(
new THREE.ConeGeometry(70+Math.random()*90,
120+Math.random()*100,8),
material(0x758d94)
);

mountain.position.set(
(i-22)*145,
40,
-700-Math.random()*1500
);

mountain.castShadow=true;
scene.add(mountain);
}

// ===========================================
// 7. FOREST
// ===========================================

const trees=[];

function makeTree(x,z){

const group=new THREE.Group();

const trunk=addCylinder(
group,.3,.45,4,material(0x67412a),0,2,0
);

const leaves=new THREE.Mesh(
new THREE.ConeGeometry(2.5,7,9),
material(0x17602b)
);

leaves.position.y=6;
leaves.castShadow=true;
group.add(leaves);

group.scale.setScalar(.8+Math.random()*.8);
group.position.set(x,0,z);
scene.add(group);
trees.push(group);
}

for(let i=0;i<250;i++){
const z=-Math.random()*15000;
makeTree(-25-Math.random()*140,z);
makeTree(25+Math.random()*140,z);
}

// ===========================================
// 8. CITY AND BUILDINGS
// ===========================================

const buildings=[];

function makeBuilding(x,z){

const group=new THREE.Group();

const width=12+Math.random()*16;
const height=15+Math.random()*65;
const depth=12+Math.random()*18;

const colors=[0x9caaa9,0x99958b,0x788b9c,0xb2b0a5];

addBox(
group,width,height,depth,
material(colors[Math.floor(Math.random()*4)]),
0,height/2,0
);

for(let y=4;y<height-2;y+=5){
for(let xx=-width/2+2;xx<width/2-1;xx+=4){

addBox(
group,2,2,.08,windowDark,
xx,y,depth/2+.05
);

addBox(
group,2,2,.08,windowDark,
xx,y,-depth/2-.05
);
}
}

group.position.set(x,0,z);
scene.add(group);
buildings.push(group);
}

for(let i=0;i<100;i++){
makeBuilding(-65-Math.random()*140,-100-i*160);
makeBuilding(65+Math.random()*140,-100-i*160);
}

// ===========================================
// 9. STREET LIGHTS
// ===========================================

for(let i=0;i<80;i++){

for(const side of [-1,1]){

const x=side*20;
const z=-i*170;

addCylinder(
scene,.13,.16,8,black,x,4,z
);

addBox(
scene,3,.12,.15,black,
x-side*1.4,8,z
);

const lamp=addBox(
scene,.5,.15,.5,white,
x-side*2.7,7.9,z
);

}
}

// ===========================================
// 10. NISSAN GT-R R35 BODY
// ===========================================

const car=new THREE.Group();
scene.add(car);

// Main body

addBox(car,2.12,.7,4.7,paint,0,.75,0);

// Lower body

addBox(car,2.2,.3,4.2,paintDark,0,.42,0);

// Hood

addBox(car,2,.14,1.45,paint,0,1.1,-1.42);

// Roof

addBox(car,1.72,.14,1.8,paint,0,1.93,.1);

// Windshield

const windshield=new THREE.Mesh(
new THREE.BoxGeometry(1.78,.9,.07),glass
);
windshield.position.set(0,1.49,-.83);
windshield.rotation.x=-.3;
car.add(windshield);

// Rear windshield

const rearWindow=new THREE.Mesh(
new THREE.BoxGeometry(1.7,.7,.07),glass
);
rearWindow.position.set(0,1.5,1.08);
rearWindow.rotation.x=.35;
car.add(rearWindow);

// Side windows

for(const side of [-1,1]){

addBox(
car,.055,.68,1.7,windowDark,
side*.88,1.51,.1
);

// Side mirrors

addBox(
car,.3,.16,.35,black,
side*1.17,1.26,-.85
);
}

// Bumpers

addBox(car,2.15,.35,.4,black,0,.48,-2.4);
addBox(car,2.15,.35,.4,black,0,.48,2.4);

// Front grille

addBox(car,.95,.3,.05,black,0,.72,-2.6);

// Hood vents

for(const side of [-1,1]){
addBox(car,.35,.045,.65,black,side*.65,1.19,-1.4);
}

// Headlights

for(const side of [-1,1]){

const light=addBox(
car,.48,.2,.08,white,
side*.75,1,-2.43
);

light.material.emissive=new THREE.Color(0x7799bb);
light.material.emissiveIntensity=.4;
}

// Rear lights

for(const side of [-1,1]){

const tail=new THREE.Mesh(
new THREE.TorusGeometry(.17,.045,12,28),
material(0xff1028)
);

tail.position.set(side*.7,.85,2.42);
car.add(tail);
}

// Spoiler

for(const side of [-1,1]){
addBox(car,.1,.45,.13,black,side*.7,1.35,1.8);
}

addBox(car,2.1,.13,.45,black,0,1.58,1.85);

// Exhaust

for(const side of [-1,1]){
const exhaust=addCylinder(
car,.14,.14,.3,chrome,side*.72,.43,2.55
);
exhaust.rotation.x=Math.PI/2;
}

// ===========================================
// 11. WHEELS
// ===========================================

const wheels=[];
const frontWheels=[];

function makeWheel(x,z,isFront){

const wheel=new THREE.Group();

const tire=new THREE.Mesh(
new THREE.CylinderGeometry(.43,.43,.27,40),
rubber
);
tire.rotation.z=Math.PI/2;
wheel.add(tire);

const rim=new THREE.Mesh(
new THREE.CylinderGeometry(.3,.3,.29,32),
chrome
);
rim.rotation.z=Math.PI/2;
wheel.add(rim);

const hub=new THREE.Mesh(
new THREE.CylinderGeometry(.09,.09,.31,24),
paint
);
hub.rotation.z=Math.PI/2;
wheel.add(hub);

// Five rim spokes

for(let i=0;i<5;i++){

const spoke=addBox(
wheel,.055,.43,.07,chrome,0,0,0
);

spoke.rotation.z=i*Math.PI*2/5;
}

// Wheel bolts

for(let i=0;i<5;i++){

const bolt=new THREE.Mesh(
new THREE.SphereGeometry(.025,8,8),
black
);

bolt.position.set(
0,
Math.cos(i*Math.PI*2/5)*.17,
Math.sin(i*Math.PI*2/5)*.17
);

wheel.add(bolt);
}

wheel.position.set(x,.5,z);
car.add(wheel);
wheels.push(wheel);

if(isFront)frontWheels.push(wheel);
}

makeWheel(-1.08,-1.5,true);
makeWheel(1.08,-1.5,true);
makeWheel(-1.08,1.5,false);
makeWheel(1.08,1.5,false);

// ===========================================
// 12. DRIVER
// ===========================================

const driver=new THREE.Group();

addBox(driver,.6,.8,.35,leather,-.38,1.25,.2);

const head=new THREE.Mesh(
new THREE.SphereGeometry(.22,24,24),
skin
);
head.position.set(-.38,1.85,.1);
driver.add(head);

const hair=new THREE.Mesh(
new THREE.SphereGeometry(.225,20,16),
black
);
hair.scale.y=.55;
hair.position.set(-.38,1.96,.1);
driver.add(hair);

car.add(driver);

// ===========================================
// 13. COCKPIT
// ===========================================

const cockpit=new THREE.Group();
camera.add(cockpit);

// Dashboard

addBox(cockpit,3.8,.45,.8,leather,0,-.95,-1.15);

// Dashboard trim

addBox(
cockpit,3.5,.035,.04,paint,
0,-.72,-1.55
);

// Dashboard screen

addBox(
cockpit,1,.4,.07,
material(0x071d2a),
.55,-.53,-1.6
);

// Steering wheel

const steeringGroup=new THREE.Group();

const wheelRing=new THREE.Mesh(
new THREE.TorusGeometry(.39,.055,16,48),
black
);
steeringGroup.add(wheelRing);

// Center

const wheelCenter=new THREE.Mesh(
new THREE.CylinderGeometry(.14,.14,.1,24),
paint
);
wheelCenter.rotation.x=Math.PI/2;
steeringGroup.add(wheelCenter);

// Steering spokes

for(let i=0;i<3;i++){

const spoke=addBox(
steeringGroup,.065,.35,.07,
chrome,0,0,0
);

spoke.rotation.z=i*Math.PI*2/3;
}

steeringGroup.position.set(-.55,-.55,-1.25);
cockpit.add(steeringGroup);

// Arms

function makeArm(a,b){

const start=new THREE.Vector3(...a);
const end=new THREE.Vector3(...b);
const direction=new THREE.Vector3().subVectors(end,start);

const arm=new THREE.Mesh(
new THREE.CylinderGeometry(.1,.14,direction.length(),16),
leather
);

arm.position.copy(start).add(end).multiplyScalar(.5);
arm.quaternion.setFromUnitVectors(
new THREE.Vector3(0,1,0),
direction.normalize()
);

cockpit.add(arm);
}

makeArm([-1.2,-1.25,-.65],[-.85,-.8,-1.12]);
makeArm([1.1,-1.25,-.65],[-.25,-.8,-1.12]);

// Hands

for(const x of [-.31,.31]){

const hand=new THREE.Mesh(
new THREE.SphereGeometry(.11,18,18),
skin
);

hand.position.set(x,.15,.04);
steeringGroup.add(hand);
}

// Cockpit roof

addBox(cockpit,3.8,.12,.35,black,0,1.72,-1.55);

// Windshield pillars

for(const x of [-1.85,1.85]){
addBox(cockpit,.12,2.7,.14,black,x,.35,-1.6);
}

// ===========================================
// 14. CAMERA SYSTEM
// ===========================================

let firstPerson=true;

function changeCamera(){

firstPerson=!firstPerson;

cockpit.visible=firstPerson;

document.getElementById("cameraMode").textContent=
firstPerson?"FIRST PERSON":"THIRD PERSON";
}

// ===========================================
// 15. KEYBOARD CONTROLS
// ===========================================

const keys={};

window.addEventListener("keydown",e=>{

keys[e.key.toLowerCase()]=true;

if(e.key.startsWith("Arrow"))e.preventDefault();

if(e.key.toLowerCase()==="c"&&!e.repeat){
changeCamera();
}

});

window.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

// ===========================================
// 16. ENGINE AND DRIVING PHYSICS
// ===========================================

let speed=0;
let steering=0;
let carX=0;
let carZ=0;
let yaw=0;
let gear=1;

const MAX_SPEED=320;
const clock=new THREE.Clock();

function updateDriving(dt){

const gas=keys["w"]||keys["arrowup"];
const brake=keys["s"]||keys["arrowdown"];
const handbrake=keys[" "];

// Smooth acceleration

if(gas){
speed+=38*dt;
}else{
speed-=3.5*dt;
}

// Braking

if(brake){
speed-=110*dt;
}

if(handbrake){
speed-=65*dt;
}

speed=THREE.MathUtils.clamp(speed,0,MAX_SPEED);

// Steering

let input=0;

if(keys["a"]||keys["arrowleft"])input=-1;
if(keys["d"]||keys["arrowright"])input=1;

steering+=
(input-steering)*Math.min(dt*5,1);

// Steering becomes stronger at speed

const steeringStrength=
.15+Math.min(speed/180,1)*.85;

carX+=
input*speed*.0007*steeringStrength*dt;

carX=THREE.MathUtils.clamp(carX,-14,14);

yaw=-steering*.3;

// Vehicle position

car.position.set(carX,0,carZ);
car.rotation.y=yaw;

// Front wheel angle

frontWheels.forEach(w=>{
w.rotation.y=-steering*.45;
});

// Wheel rotation

wheels.forEach(w=>{
w.rotation.x+=speed*dt*.025;
});

// Move world

carZ-=speed*.009*dt;

// Speed gears

gear=Math.min(6,Math.max(1,Math.floor(speed/55)+1));

}

// ===========================================
// 17. WORLD RECYCLING
// ===========================================

function updateWorld(){

roadMarks.forEach(mark=>{
if(mark.position.z>carZ+50){
mark.position.z-=16000;
}
});

trees.forEach(tree=>{
if(tree.position.z>carZ+100){
tree.position.z-=15000;
}
});

buildings.forEach(building=>{
if(building.position.z>carZ+150){
building.position.z-=15000;
}
});

}

// ===========================================
// 18. CAMERA MOVEMENT
// ===========================================

function updateCamera(dt){

if(firstPerson){

camera.position.set(
carX,1.62,carZ-.15
);

camera.rotation.order="YXZ";
camera.rotation.set(0,yaw,0);

}else{

const target=new THREE.Vector3(
carX+Math.sin(yaw)*9,
4.2,
carZ+10
);

camera.position.lerp(target,Math.min(dt*4,1));

camera.lookAt(
carX,1.1,carZ-2
);

}

steeringGroup.rotation.z=-steering*.8;

}

// ===========================================
// 19. SPEEDOMETER
// ===========================================

function updateHUD(){

document.getElementById("speed").textContent=
Math.round(speed)+" KM/H";

document.getElementById("rpm").textContent=
"RPM: "+Math.round(800+speed*25);

document.getElementById("gear").textContent=
"GEAR: "+gear;

}

// ===========================================
// 20. MAIN GAME LOOP
// ===========================================

function animate(){

requestAnimationFrame(animate);

const dt=Math.min(clock.getDelta(),.05);

updateDriving(dt);
updateWorld();
updateCamera(dt);
updateHUD();

renderer.render(scene,camera);

}

// ===========================================
// 21. GAME START
// ===========================================

camera.position.set(0,1.62,0);
cockpit.visible=true;

animate();

// ===========================================
// 22. SCREEN RESIZE
// ===========================================

window.addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(innerWidth,innerHeight);

});

</script>
</body>
</html>
