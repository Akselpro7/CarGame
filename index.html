<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPEN WORLD 5</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;color:white;font-family:Arial}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#logo{position:absolute;top:16px;left:20px;font-size:29px;font-weight:1000;letter-spacing:4px;text-shadow:2px 2px 5px #000}
#cash{position:absolute;top:56px;left:20px;color:#4dff8a;font-weight:bold;font-size:21px;text-shadow:2px 2px #000}
#wanted{position:absolute;right:24px;top:18px;color:#ffe15c;font-size:27px;letter-spacing:4px;text-shadow:2px 2px #000}
#mission{position:absolute;right:24px;top:60px;text-align:right;text-shadow:2px 2px #000}
#speedBox{position:absolute;right:25px;bottom:26px;text-align:right;text-shadow:2px 2px #000}
#speed{font-size:48px;font-weight:900}
#gear{font-size:15px;color:#ddd}
#stats{position:absolute;left:20px;bottom:22px;width:175px;text-shadow:1px 1px #000;font-size:12px}
.bar{height:9px;background:#333;border-radius:10px;margin:5px 0 12px;overflow:hidden}
.fill{height:100%;width:100%;background:#42e978}
#nitroFill{background:#00cfff}
#map{position:absolute;right:20px;top:110px;width:150px;height:150px;border:2px solid white;border-radius:50%;overflow:hidden;background:#111b}
#minimap{width:100%;height:100%}
#help{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#fff;text-align:center;text-shadow:2px 2px #000;width:95%}
#message{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:26px;font-weight:bold;text-shadow:2px 2px #000;text-align:center;display:none}
#panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:330px;max-width:90vw;background:#101722f5;border:2px solid #00cfff;border-radius:12px;padding:18px;display:none;z-index:10}
#panel h2{color:#00cfff;margin-top:0}
#panel button,#panel select{width:100%;padding:11px;margin:5px 0;border:0;border-radius:5px;font-weight:bold}
#panel button{background:#00cfff;color:#00121b;cursor:pointer}
#panel select{background:#253747;color:white}
#panel p{font-size:12px;color:#bbb}
</style>
</head>
<body>

<div id="hud">
 <div id="logo">OPEN WORLD <span style="color:#00cfff">5</span></div>
 <div id="cash">$5,000</div>
 <div id="wanted">☆☆☆☆☆</div>
 <div id="mission">Explore the city</div>
 <div id="map"><canvas id="minimap" width="200" height="200"></canvas></div>
 <div id="stats">
  HEALTH
  <div class="bar"><div id="healthFill" class="fill"></div></div>
  NITRO
  <div class="bar"><div id="nitroFill" class="fill"></div></div>
 </div>
 <div id="speedBox">
  <div id="gear">DRIVE</div>
  <div><span id="speed">0</span> KM/H</div>
 </div>
 <div id="help">
  W / ↑ Drive · S / ↓ Reverse · A / D Steer · SPACE Handbrake · SHIFT Nitro<br>
  E Enter/Exit · C Camera · F1 Admin · ESC Pause · R Repair
 </div>
 <div id="message"></div>
</div>

<div id="panel">
 <h2>ADMIN MENU</h2>
 <p>Single-player vehicle controls</p>
 <select id="spawnColor">
  <option value="16777215">White</option>
  <option value="16711680">Red</option>
  <option value="255">Blue</option>
  <option value="65280">Green</option>
  <option value="0">Black</option>
  <option value="16753920">Orange</option>
 </select>
 <button onclick="spawnAdminCar()">SPAWN CAR</button>
 <button onclick="spawnFiveCars()">SPAWN 5 CARS</button>
 <button onclick="clearAdminCars()">REMOVE SPAWNED CARS</button>
 <button onclick="repairCar()">REPAIR VEHICLE</button>
 <button onclick="addMoney()">ADD $10,000</button>
 <button onclick="startMission()">START MISSION</button>
 <button onclick="closePanel()">CLOSE</button>
 <p>Press F1 to open or close this menu.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
"use strict";

if(!window.THREE){
 document.getElementById("message").style.display="block";
 document.getElementById("message").textContent="3D engine failed to load. Check your internet connection.";
 return;
}

// ==================================================
// GAME SETUP
// ==================================================
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8dbfe5);
scene.fog=new THREE.Fog(0x8dbfe5,180,1100);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1800);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));
renderer.shadowMap.enabled=false;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const clock=new THREE.Clock();
const keys={};

let velocity=0,yaw=0,steer=0;
let nitro=100,health=100,money=5000;
let wanted=0,cameraMode=0;
let driving=true,paused=false,crashed=false;
let missionActive=false,missionTarget=null;
let policeTimer=0;

const traffic=[];
const police=[];
const pedestrians=[];
const adminCars=[];
const sparks=[];

const material=(color,metalness=0,roughness=.8)=>
 new THREE.MeshStandardMaterial({color,metalness,roughness});

const roadMat=material(0x292d32);
const grassMat=material(0x43834b);
const pavementMat=material(0x969999);
const lineMat=material(0xf3e8ae);
const tireMat=material(0x080808);
const blackMat=material(0x090c10);
const metalMat=material(0x8b969e,.8,.25);
const whiteMat=material(0xffffff);
const redMat=material(0xe21d28);

scene.add(new THREE.HemisphereLight(0xe4f3ff,0x48543d,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(200,250,100);
scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(2600,2600),grassMat);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.15;
scene.add(ground);

const boxGeo=new THREE.BoxGeometry(1,1,1);

function box(parent,x,y,z,sx,sy,sz,mat){
 const m=new THREE.Mesh(boxGeo,mat);
 m.position.set(x,y,z);
 m.scale.set(sx,sy,sz);
 parent.add(m);
 return m;
}
function rand(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}

// ==================================================
// LARGE CITY MAP
// ==================================================
function road(x,z,width,length,horizontal){
 box(scene,x,.01,z,horizontal?length:width,.08,horizontal?width:length,roadMat);
 const count=Math.floor(length/20);
 for(let i=-count/2;i<count/2;i++){
  if(horizontal)box(scene,x+i*20,.065,z,.35,.02,.35,lineMat);
  else box(scene,x,.065,z+i*20,.35,.02,.35,lineMat);
 }
 // Pavements
 if(horizontal){
  for(const side of [-1,1])box(scene,x,.04,z+side*(width/2+2),length,.15,4,pavementMat);
 }else{
  for(const side of [-1,1])box(scene,x+side*(width/2+2),.04,z,4,.15,length,pavementMat);
 }
}

for(let i=-10;i<=10;i++){
 road(i*100,0,18,2100,true);
 road(0,i*100,18,2100,false);
}

function building(x,z,w,d,h,color){
 const b=box(scene,x,h/2,z,w,h,d,material(color));
 const windowMat=material(0x7cc9e8,.35,.2);
 for(let y=4;y<h-2;y+=6){
  for(const side of [-1,1]){
   for(let xx=-w/2+3;xx<w/2-2;xx+=6){
    box(scene,x+xx,y,z+side*(d/2+.04),2.2,2.1,.08,windowMat);
   }
  }
 }
 // Rooftop structure
 if(h>35){
  box(scene,x,h+1,z,w*.3,2,d*.3,material(0x454a50));
 }
}

for(let x=-950;x<=950;x+=100){
 for(let z=-950;z<=950;z+=100){
  if(Math.abs(x%200)<1&&Math.abs(z%200)<1)continue;
  const w=rand(20,40),d=rand(20,40);
  const h=rand(15,95);
  const colors=[0x777e87,0x9a8e80,0x555f6b,0xb4a995,0x686e73,0x737d89];
  building(x+rand(-15,15),z+rand(-15,15),w,d,h,colors[Math.floor(Math.random()*colors.length)]);
 }
}

// Airport runway
box(scene,750,.02,750,300,.08,65,roadMat);
for(let i=0;i<18;i++){
 box(scene,620+i*15,.08,750,8,.03,.8,whiteMat);
}

// Beach and ocean
const ocean=new THREE.Mesh(
 new THREE.PlaneGeometry(500,1800),
 new THREE.MeshStandardMaterial({color:0x167eae,metalness:.2,roughness:.3})
);
ocean.rotation.x=-Math.PI/2;
ocean.position.set(-1180,-.1,0);
scene.add(ocean);
box(scene,-950,.02,0,100,.08,1800,material(0xd7c18b));

// Mountains around the map
for(let i=0;i<45;i++){
 const h=rand(50,140);
 const m=new THREE.Mesh(
  new THREE.ConeGeometry(rand(25,75),h,7),
  material(0x526b55)
 );
 const a=rand(0,Math.PI*2),r=rand(1150,1350);
 m.position.set(Math.cos(a)*r,h/2-2,Math.sin(a)*r);
 scene.add(m);
}

// Palm trees
function palm(x,z){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,9,8),material(0x76502c));
 trunk.position.set(x,4.5,z);
 scene.add(trunk);
 for(let i=0;i<8;i++){
  const leaf=box(scene,x+Math.cos(i*Math.PI/4)*3,9,z+Math.sin(i*Math.PI/4)*3,1,.25,6,material(0x187536));
  leaf.rotation.y=i*Math.PI/4;
 }
}
for(let i=0;i<230;i++){
 const x=rand(-1000,1000),z=rand(-1000,1000);
 if(Math.abs(x%100)>15&&Math.abs(z%100)>15)palm(x,z);
}

// ==================================================
// DETAILED SPORTS CAR
// ==================================================
function createCar(group,color=0x168bd4){
 const paint=material(color,.8,.2);
 const glass=material(0x102d43,.5,.16);

 // Body
 box(group,0,.85,0,3.2,.85,6,paint);
 box(group,0,.57,2.6,2.9,.25,.8,paint);
 box(group,0,.57,-2.6,2.9,.25,.8,paint);

 // Cabin and windows
 box(group,0,1.5,-.3,2.55,.85,2.8,glass);
 box(group,0,1.05,1.5,2.9,.3,.45,paint);
 box(group,0,1.05,-1.7,2.9,.3,.45,paint);

 // Front hood and spoiler
 box(group,0,1.15,2.25,2.85,.22,1.4,paint);
 box(group,0,1.9,-2.75,2.6,.12,.5,blackMat);
 for(const x of [-1,1]){
  box(group,x*1.15,1.05,3.02,.55,.23,.07,whiteMat);
  box(group,x*1.15,.85,-3.02,.55,.22,.07,redMat);
  box(group,x*1.58,1.25,0,.12,.3,.8,paint);
  box(group,x*1.62,1.55,.5,.5,.12,.4,blackMat);
 }

 // Wheels, rims and brake discs
 for(const x of [-1.62,1.62]){
  for(const z of [-2,2]){
   const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.52,.52,.38,24),tireMat);
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.52,z);
   group.add(wheel);

   const rim=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.4,16),metalMat);
   rim.rotation.z=Math.PI/2;
   rim.position.set(x,.52,z);
   group.add(rim);
   for(let k=0;k<5;k++){
    const spoke=box(group,x*1.01,.52+Math.sin(k*Math.PI*2/5)*.23,z+Math.cos(k*Math.PI*2/5)*.23,.08,.08,.08,whiteMat);
    spoke.rotation.z=k*Math.PI*2/5;
   }
  }
 }

 // Cockpit
 box(group,0,1.35,-.2,2.2,.12,2.2,blackMat);
 box(group,0,1.38,1.15,2.35,.25,.45,blackMat);
 for(const x of [-.65,.65]){
  box(group,x,1.15,-.65,.65,.65,.65,blackMat);
 }
 const steering=new THREE.Mesh(new THREE.TorusGeometry(.29,.045,8,24),blackMat);
 steering.position.set(-.65,1.68,1.05);
 group.add(steering);
 box(group,-.65,1.55,1.02,.08,.35,.08,metalMat);

 // Driver
 box(group,-.65,1.65,-.15,.42,.65,.4,material(0x202a38));
 const driverHead=new THREE.Mesh(new THREE.SphereGeometry(.2,16,12),material(0xd3a17d));
 driverHead.position.set(-.65,2.1,-.15);
 group.add(driverHead);

 // Exhausts
 for(const x of [-.7,.7]){
  cylinder(group,x,.5,-3.05,.12,.25,metalMat,12);
 }
}

// ==================================================
// MAIN PLAYER CAR
// ==================================================
const car=new THREE.Group();
createCar(car);
scene.add(car);
car.position.set(0,0,0);

// ==================================================
// HUMAN CHARACTER MODEL
// ==================================================
function createPerson(x,z){
 const g=new THREE.Group();
 const skin=material(0xc9916d);
 const shirt=material([0x234a8c,0x9b3030,0x333b42,0x39784a][Math.floor(Math.random()*4)]);
 const pants=material(0x252b38);
 const shoe=material(0x111111);

 // Torso
 box(g,0,1.15,0,.55,.75,.32,shirt);

 // Head and neck
 const head=new THREE.Mesh(new THREE.SphereGeometry(.22,16,12),skin);
 head.position.y=1.8;
 g.add(head);
 cylinder(g,0,1.52,0,.09,.18,skin,8);

 // Arms
 const armL=box(g,-.38,1.17,0,.17,.65,.18,shirt);
 const armR=box(g,.38,1.17,0,.17,.65,.18,shirt);

 // Legs
 const legL=box(g,-.16,.53,0,.2,.65,.22,pants);
 const legR=box(g,.16,.53,0,.2,.65,.22,pants);

 box(g,-.16,.15,.06,.23,.18,.38,shoe);
 box(g,.16,.15,.06,.23,.18,.38,shoe);

 g.position.set(x,0,z);
 scene.add(g);
 pedestrians.push({group:g,phase:rand(0,6),speed:rand(1,2),armL,armR,legL,legR,origin:new THREE.Vector3(x,0,z)});
 return g;
}
for(let i=0;i<40;i++){
 createPerson(rand(-900,900),rand(-900,900));
}

// ==================================================
// TRAFFIC
// ==================================================
function createTraffic(x,z,color){
 const g=new THREE.Group();
 createCar(g,color);
 g.position.set(x,0,z);
 scene.add(g);
 traffic.push({group:g,speed:rand(10,24),direction:Math.random()<.5?1:-1});
}
for(let i=0;i<35;i++){
 createTraffic(rand(-900,900),Math.round(rand(-10,10))*100+rand(-5,5),
 [0xe6e6e6,0xc9212b,0x171717,0x2e9c65,0xd2a22e][Math.floor(Math.random()*5)]);
}

// ==================================================
// POLICE
// ==================================================
function createPolice(){
 const g=new THREE.Group();
 createCar(g,0x101a2a);
 box(g,-.45,2,0,.5,.18,.4,material(0xff1111,0,.2));
 box(g,.45,2,0,.5,.18,.4,material(0x1166ff,0,.2));
 scene.add(g);
 police.push({group:g});
}
for(let i=0;i<4;i++)createPolice();

// ==================================================
// MISSION CHECKPOINT
// ==================================================
const marker=new THREE.Group();
const ring=new THREE.Mesh(new THREE.TorusGeometry(4,.25,8,32),new THREE.MeshBasicMaterial({color:0xffdd33}));
ring.rotation.x=Math.PI/2;
marker.add(ring);
const beam=new THREE.Mesh(new THREE.CylinderGeometry(.5,2,8,16,1,true),new THREE.MeshBasicMaterial({color:0xffdd33,transparent:true,opacity:.18}));
beam.position.y=4;
marker.add(beam);
marker.visible=false;
scene.add(marker);

// ==================================================
// ADMIN MENU
// ==================================================
window.spawnAdminCar=function(){
 if(crashed)return;
 const g=new THREE.Group();
 createCar(g,Number(document.getElementById("spawnColor").value));
 g.position.set(car.position.x-Math.sin(yaw)*15,0,car.position.z+Math.cos(yaw)*15);
 g.rotation.y=yaw;
 scene.add(g);
 adminCars.push(g);
};
window.spawnFiveCars=function(){
 for(let i=0;i<5;i++){
  spawnAdminCar();
  const g=adminCars[adminCars.length-1];
  g.position.x+=(i-2)*7;
  g.position.z-=i*5;
 }
};
window.clearAdminCars=function(){
 for(const g of adminCars)scene.remove(g);
 adminCars.length=0;
};
window.repairCar=function(){
 crashed=false;health=100;velocity=0;
 car.position.set(0,0,0);
 showMessage("VEHICLE REPAIRED");
};
window.addMoney=function(){money+=10000;updateHUD()};
window.startMission=function(){
 missionActive=true;
 missionTarget=new THREE.Vector3(rand(-900,900),0,rand(-900,900));
 marker.position.copy(missionTarget);
 marker.visible=true;
 document.getElementById("mission").textContent="Reach the yellow checkpoint";
 closePanel();
};
window.closePanel=function(){
 document.getElementById("panel").style.display="none";
 paused=false;
};

// ==================================================
// INPUT
// ==================================================
function showMessage(txt){
 const el=document.getElementById("message");
 el.textContent=txt;
 el.style.display="block";
 clearTimeout(showMessage.timer);
 showMessage.timer=setTimeout(()=>el.style.display="none",2500);
}
function togglePanel(){
 const p=document.getElementById("panel");
 if(p.style.display==="block"){
  p.style.display="none";paused=false;
 }else{
  p.style.display="block";paused=true;
 }
}
function toggleDriving(){
 if(driving){
  driving=false;
  player.position.copy(car.position);
  player.position.x+=4;
  player.rotation.y=yaw;
  showMessage("YOU EXITED THE CAR");
 }else if(dist(player.position,car.position)<8){
  driving=true;
  showMessage("YOU ENTERED THE CAR");
 }else{
  showMessage("GET CLOSER TO YOUR CAR");
 }
}

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 if(e.repeat)return;
 if(e.key==="F1"){e.preventDefault();togglePanel()}
 if(e.key.toLowerCase()==="e")toggleDriving();
 if(e.key.toLowerCase()==="c"){
  cameraMode=(cameraMode+1)%3;
  showMessage(["THIRD PERSON","FIRST PERSON COCKPIT","HOOD CAMERA"][cameraMode]);
 }
 if(e.key==="Escape"){
  if(document.getElementById("panel").style.display==="block")closePanel();
  else{paused=!paused;showMessage(paused?"PAUSED":"RESUMED")}
 }
 if(e.key.toLowerCase()==="r"&&crashed)repairCar();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

// ==================================================
// DRIVING PHYSICS - FORWARD DIRECTION FIX
// ==================================================
function updateDriving(dt){
 if(crashed)return;

 const forward=keys.w||keys.arrowup;
 const backward=keys.s||keys.arrowdown;
 const left=keys.a||keys.arrowleft;
 const right=keys.d||keys.arrowright;
 const boost=keys.shift&&nitro>0&&velocity>1;
 const maxSpeed=1000/3.6;

 if(forward)velocity+=(boost?45:18)*dt;
 if(backward)velocity-=24*dt;
 if(!forward&&!backward)velocity*=Math.pow(.985,dt*60);
 if(keys[" "])velocity*=Math.pow(.94,dt*60);
 velocity=THREE.MathUtils.clamp(velocity,-18,maxSpeed);

 if(boost)nitro=Math.max(0,nitro-30*dt);
 else nitro=Math.min(100,nitro+9*dt);

 const turn=(right?1:0)-(left?1:0);
 const speedFactor=Math.min(1,Math.abs(velocity)/12);
 steer=THREE.MathUtils.lerp(steer,turn,.12);

 yaw+=steer*speedFactor*dt*(velocity>=0?1:-1)*1.8;
 car.rotation.y=yaw;

 // Local +Z is forward in this model
 car.position.x+=Math.sin(yaw)*velocity*dt;
 car.position.z+=Math.cos(yaw)*velocity*dt;

 car.position.x=THREE.MathUtils.clamp(car.position.x,-1200,1200);
 car.position.z=THREE.MathUtils.clamp(car.position.z,-1200,1200);

 for(const t of traffic){
  if(Math.abs(car.position.x-t.group.position.x)<3.6&&Math.abs(car.position.z-t.group.position.z)<5.5){
   crash();break;
  }
 }
 if(boost&&Math.random()<.3)createSpark(car.position.x,car.position.z);
}

// ==================================================
// WALKING AND ANIMATIONS
// ==================================================
function updateWalking(dt){
 const forward=keys.w||keys.arrowup;
 const backward=keys.s||keys.arrowdown;
 const left=keys.a||keys.arrowleft;
 const right=keys.d||keys.arrowright;
 const move=(forward?1:0)-(backward?1:0);
 const turn=(right?1:0)-(left?1:0);

 player.rotation.y+=turn*dt*2.3;
 player.position.x+=Math.sin(player.rotation.y)*move*dt*8;
 player.position.z+=Math.cos(player.rotation.y)*move*dt*8;
}
function updatePedestrians(dt){
 for(const p of pedestrians){
  p.phase+=dt*p.speed;
  p.group.position.x=p.origin.x+Math.sin(p.phase*.4)*5;
  p.group.position.z=p.origin.z+Math.cos(p.phase*.4)*5;
  p.group.rotation.y=p.phase*.4;
  const swing=Math.sin(p.phase)*.35;
  p.legL.rotation.x=swing;
  p.legR.rotation.x=-swing;
  p.armL.rotation.x=-swing;
  p.armR.rotation.x=swing;
 }
}

// ==================================================
// TRAFFIC AND POLICE
// ==================================================
function updateTraffic(dt){
 for(const t of traffic){
  t.group.position.z+=t.speed*dt*t.direction;
  if(t.group.position.z>1100)t.group.position.z=-1100;
  if(t.group.position.z< -1100)t.group.position.z=1100;
 }
}
function updatePolice(dt){
 const target=driving?car:player;
 for(const p of police){
  if(wanted>0){
   const dx=target.position.x-p.group.position.x;
   const dz=target.position.z-p.group.position.z;
   const angle=Math.atan2(dx,dz);
   p.group.rotation.y=angle;
   p.group.position.x+=Math.sin(angle)*dt*(12+wanted*3);
   p.group.position.z+=Math.cos(angle)*dt*(12+wanted*3);
  }
 }
 if(wanted>0){
  policeTimer+=dt;
  if(policeTimer>35){
   wanted=0;policeTimer=0;
   showMessage("WANTED LEVEL CLEARED");
  }
 }
}

// ==================================================
// CRASH EFFECT
// ==================================================
function createSpark(x,z){
 const m=new THREE.Mesh(new THREE.SphereGeometry(.12,6,6),new THREE.MeshBasicMaterial({color:0xffb52b}));
 m.position.set(x,rand(.5,2),z);
 scene.add(m);
 sparks.push({mesh:m,life:.5});
}
function updateSparks(dt){
 for(let i=sparks.length-1;i>=0;i--){
  const s=sparks[i];
  s.life-=dt;
  s.mesh.position.y+=dt*2;
  if(s.life<=0){
   scene.remove(s.mesh);
   sparks.splice(i,1);
  }
 }
}
function crash(){
 if(crashed)return;
 crashed=true;
 velocity=0;
 health=Math.max(0,health-25);
 wanted=Math.min(5,wanted+1);
 showMessage("CRASH! VEHICLE DAMAGED");
 for(let i=0;i<15;i++)createSpark(car.position.x+rand(-2,2),car.position.z+rand(-2,2));
}

// ==================================================
// CAMERA: THIRD PERSON / COCKPIT / HOOD
// ==================================================
function updateCamera(dt){
 const target=driving?car:player;
 let desired=new THREE.Vector3();
 let look=new THREE.Vector3();

 if(!driving){
  if(cameraMode===1){
   desired.set(target.position.x,target.position.y+1.65,target.position.z);
   look.set(target.position.x+Math.sin(target.rotation.y)*10,target.position.y+1.65,target.position.z+Math.cos(target.rotation.y)*10);
  }else{
   desired.set(target.position.x-Math.sin(target.rotation.y)*7,target.position.y+3.5,target.position.z-Math.cos(target.rotation.y)*7);
   look.set(target.position.x,target.position.y+1,target.position.z);
  }
 }else if(cameraMode===1){
  const offset=new THREE.Vector3(-.55,1.8,1);
  offset.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
  desired.set(car.position.x+offset.x,car.position.y+offset.y,car.position.z+offset.z);
  look.set(car.position.x+Math.sin(yaw)*20,car.position.y+1.6,car.position.z+Math.cos(yaw)*20);
 }else if(cameraMode===2){
  const offset=new THREE.Vector3(0,2.2,2.5);
  offset.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
  desired.set(car.position.x+offset.x,car.position.y+offset.y,car.position.z+offset.z);
  look.set(car.position.x+Math.sin(yaw)*20,car.position.y+1,car.position.z+Math.cos(yaw)*20);
 }else{
  desired.set(car.position.x-Math.sin(yaw)*12,car.position.y+6,car.position.z-Math.cos(yaw)*12);
  look.set(car.position.x+Math.sin(yaw)*10,car.position.y+1.5,car.position.z+Math.cos(yaw)*10);
 }

 camera.position.lerp(desired,1-Math.pow(.001,dt));
 camera.lookAt(look);
}

// ==================================================
// MISSION SYSTEM
// ==================================================
function updateMission(){
 if(!missionActive||!missionTarget)return;
 const target=driving?car:player;
 if(dist(target.position,missionTarget)<8){
  money+=1000;
  missionActive=false;
  marker.visible=false;
  document.getElementById("mission").textContent="Mission completed!";
  showMessage("MISSION COMPLETE +$1000");
 }
}

// ==================================================
// HUD AND MINIMAP
// ==================================================
function updateHUD(){
 document.getElementById("cash").textContent="$"+money.toLocaleString();
 document.getElementById("speed").textContent=Math.round(Math.abs(velocity)*3.6);
 document.getElementById("gear").textContent=!driving?"ON FOOT":velocity<0?"REVERSE":"DRIVE";
 document.getElementById("healthFill").style.width=health+"%";
 document.getElementById("nitroFill").style.width=nitro+"%";
 document.getElementById("wanted").textContent="★".repeat(wanted)+"☆".repeat(5-wanted);
}
function updateMap(){
 const c=document.getElementById("minimap");
 const ctx=c.getContext("2d");
 ctx.clearRect(0,0,200,200);
 ctx.fillStyle="#243b2a";
 ctx.fillRect(0,0,200,200);
 ctx.strokeStyle="#89959a";
 ctx.lineWidth=5;
 for(let i=0;i<200;i+=40){
  ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,200);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(200,i);ctx.stroke();
 }
 const target=driving?car:player;
 ctx.fillStyle="#00cfff";
 ctx.beginPath();ctx.arc(100,100,6,0,Math.PI*2);ctx.fill();
 if(missionActive){
  ctx.fillStyle="#ffdc33";
  ctx.beginPath();
  ctx.arc(100+(missionTarget.x-target.position.x)*.07,100+(missionTarget.z-target.position.z)*.07,5,0,Math.PI*2);
  ctx.fill();
 }
}

// ==================================================
// MAIN LOOP
// ==================================================
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(!paused){
  if(driving)updateDriving(dt);
  else updateWalking(dt);

  updateTraffic(dt);
  updatePedestrians(dt);
  updatePolice(dt);
  updateSparks(dt);
  updateMission();
  updateCamera(dt);
  updateHUD();
  updateMap();
  if(missionActive)marker.rotation.y+=dt;
 }
 renderer.render(scene,camera);
}

updateCamera(.016);
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
showMessage("WELCOME TO OPEN WORLD 5");
})();
</script>
