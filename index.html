
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nissan GT-R Open World</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  overflow:hidden;
  background:#87ceeb;
  font-family:Arial,sans-serif;
}

canvas { display:block; }

#speed {
  position:fixed;
  right:22px;
  bottom:22px;
  background:#080b12ee;
  color:white;
  border:2px solid #e51b32;
  border-radius:12px;
  padding:18px 24px;
  font-size:28px;
  z-index:5;
}

#help {
  position:fixed;
  left:15px;
  top:15px;
  background:#10151edd;
  color:white;
  padding:13px;
  border-radius:9px;
  line-height:1.7;
  z-index:5;
}

#brand {
  position:fixed;
  right:15px;
  top:15px;
  background:#10151edd;
  color:#ff3447;
  padding:13px;
  border-radius:9px;
  font-weight:bold;
  z-index:5;
}

#cameraMode {
  position:fixed;
  bottom:20px;
  left:15px;
  color:white;
  background:#10151edd;
  padding:12px;
  border-radius:8px;
  z-index:5;
}
</style>
</head>

<body>

<div id="speed">0 KM/H</div>

<div id="help">
W / ↑ GAS<br>
S / ↓ BRAKE<br>
A / ← LEFT<br>
D / → RIGHT<br>
C = CHANGE CAMERA
</div>

<div id="brand">NISSAN GT-R R35</div>
<div id="cameraMode">CAMERA: FIRST PERSON</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ==========================================
// 1. GAME SETUP
// ==========================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x83c8ee);
scene.fog = new THREE.Fog(0x83c8ee,180,1000);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth/window.innerHeight,
  0.1,
  4000
);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

// ==========================================
// 2. LIGHTING
// ==========================================

scene.add(new THREE.HemisphereLight(
  0xd9edff,0x566345,2
));

const sun = new THREE.DirectionalLight(0xffedcf,2.5);

sun.position.set(-100,150,80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);

scene.add(sun);

// ==========================================
// 3. MATERIALS
// ==========================================

function mat(color,roughness=0.6,metalness=0) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness
  });
}

const red = mat(0xb90020,0.27,0.65);
const darkRed = mat(0x690015);
const black = mat(0x111318,0.3,0.4);
const rubber = mat(0x101010,0.9);
const silver = mat(0xa8adb2,0.25,0.85);
const glass = new THREE.MeshStandardMaterial({
  color:0x172d40,
  metalness:0.5,
  roughness:0.18,
  transparent:true,
  opacity:0.65
});
const white = mat(0xffffff);
const skin = mat(0xc78d6b);
const grassMat = mat(0x51863a);
const roadMat = mat(0x292b30);

// ==========================================
// 4. OPEN WORLD
// ==========================================

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(6000,14000),
  grassMat
);

ground.rotation.x=-Math.PI/2;
ground.position.set(0,-0.15,-6500);
scene.add(ground);

// Mountains

for(let i=0;i<35;i++){

  const mountain=new THREE.Mesh(
    new THREE.ConeGeometry(
      55+Math.random()*65,
      100+Math.random()*100,
      7
    ),
    mat(0x728d9a)
  );

  mountain.position.set(
    (i-17)*130,
    35,
    -900-Math.random()*300
  );

  scene.add(mountain);
}

// Hills

for(let i=0;i<45;i++){

  const hill=new THREE.Mesh(
    new THREE.SphereGeometry(1,18,14),
    mat(0x638e4e)
  );

  hill.scale.set(
    35+Math.random()*60,
    15+Math.random()*25,
    40+Math.random()*60
  );

  hill.position.set(
    (Math.random()<0.5?-1:1)*(80+Math.random()*300),
    -8,
    -Math.random()*10000
  );

  scene.add(hill);
}

// Main road

const road=new THREE.Mesh(
  new THREE.PlaneGeometry(30,12000),
  roadMat
);

road.rotation.x=-Math.PI/2;
road.position.set(0,0,-5900);
scene.add(road);

// Road markings

const roadLines=[];

for(let i=0;i<300;i++){

  for(const x of [-5,5]){

    const line=new THREE.Mesh(
      new THREE.BoxGeometry(0.18,0.04,9),
      white
    );

    line.position.set(x,0.04,-i*40);
    scene.add(line);
    roadLines.push(line);
  }
}

// Side roads

for(let i=0;i<12;i++){

  const sideRoad=new THREE.Mesh(
    new THREE.PlaneGeometry(300,24),
    roadMat
  );

  sideRoad.rotation.x=-Math.PI/2;
  sideRoad.position.set(0,0.03,-500-i*850);
  scene.add(sideRoad);
}

// ==========================================
// 5. TREES
// ==========================================

const trees=[];

function createTree(x,z){

  const group=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(0.2,0.3,3.5,8),
    mat(0x67432c)
  );

  trunk.position.y=1.75;
  group.add(trunk);

  const leaves=new THREE.Mesh(
    new THREE.ConeGeometry(2,5.5,9),
    mat(0x1d612c)
  );

  leaves.position.y=5;
  group.add(leaves);

  group.scale.setScalar(0.8+Math.random()*1.2);
  group.position.set(x,0,z);

  scene.add(group);
  trees.push(group);
}

for(let i=0;i<180;i++){

  const z=-Math.random()*10500;

  createTree(-22-Math.random()*90,z);
  createTree(22+Math.random()*90,z);
}

// ==========================================
// 6. CITY BUILDINGS
// ==========================================

const buildings=[];

function createBuilding(x,z){

  const group=new THREE.Group();

  const w=10+Math.random()*15;
  const h=12+Math.random()*55;
  const d=10+Math.random()*15;

  const building=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    mat([0xb3ada2,0x9babb4,0x777f8a,0xc2b7a6][
      Math.floor(Math.random()*4)
    ])
  );

  building.position.y=h/2;
  group.add(building);

  const windowMat=mat(0x253c50,0.2,0.3);

  for(let y=3;y<h-2;y+=5){

    for(let xx=-w/2+2;xx<w/2-1;xx+=3.5){

      const win=new THREE.Mesh(
        new THREE.BoxGeometry(1.5,2,0.08),
        windowMat
      );

      win.position.set(xx,y,d/2+0.05);
      group.add(win);
    }
  }

  group.position.set(x,0,z);
  scene.add(group);
  buildings.push(group);
}

for(let i=0;i<65;i++){

  createBuilding(-60-Math.random()*100,-100-i*145);
  createBuilding(60+Math.random()*100,-100-i*145);
}

// ==========================================
// 7. BUILD THE NISSAN GT-R INSPIRED CAR
// ==========================================

const car=new THREE.Group();

scene.add(car);

// Main body

const body=new THREE.Mesh(
  new THREE.BoxGeometry(2.05,0.72,4.6),
  red
);

body.position.y=0.72;
car.add(body);

// Lower body

const lowerBody=new THREE.Mesh(
  new THREE.BoxGeometry(2.15,0.35,4.1),
  darkRed
);

lowerBody.position.set(0,0.43,0);
car.add(lowerBody);

// Hood

const hood=new THREE.Mesh(
  new THREE.BoxGeometry(1.95,0.13,1.35),
  red
);

hood.position.set(0,1.08,-1.35);
car.add(hood);

// Roof

const roofCar=new THREE.Mesh(
  new THREE.BoxGeometry(1.65,0.16,1.7),
  red
);

roofCar.position.set(0,1.92,0.15);
car.add(roofCar);

// Cabin glass

const windshield=new THREE.Mesh(
  new THREE.BoxGeometry(1.75,0.85,0.09),
  glass
);

windshield.position.set(0,1.48,-0.83);
windshield.rotation.x=-0.32;
car.add(windshield);

const rearGlass=new THREE.Mesh(
  new THREE.BoxGeometry(1.7,0.7,0.09),
  glass
);

rearGlass.position.set(0,1.5,1.05);
rearGlass.rotation.x=0.35;
car.add(rearGlass);

// Side windows

for(const side of [-1,1]){

  const sideWindow=new THREE.Mesh(
    new THREE.BoxGeometry(0.06,0.7,1.65),
    glass
  );

  sideWindow.position.set(side*0.88,1.5,0.12);
  car.add(sideWindow);

  // Mirrors

  const mirror=new THREE.Mesh(
    new THREE.BoxGeometry(0.3,0.17,0.35),
    black
  );

  mirror.position.set(side*1.15,1.25,-0.8);
  car.add(mirror);

}

// Front bumper

const front=new THREE.Mesh(
  new THREE.BoxGeometry(2.1,0.32,0.35),
  darkRed
);

front.position.set(0,0.48,-2.28);
car.add(front);

// Front grille

const grille=new THREE.Mesh(
  new THREE.BoxGeometry(0.9,0.28,0.04),
  black
);

grille.position.set(0,0.73,-2.47);
car.add(grille);

// Headlights

for(const side of [-1,1]){

  const light=new THREE.Mesh(
    new THREE.BoxGeometry(0.48,0.19,0.09),
    mat(0xe8f4ff,0.2)
  );

  light.position.set(side*0.72,0.96,-2.35);
  car.add(light);

}

// Rear lights

for(const side of [-1,1]){

  const tail=new THREE.Mesh(
    new THREE.TorusGeometry(0.16,0.045,10,24),
    mat(0xff1528)
  );

  tail.position.set(side*0.67,0.85,2.33);
  car.add(tail);

}

// Rear spoiler

const spoilerLegs=[];

for(const side of [-1,1]){

  const leg=new THREE.Mesh(
    new THREE.BoxGeometry(0.1,0.4,0.12),
    black
  );

  leg.position.set(side*0.65,1.35,1.75);
  car.add(leg);
}

const spoiler=new THREE.Mesh(
  new THREE.BoxGeometry(2.1,0.12,0.42),
  black
);

spoiler.position.set(0,1.58,1.8);
car.add(spoiler);

// Exhausts

for(const side of [-1,1]){

  const exhaust=new THREE.Mesh(
    new THREE.CylinderGeometry(0.12,0.12,0.3,20),
    silver
  );

  exhaust.rotation.x=Math.PI/2;
  exhaust.position.set(side*0.7,0.48,2.4);
  car.add(exhaust);
}

// Wheels

const wheelGroups=[];
const frontWheels=[];

function createWheel(x,z,isFront){

  const wheelGroup=new THREE.Group();

  const tire=new THREE.Mesh(
    new THREE.CylinderGeometry(0.42,0.42,0.25,32),
    rubber
  );

  tire.rotation.z=Math.PI/2;
  wheelGroup.add(tire);

  // Rim

  const rim=new THREE.Mesh(
    new THREE.CylinderGeometry(0.27,0.27,0.27,24),
    silver
  );

  rim.rotation.z=Math.PI/2;
  wheelGroup.add(rim);

  // Red center

  const center=new THREE.Mesh(
    new THREE.CylinderGeometry(0.09,0.09,0.29,20),
    red
  );

  center.rotation.z=Math.PI/2;
  wheelGroup.add(center);

  // Five spokes

  for(let i=0;i<5;i++){

    const spoke=new THREE.Mesh(
      new THREE.BoxGeometry(0.045,0.4,0.055),
      silver
    );

    spoke.rotation.z=i*Math.PI*2/5;
    wheelGroup.add(spoke);
  }

  wheelGroup.position.set(x,0.5,z);
  car.add(wheelGroup);

  wheelGroups.push(wheelGroup);

  if(isFront) frontWheels.push(wheelGroup);
}

createWheel(-1.02,-1.45,true);
createWheel(1.02,-1.45,true);
createWheel(-1.02,1.45,false);
createWheel(1.02,1.45,false);

// ==========================================
// 8. DRIVER VISIBLE IN THE CAR
// ==========================================

const driver=new THREE.Group();

const torso=new THREE.Mesh(
  new THREE.BoxGeometry(0.65,0.8,0.35),
  mat(0x202632)
);

torso.position.set(-0.38,1.25,0.25);
driver.add(torso);

const head=new THREE.Mesh(
  new THREE.SphereGeometry(0.22,20,20),
  skin
);

head.position.set(-0.38,1.85,0.15);
driver.add(head);

const hair=new THREE.Mesh(
  new THREE.SphereGeometry(0.225,20,16,0,Math.PI*2,0,Math.PI/2),
  black
);

hair.position.set(-0.38,1.9,0.15);
driver.add(hair);

car.add(driver);

// ==========================================
// 9. FIRST PERSON COCKPIT
// ==========================================

const cockpit=new THREE.Group();
camera.add(cockpit);

const dashboard=new THREE.Mesh(
  new THREE.BoxGeometry(3.7,0.42,0.8),
  leatherMat
);

dashboard.position.set(0,-0.95,-1.15);
cockpit.add(dashboard);

const dashTrim=new THREE.Mesh(
  new THREE.BoxGeometry(3.5,0.035,0.035),
  red
);

dashTrim.position.set(0,-0.75,-1.58);
cockpit.add(dashTrim);

// Instrument panel

const instrument=new THREE.Mesh(
  new THREE.BoxGeometry(1,0.38,0.06),
  mat(0x061b27,0.2)
);

instrument.position.set(0.55,-0.54,-1.6);
cockpit.add(instrument);

// Steering wheel

const steeringGroup=new THREE.Group();

const steeringWheel=new THREE.Mesh(
  new THREE.TorusGeometry(0.39,0.055,16,48),
  black
);

steeringGroup.add(steeringWheel);

const hub=new THREE.Mesh(
  new THREE.CylinderGeometry(0.14,0.14,0.1,24),
  red
);

hub.rotation.x=Math.PI/2;
steeringGroup.add(hub);

for(let i=0;i<3;i++){

  const spoke=new THREE.Mesh(
    new THREE.BoxGeometry(0.065,0.34,0.07),
    silver
  );

  spoke.rotation.z=i*Math.PI*2/3;
  steeringGroup.add(spoke);
}

steeringGroup.position.set(-0.55,-0.55,-1.25);
cockpit.add(steeringGroup);

// Driver arms and hands

function arm(start,end,radius,material){

  const a=new THREE.Vector3(...start);
  const b=new THREE.Vector3(...end);
  const dir=new THREE.Vector3().subVectors(b,a);

  const mesh=new THREE.Mesh(
    new THREE.CylinderGeometry(radius*0.85,radius,dir.length(),12),
    material
  );

  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    dir.normalize()
  );

  cockpit.add(mesh);
}

arm([-1.2,-1.25,-0.65],[-0.85,-0.8,-1.12],0.13,mat(0x202632));
arm([1.1,-1.25,-0.65],[-0.25,-0.8,-1.12],0.13,mat(0x202632));

const hands=new THREE.Group();

function hand(x){

  const palm=new THREE.Mesh(
    new THREE.SphereGeometry(0.105,16,16),
    skin
  );

  palm.position.set(x,0,0);
  hands.add(palm);
}

hand(-0.31);
hand(0.31);

hands.position.set(0,0.16,0.04);
steeringGroup.add(hands);

// Windshield pillars

for(const x of [-1.85,1.85]){

  const pillar=new THREE.Mesh(
    new THREE.BoxGeometry(0.11,2.6,0.13),
    black
  );

  pillar.position.set(x,0.35,-1.6);
  cockpit.add(pillar);
}

// Roof

const roofInside=new THREE.Mesh(
  new THREE.BoxGeometry(3.8,0.12,0.35),
  black
);

roofInside.position.set(0,1.72,-1.55);
cockpit.add(roofInside);

// ==========================================
// 10. CAMERA MODES
// ==========================================

let firstPerson=true;

function changeCamera(){

  firstPerson=!firstPerson;

  cockpit.visible=firstPerson;

  document.getElementById("cameraMode").textContent=
    firstPerson
    ? "CAMERA: FIRST PERSON"
    : "CAMERA: THIRD PERSON";
}

// ==========================================
// 11. CONTROLS
// ==========================================

const keys={};

window.addEventListener("keydown",e=>{

  keys[e.key.toLowerCase()]=true;

  if(e.key.startsWith("Arrow")) e.preventDefault();

  if(e.key.toLowerCase()==="c"&&!e.repeat){
    changeCamera();
  }

});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

let speed=0;
let steering=0;
let carX=0;
let carZ=0;
let yaw=0;

const MAX_SPEED=1000;

// ==========================================
// 12. DRIVING
// ==========================================

const clock=new THREE.Clock();

function animate(){

  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),0.05);

  // ACCELERATION

  if(keys["w"]||keys["arrowup"]){
    speed+=28*dt;
  }else{
    speed-=5*dt;
  }

  // BRAKING

  if(keys["s"]||keys["arrowdown"]){
    speed-=100*dt;
  }

  speed=THREE.MathUtils.clamp(speed,0,MAX_SPEED);

  // STEERING

  let input=0;

  if(keys["a"]||keys["arrowleft"]) input=-1;
  if(keys["d"]||keys["arrowright"]) input=1;

  steering+=(input-steering)*Math.min(5*dt,1);

  carX+=input*speed*0.001*dt;
  carX=THREE.MathUtils.clamp(carX,-13,13);

  yaw=-steering*0.3;

  // CAR POSITION

  car.position.set(carX,0,carZ);
  car.rotation.y=yaw;

  // FRONT WHEEL STEERING

  frontWheels.forEach(w=>{
    w.rotation.y=-steering*0.4;
  });

  // WHEEL ROTATION

  wheelGroups.forEach(w=>{
    w.rotation.x+=speed*dt*0.002;
  });

  // WORLD MOVEMENT

  carZ-=speed*0.006*dt;

  const playerZ=carZ;

  // ROAD LINES

  roadLines.forEach(line=>{
    if(line.position.z>playerZ+40){
      line.position.z-=12000;
    }
  });

  // TREES

  trees.forEach(tree=>{
    if(tree.position.z>playerZ+80){
      tree.position.z-=11000;
    }
  });

  // BUILDINGS

  buildings.forEach(building=>{
    if(building.position.z>playerZ+100){
      building.position.z-=11000;
    }
  });

  // CAMERA

  if(firstPerson){

    camera.position.set(
      carX,
      1.65,
      carZ-0.15
    );

    camera.rotation.order="YXZ";
    camera.rotation.set(0,yaw,0);

  }else{

    // Third-person chase camera

    const desiredPosition=new THREE.Vector3(
      carX+Math.sin(yaw)*9,
      4.2,
      carZ+9
    );

    camera.position.lerp(desiredPosition,Math.min(dt*5,1));

    camera.lookAt(
      carX,
      1.1,
      carZ-2.5
    );

  }

  // STEERING WHEEL

  steeringGroup.rotation.z=-steering*0.7;

  // HUD

  document.getElementById("speed").textContent=
    Math.round(speed)+" KM/H";

  renderer.render(scene,camera);
}

animate();

// ==========================================
// 13. RESIZE
// ==========================================

window.addEventListener("resize",()=>{

  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

</script>
</body>
</html>
