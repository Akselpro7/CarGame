<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nissan GT-R Simulator</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  overflow:hidden;
  font-family:Arial;
  background:#87ceeb;
}

canvas { display:block; }

#speed {
  position:fixed;
  right:25px;
  bottom:25px;
  background:#080b12ee;
  color:white;
  padding:20px;
  border:2px solid #d71920;
  border-radius:12px;
  font-size:30px;
  z-index:10;
}

#help {
  position:fixed;
  top:20px;
  left:20px;
  background:#080b12dd;
  color:white;
  padding:15px;
  border-radius:8px;
  line-height:1.7;
  z-index:10;
}

#carname {
  position:fixed;
  top:20px;
  right:20px;
  background:#080b12dd;
  color:#ff3030;
  padding:15px;
  font-size:19px;
  font-weight:bold;
  z-index:10;
}
</style>
</head>

<body>

<div id="speed">0 KM/H</div>

<div id="help">
W / ↑ = GAS<br>
S / ↓ = BRAKE<br>
A / ← = LEFT<br>
D / → = RIGHT
</div>

<div id="carname">NISSAN GT-R R35</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ===================================
// WORLD
// ===================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,150,600);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
2000
);

camera.position.set(0,1.65,0);

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);
scene.add(camera);

// ===================================
// LIGHTING
// ===================================

scene.add(new THREE.HemisphereLight(0xffffff,0x445544,2));

const sun = new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-50,100,50);
sun.castShadow = true;
scene.add(sun);

// ===================================
// MATERIALS
// ===================================

function mat(color,roughness=0.5,metalness=0) {
return new THREE.MeshStandardMaterial({
color,
roughness,
metalness
});
}

const black = mat(0x08090c,0.35,0.5);
const leather = mat(0x171717);
const red = mat(0xc90020,0.3,0.5);
const silver = mat(0x999999,0.3,0.8);
const skin = mat(0xc58b68);
const glass = new THREE.MeshStandardMaterial({
color:0x172c3c,
metalness:0.7,
roughness:0.2
});

// ===================================
// LANDSCAPE
// ===================================

const ground = new THREE.Mesh(
new THREE.PlaneGeometry(1500,1500),
mat(0x477c38)
);

ground.rotation.x=-Math.PI/2;
ground.position.set(0,-0.1,-400);
scene.add(ground);

// Road

const road = new THREE.Mesh(
new THREE.PlaneGeometry(22,1500),
mat(0x242629,0.95)
);

road.rotation.x=-Math.PI/2;
road.position.z=-700;
scene.add(road);

// Road lines

const lines=[];

for(let i=0;i<100;i++){

const line=new THREE.Mesh(
new THREE.BoxGeometry(0.2,0.03,8),
mat(0xffffff)
);

line.position.set(0,0.03,-i*15);
scene.add(line);
lines.push(line);

}

// ===================================
// TREES
// ===================================

const trees=[];

function tree(x,z){

const group=new THREE.Group();

const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(0.2,0.3,3),
mat(0x634329)
);

trunk.position.y=1.5;
group.add(trunk);

const leaves=new THREE.Mesh(
new THREE.ConeGeometry(2,6,8),
mat(0x145c25)
);

leaves.position.y=5;
group.add(leaves);

group.position.set(x,0,z);
scene.add(group);
trees.push(group);

}

for(let i=0;i<80;i++){

tree(-15-Math.random()*30,-i*12);
tree(15+Math.random()*30,-i*12);

}

// ===================================
// CAR INTERIOR
// ===================================

const interior=new THREE.Group();
camera.add(interior);

// Dashboard

const dashboard=new THREE.Mesh(
new THREE.BoxGeometry(4,0.7,1.2),
leather
);

dashboard.position.set(0,-0.85,-1.25);
interior.add(dashboard);

// Red dashboard details

const dashLine=new THREE.Mesh(
new THREE.BoxGeometry(3.5,0.035,0.04),
red
);

dashLine.position.set(0,-0.55,-1.85);
interior.add(dashLine);

// Dashboard screen

const screen=new THREE.Mesh(
new THREE.BoxGeometry(0.8,0.5,0.06),
mat(0x071b29,0.2)
);

screen.position.set(0.75,-0.65,-1.85);
interior.add(screen);

// Steering wheel

const steeringGroup=new THREE.Group();

const wheel=new THREE.Mesh(
new THREE.TorusGeometry(0.43,0.065,16,64),
black
);

steeringGroup.add(wheel);

// Wheel center

const hub=new THREE.Mesh(
new THREE.CylinderGeometry(0.15,0.15,0.12,32),
red
);

hub.rotation.x=Math.PI/2;
steeringGroup.add(hub);

// Wheel spokes

for(let i=0;i<3;i++){

const spoke=new THREE.Mesh(
new THREE.BoxGeometry(0.075,0.4,0.08),
silver
);

spoke.rotation.z=i*Math.PI*2/3;
steeringGroup.add(spoke);

}

steeringGroup.position.set(-0.55,-0.48,-1);
interior.add(steeringGroup);

// ===================================
// DRIVER BODY
// ===================================

const driver=new THREE.Group();

// Torso

const torso=new THREE.Mesh(
new THREE.BoxGeometry(0.75,0.95,0.4),
mat(0x171b24)
);

torso.position.set(0,-0.05,-0.55);
driver.add(torso);

// Neck

const neck=new THREE.Mesh(
new THREE.CylinderGeometry(0.12,0.14,0.25,16),
skin
);

neck.position.set(0,0.5,-0.55);
driver.add(neck);

// Head

const head=new THREE.Mesh(
new THREE.SphereGeometry(0.25,24,24),
skin
);

head.position.set(0,0.78,-0.55);
driver.add(head);

// Hair

const hair=new THREE.Mesh(
new THREE.SphereGeometry(0.255,24,16,0,Math.PI*2,0,Math.PI/2),
mat(0x17120e)
);

hair.position.set(0,0.84,-0.55);
driver.add(hair);

interior.add(driver);

// ===================================
// DRIVER ARMS AND HANDS
// ===================================

function createArm(side){

const arm=new THREE.Group();

const upper=new THREE.Mesh(
new THREE.CylinderGeometry(0.105,0.13,0.55,16),
mat(0x171b24)
);

upper.rotation.z=side*0.8;
upper.position.set(side*0.25,-0.15,-0.75);
arm.add(upper);

const forearm=new THREE.Mesh(
new THREE.CylinderGeometry(0.085,0.11,0.5,16),
mat(0x171b24)
);

forearm.rotation.z=-side*0.8;
forearm.position.set(side*0.55,-0.38,-0.9);
arm.add(forearm);

// Hand

const hand=new THREE.Mesh(
new THREE.SphereGeometry(0.115,20,20),
skin
);

hand.position.set(side*0.72,-0.48,-1.03);
arm.add(hand);

return arm;

}

const leftArm=createArm(-1);
const rightArm=createArm(1);

interior.add(leftArm);
interior.add(rightArm);

// ===================================
// WINDSHIELD AND ROOF
// ===================================

const roof=new THREE.Mesh(
new THREE.BoxGeometry(3.8,0.18,0.4),
black
);

roof.position.set(0,1.8,-1.5);
interior.add(roof);

// Pillars

for(const x of [-1.85,1.85]){

const pillar=new THREE.Mesh(
new THREE.BoxGeometry(0.13,2.8,0.15),
black
);

pillar.position.set(x,0.5,-1.5);
interior.add(pillar);

}

// Rearview mirror

const mirror=new THREE.Mesh(
new THREE.BoxGeometry(0.7,0.22,0.12),
black
);

mirror.position.set(0,1.05,-1.2);
interior.add(mirror);

// ===================================
// CONTROLS
// ===================================

const keys={};

window.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
if(e.key.startsWith("Arrow")) e.preventDefault();
});

window.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

// ===================================
// ENGINE
// ===================================

let speed=0;
let steering=0;
let carX=0;

const MAX_SPEED=1000;

// ===================================
// TURBO EFFECT
// ===================================

let turboIntensity=0;

function animate(){

requestAnimationFrame(animate);

// GAS

if(keys["w"]||keys["arrowup"]){

speed=Math.min(speed+1.2,MAX_SPEED);

turboIntensity=Math.min(turboIntensity+0.04,1);

}else{

speed=Math.max(speed-0.08,0);

turboIntensity=Math.max(turboIntensity-0.03,0);

}

// BRAKE

if(keys["s"]||keys["arrowdown"]){

speed=Math.max(speed-3,0);

}

// STEERING

if(keys["a"]||keys["arrowleft"]){

steering=Math.min(steering+0.025,0.65);

}

else if(keys["d"]||keys["arrowright"]){

steering=Math.max(steering-0.025,-0.65);

}

else{

steering*=0.92;

}

// TURNING

carX-=steering*speed*0.00008;

carX=THREE.MathUtils.clamp(carX,-8,8);

camera.position.x=carX;

// Steering wheel and hands

steeringGroup.rotation.z=-steering*1.8;

leftArm.rotation.z=steering*0.4;
rightArm.rotation.z=steering*0.4;

// WORLD SPEED

const movement=speed*0.0025;

// Road lines

lines.forEach(line=>{

line.position.z+=movement;

if(line.position.z>10){

line.position.z-=1500;

}

});

// Trees

trees.forEach(t=>{

t.position.z+=movement;

if(t.position.z>15){

t.position.z-=960;

}

});

// Speedometer

document.getElementById("speed").textContent=
Math.round(speed)+" KM/H";

// Camera vibration at high speed

camera.position.y=
1.65+Math.sin(Date.now()*0.015)*speed*0.000015;

renderer.render(scene,camera);

}

animate();

// ===================================
// RESIZE
// ===================================

window.addEventListener("resize",()=>{

camera.aspect=window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(window.innerWidth,window.innerHeight);

});

</script>
</body>
</html>
