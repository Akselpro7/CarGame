
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GT-R Open World</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#87ceeb;font-family:Arial}
canvas{display:block}
#help,#brand,#speed,#mode{
position:fixed;background:#10151eee;color:white;
padding:14px;border-radius:10px;z-index:10
}
#help{top:12px;left:12px;line-height:1.7}
#brand{top:12px;right:12px;color:#ff3045;font-weight:bold}
#speed{bottom:18px;right:18px;font-size:27px;border:2px solid red}
#mode{bottom:18px;left:12px}
</style>
</head>

<body>

<div id="help">
W / ↑ GAS<br>
S / ↓ BRAKE<br>
A / ← LEFT<br>
D / → RIGHT<br>
C = CHANGE CAMERA
</div>

<div id="brand">NISSAN GT-R R35</div>
<div id="speed">0 KM/H</div>
<div id="mode">FIRST PERSON</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ====================================
// 1. SCENE
// ====================================

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,180,1500);

const camera=new THREE.PerspectiveCamera(
75,innerWidth/innerHeight,0.1,5000
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

// ====================================
// 2. LIGHTS
// ====================================

scene.add(new THREE.HemisphereLight(0xffffff,0x536344,2));

const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-100,150,100);
sun.castShadow=true;
scene.add(sun);

// ====================================
// 3. MATERIALS
// ====================================

function mat(color,roughness=0.6,metalness=0){
return new THREE.MeshStandardMaterial({
color,roughness,metalness
});
}

const red=mat(0xb90020,0.25,0.65);
const black=mat(0x111318,0.3,0.4);
const rubber=mat(0x101010);
const silver=mat(0xa8adb2,0.25,0.85);
const white=mat(0xffffff);
const skin=mat(0xc78d6b);
const grassMat=mat(0x51863a);
const roadMat=mat(0x292b30);

// IMPORTANT: Fixed missing material!
const leatherMat=mat(0x25201e,0.7,0);

const glass=new THREE.MeshStandardMaterial({
color:0x28465b,
roughness:0.2,
metalness:0.4,
transparent:true,
opacity:0.65
});

// ====================================
// 4. WORLD
// ====================================

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(6000,14000),
grassMat
);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-0.2,-6500);
scene.add(ground);

// Main road

const road=new THREE.Mesh(
new THREE.PlaneGeometry(30,14000),
roadMat
);
road.rotation.x=-Math.PI/2;
road.position.set(0,0,-6500);
scene.add(road);

// Road lines

const roadLines=[];

for(let i=0;i<350;i++){
const line=new THREE.Mesh(
new THREE.BoxGeometry(0.18,0.04,9),
white
);
line.position.set(0,0.04,-i*40);
scene.add(line);
roadLines.push(line);
}

// Road shoulders

for(const x of [-16,16]){
const shoulder=new THREE.Mesh(
new THREE.BoxGeometry(2,0.1,14000),
mat(0xb1b1a5)
);
shoulder.position.set(x,0,-6500);
scene.add(shoulder);
}

// ====================================
// 5. MOUNTAINS
// ====================================

for(let i=0;i<35;i++){
const mountain=new THREE.Mesh(
new THREE.ConeGeometry(60+Math.random()*60,120,8),
mat(0x718b92)
);
mountain.position.set((i-17)*130,40,-900-Math.random()*400);
scene.add(mountain);
}

// ====================================
// 6. TREES
// ====================================

const trees=[];

function createTree(x,z){

const group=new THREE.Group();

const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(0.2,0.3,3.5,8),
mat(0x68442b)
);
trunk.position.y=1.75;
group.add(trunk);

const leaves=new THREE.Mesh(
new THREE.ConeGeometry(2.2,5.5,9),
mat(0x20652b)
);
leaves.position.y=5;
group.add(leaves);

group.scale.setScalar(0.8+Math.random());
group.position.set(x,0,z);
scene.add(group);
trees.push(group);
}

for(let i=0;i<200;i++){
let z=-Math.random()*12000;
createTree(-23-Math.random()*100,z);
createTree(23+Math.random()*100,z);
}

// ====================================
// 7. CITY
// ====================================

const buildings=[];

function createBuilding(x,z){

const group=new THREE.Group();

const w=12+Math.random()*12;
const h=15+Math.random()*45;
const d=12+Math.random()*12;

const building=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
mat([0xaaa9a2,0x929da8,0x777f8a,0xc0b8aa][Math.floor(Math.random()*4)])
);

building.position.y=h/2;
group.add(building);

for(let y=4;y<h-2;y+=5){
for(let xx=-w/2+2;xx<w/2-1;xx+=4){

const win=new THREE.Mesh(
new THREE.BoxGeometry(1.8,2,0.08),
mat(0x284052,0.2,0.3)
);

win.position.set(xx,y,d/2+0.05);
group.add(win);
}
}

group.position.set(x,0,z);
scene.add(group);
buildings.push(group);
}

for(let i=0;i<75;i++){
createBuilding(-55-Math.random()*110,-100-i*150);
createBuilding(55+Math.random()*110,-100-i*150);
}

// ====================================
// 8. CAR BODY
// ====================================

const car=new THREE.Group();
scene.add(car);

// Main body

function box(parent,w,h,d,color,x,y,z){
const mesh=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),color
);
mesh.position.set(x,y,z);
mesh.castShadow=true;
parent.add(mesh);
return mesh;
}

box(car,2.05,0.72,4.6,red,0,0.72,0);
box(car,2.15,0.3,4.2,mat(0x650014),0,0.43,0);

// Hood

box(car,1.95,0.14,1.4,red,0,1.08,-1.4);

// Roof

box(car,1.7,0.15,1.7,red,0,1.92,0.15);

// Front windshield

const windshield=new THREE.Mesh(
new THREE.BoxGeometry(1.75,0.85,0.08),glass
);
windshield.position.set(0,1.48,-0.83);
windshield.rotation.x=-0.32;
car.add(windshield);

// Rear windshield

const rearGlass=new THREE.Mesh(
new THREE.BoxGeometry(1.7,0.7,0.08),glass
);
rearGlass.position.set(0,1.5,1.05);
rearGlass.rotation.x=0.35;
car.add(rearGlass);

// Side windows

for(const side of [-1,1]){
const windowMesh=new THREE.Mesh(
new THREE.BoxGeometry(0.06,0.7,1.6),glass
);
windowMesh.position.set(side*0.88,1.5,0.1);
car.add(windowMesh);
}

// Bumpers

box(car,2.1,0.35,0.35,black,0,0.48,-2.3);
box(car,2.1,0.35,0.35,black,0,0.48,2.3);

// Grille

box(car,0.9,0.25,0.05,black,0,0.73,-2.48);

// Headlights

for(const side of [-1,1]){
box(car,0.48,0.19,0.08,white,side*0.72,0.96,-2.4);
}

// Rear lights

for(const side of [-1,1]){
const light=new THREE.Mesh(
new THREE.TorusGeometry(0.16,0.045,10,24),
mat(0xff1028)
);
light.position.set(side*0.67,0.85,2.34);
car.add(light);
}

// Spoiler

for(const side of [-1,1]){
box(car,0.1,0.4,0.12,black,side*0.65,1.35,1.75);
}
box(car,2.1,0.12,0.42,black,0,1.58,1.8);

// Exhausts

for(const side of [-1,1]){
const exhaust=new THREE.Mesh(
new THREE.CylinderGeometry(0.12,0.12,0.3,20),
silver
);
exhaust.rotation.x=Math.PI/2;
exhaust.position.set(side*0.7,0.48,2.4);
car.add(exhaust);
}

// ====================================
// 9. WHEELS AND RIMS
// ====================================

const wheels=[];
const frontWheels=[];

function createWheel(x,z,frontWheel){

const group=new THREE.Group();

const tire=new THREE.Mesh(
new THREE.CylinderGeometry(0.42,0.42,0.25,32),
rubber
);
tire.rotation.z=Math.PI/2;
group.add(tire);

const rim=new THREE.Mesh(
new THREE.CylinderGeometry(0.27,0.27,0.27,24),
silver
);
rim.rotation.z=Math.PI/2;
group.add(rim);

const center=new THREE.Mesh(
new THREE.CylinderGeometry(0.09,0.09,0.29,20),
red
);
center.rotation.z=Math.PI/2;
group.add(center);

for(let i=0;i<5;i++){
const spoke=box(group,0.045,0.4,0.055,silver,0,0,0);
spoke.rotation.z=i*Math.PI*2/5;
}

group.position.set(x,0.5,z);
car.add(group);
wheels.push(group);
if(frontWheel)frontWheels.push(group);
}

createWheel(-1.02,-1.45,true);
createWheel(1.02,-1.45,true);
createWheel(-1.02,1.45,false);
createWheel(1.02,1.45,false);

// ====================================
// 10. DRIVER
// ====================================

const driver=new THREE.Group();

const torso=new THREE.Mesh(
new THREE.BoxGeometry(0.65,0.8,0.35),
mat(0x202632)
);
torso.position.set(-0.38,1.25,0.25);
driver.add(torso);

const head=new THREE.Mesh(
new THREE.SphereGeometry(0.22,20,20),
skin
);
head.position.set(-0.38,1.85,0.15);
driver.add(head);

const hair=new THREE.Mesh(
new THREE.SphereGeometry(0.225,20,16,0,Math.PI*2,0,Math.PI/2),
black
);
hair.position.set(-0.38,1.9,0.15);
driver.add(hair);

car.add(driver);

// ====================================
// 11. FIRST PERSON INTERIOR
// ====================================

const cockpit=new THREE.Group();
camera.add(cockpit);

// Dashboard

box(cockpit,3.7,0.42,0.8,leatherMat,0,-0.95,-1.15);
box(cockpit,3.5,0.035,0.035,red,0,-0.75,-1.58);

// Screen

box(cockpit,1.1,0.4,0.06,mat(0x061b27),0.55,-0.54,-1.6);

// Steering wheel

const steeringGroup=new THREE.Group();

const steeringWheel=new THREE.Mesh(
new THREE.TorusGeometry(0.39,0.055,16,48),
black
);
steeringGroup.add(steeringWheel);

const hub=new THREE.Mesh(
new THREE.CylinderGeometry(0.14,0.14,0.1,24),
red
);
hub.rotation.x=Math.PI/2;
steeringGroup.add(hub);

for(let i=0;i<3;i++){
const spoke=box(
steeringGroup,0.065,0.34,0.07,
silver,0,0,0
);
spoke.rotation.z=i*Math.PI*2/3;
}

steeringGroup.position.set(-0.55,-0.55,-1.25);
cockpit.add(steeringGroup);

// Arms

function arm(start,end,radius,material){

const a=new THREE.Vector3(...start);
const b=new THREE.Vector3(...end);
const dir=new THREE.Vector3().subVectors(b,a);

const mesh=new THREE.Mesh(
new THREE.CylinderGeometry(radius*0.85,radius,dir.length(),12),
material
);

mesh.position.copy(a).add(b).multiplyScalar(0.5);
mesh.quaternion.setFromUnitVectors(
new THREE.Vector3(0,1,0),dir.normalize()
);
cockpit.add(mesh);
}

arm([-1.2,-1.25,-0.65],[-0.85,-0.8,-1.12],0.13,mat(0x202632));
arm([1.1,-1.25,-0.65],[-0.25,-0.8,-1.12],0.13,mat(0x202632));

// Hands

for(const x of [-0.31,0.31]){
const hand=new THREE.Mesh(
new THREE.SphereGeometry(0.105,16,16),
skin
);
hand.position.set(x,0.16,0.04);
steeringGroup.add(hand);
}

// Windshield pillars

for(const x of [-1.85,1.85]){
box(cockpit,0.11,2.6,0.13,black,x,0.35,-1.6);
}

// Roof

box(cockpit,3.8,0.12,0.35,black,0,1.72,-1.55);

// ====================================
// 12. CAMERA SWITCHING
// ====================================

let firstPerson=true;

function switchCamera(){
firstPerson=!firstPerson;
cockpit.visible=firstPerson;

document.getElementById("mode").textContent=
firstPerson?"FIRST PERSON":"THIRD PERSON";
}

// ====================================
// 13. CONTROLS
// ====================================

const keys={};

window.addEventListener("keydown",e=>{

keys[e.key.toLowerCase()]=true;

if(e.key.startsWith("Arrow"))e.preventDefault();

if(e.key.toLowerCase()==="c"&&!e.repeat){
switchCamera();
}

});

window.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

// ====================================
// 14. DRIVING SYSTEM
// ====================================

let speed=0;
let steering=0;
let carX=0;
let carZ=0;
let yaw=0;

const clock=new THREE.Clock();

function animate(){

requestAnimationFrame(animate);

const dt=Math.min(clock.getDelta(),0.05);

// Acceleration

if(keys["w"]||keys["arrowup"]){
speed+=28*dt;
}else{
speed-=5*dt;
}

// Brake

if(keys["s"]||keys["arrowdown"]){
speed-=100*dt;
}

speed=THREE.MathUtils.clamp(speed,0,1000);

// Steering

let input=0;

if(keys["a"]||keys["arrowleft"])input=-1;
if(keys["d"]||keys["arrowright"])input=1;

steering+=(input-steering)*Math.min(5*dt,1);

carX+=input*speed*0.001*dt;
carX=THREE.MathUtils.clamp(carX,-13,13);

yaw=-steering*0.3;

// Car position

car.position.set(carX,0,carZ);
car.rotation.y=yaw;

// Wheels

frontWheels.forEach(w=>{
w.rotation.y=-steering*0.4;
});

wheels.forEach(w=>{
w.rotation.x+=speed*dt*0.002;
});

// World movement

carZ-=speed*0.006*dt;

const playerZ=carZ;

// Recycle road lines

roadLines.forEach(line=>{
if(line.position.z>playerZ+40){
line.position.z-=14000;
}
});

// Recycle trees

trees.forEach(tree=>{
if(tree.position.z>playerZ+80){
tree.position.z-=12000;
}
});

// Recycle buildings

buildings.forEach(building=>{
if(building.position.z>playerZ+100){
building.position.z-=12000;
}
});

// Camera

if(firstPerson){

camera.position.set(carX,1.65,carZ-0.15);
camera.rotation.order="YXZ";
camera.rotation.set(0,yaw,0);

}else{

const desired=new THREE.Vector3(
carX+Math.sin(yaw)*9,
4.2,
carZ+9
);

camera.position.lerp(desired,Math.min(dt*5,1));
camera.lookAt(carX,1.1,carZ-2.5);

}

// Steering wheel

steeringGroup.rotation.z=-steering*0.7;

// Speed

document.getElementById("speed").textContent=
Math.round(speed)+" KM/H";

renderer.render(scene,camera);

}

// ====================================
// 15. START
// ====================================

camera.position.set(0,1.65,0);
animate();

// ====================================
// 16. RESIZE
// ====================================

window.addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(innerWidth,innerHeight);

});

</script>
</body>
</html>
