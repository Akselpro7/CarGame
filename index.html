<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT-R Open World Driving</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87b9e9;font-family:Arial,sans-serif}
#game{position:fixed;inset:0}
#hud{position:fixed;left:20px;bottom:18px;color:white;background:#101820dd;padding:15px 20px;border:1px solid #ffffff44;border-radius:12px;min-width:190px;z-index:5}
#speed{font-size:38px;font-weight:bold}
#unit{font-size:13px;color:#bbb}
#gear{font-size:19px;margin-top:5px}
#help{position:fixed;right:18px;top:18px;background:#101820cc;color:white;padding:12px 15px;border-radius:10px;font-size:13px;line-height:1.8;z-index:5}
#camera{position:fixed;right:18px;bottom:18px;background:#101820dd;color:white;border:1px solid #ffffff55;border-radius:9px;padding:12px 17px;font-size:14px;z-index:5;cursor:pointer}
#loading{position:fixed;inset:0;background:#17232c;color:white;display:grid;place-items:center;z-index:20;font-size:20px;text-align:center;padding:25px}
#error{color:#ffaaaa;font-size:14px;max-width:500px;margin-top:15px}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div><span id="speed">0</span> <span id="unit">KM/H</span></div>
  <div id="gear">GEAR: N</div>
  <div id="rpm">RPM: 850</div>
  <div id="status">GT-R READY</div>
</div>

<div id="help">
  <b>DRIVING CONTROLS</b><br>
  W / ↑ — Accelerate<br>
  S / ↓ — Brake / Reverse<br>
  A / ← — Steer left<br>
  D / → — Steer right<br>
  SPACE — Handbrake<br>
  C — Change camera
</div>

<button id="camera">CAMERA: THIRD PERSON</button>
<div id="loading">
  <div>
    <b>GT-R OPEN WORLD</b><br><br>
    Loading city and Nissan GT-R...
    <div id="error"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";

const loading = document.getElementById("loading");
const errorBox = document.getElementById("error");

window.onerror = function(message) {
  errorBox.textContent = "Game error: " + message +
    ". Check your internet connection and reload.";
};

if (!window.THREE) {
  errorBox.textContent = "Three.js could not load. Check your internet connection and reload.";
  throw new Error("Three.js not loaded");
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87bce8);
scene.fog = new THREE.Fog(0x87bce8, 100, 650);

const camera = new THREE.PerspectiveCamera(
  70, window.innerWidth/window.innerHeight, 0.1, 3000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x59664a,1.35));

const sun = new THREE.DirectionalLight(0xfff0d2,2.1);
sun.position.set(-100,160,80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-100;
sun.shadow.camera.right=100;
sun.shadow.camera.top=100;
sun.shadow.camera.bottom=-100;
scene.add(sun);

const mat = (color, roughness=0.75, metalness=0) =>
  new THREE.MeshStandardMaterial({color,roughness,metalness});

const materials = {
  road:mat(0x33383a),
  pavement:mat(0xb8aa91),
  grass:mat(0x64864b),
  white:mat(0xf1eee5),
  yellow:mat(0xe4c44b),
  building1:mat(0xd4ae82),
  building2:mat(0xb9a18c),
  building3:mat(0xe2c9a2),
  glass:new THREE.MeshStandardMaterial({
    color:0x5c9eb9,metalness:0.35,roughness:0.15,
    transparent:true,opacity:0.32
  }),
  rubber:mat(0x101114,0.95),
  rim:mat(0x999da3,0.25,0.85),
  black:mat(0x090b0e,0.35,0.3),
  leather:mat(0x17191d,0.85),
  red:mat(0xd31320,0.35,0.4),
  light:mat(0xfff2cc,0.2,0.2),
  chrome:mat(0xc3cbd0,0.2,0.9)
};

function box(parent,w,h,d,x,y,z,material,cast=true) {
  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),material
  );
  mesh.position.set(x,y,z);
  mesh.castShadow=cast;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

function cylinder(parent,r1,r2,length,x,y,z,material,segments=24) {
  const mesh=new THREE.Mesh(
    new THREE.CylinderGeometry(r1,r2,length,segments),material
  );
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  parent.add(mesh);
  return mesh;
}

function sphere(parent,r,x,y,z,material) {
  const mesh=new THREE.Mesh(
    new THREE.SphereGeometry(r,20,14),material
  );
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  parent.add(mesh);
  return mesh;
}

// --------------------------------------------------
// CITY: endless road and city blocks
// --------------------------------------------------

const chunks = new Map();
const CHUNK_LENGTH = 180;

function createPalm(parent,x,z) {
  const trunk=cylinder(
    parent,0.24,0.34,5.2,x,2.6,z,mat(0x805333)
  );
  trunk.rotation.z=-0.08;

  for(let i=0;i<7;i++){
    const angle=i*Math.PI*2/7;
    const leaf=box(
      parent,0.32,0.12,3.5,
      x+Math.sin(angle)*1.25,5.1,z+Math.cos(angle)*1.25,
      mat(0x34723a)
    );
    leaf.rotation.y=angle;
    leaf.rotation.x=-0.22;
  }
}

function createChunk(index) {
  if(chunks.has(index)) return;

  const group=new THREE.Group();
  group.position.z=-index*CHUNK_LENGTH;
  scene.add(group);
  chunks.set(index,group);

  // Ground
  box(group,700,0.3,CHUNK_LENGTH,0,-0.35,0,materials.grass,false);

  // Road and pavements
  box(group,19,0.12,CHUNK_LENGTH,0,-0.12,0,materials.road,false);
  box(group,3,0.18,CHUNK_LENGTH,-11,-0.08,0,materials.pavement,false);
  box(group,3,0.18,CHUNK_LENGTH,11,-0.08,0,materials.pavement,false);

  // Road edges
  box(group,0.16,0.03,CHUNK_LENGTH,-9.4,-0.035,0,materials.white,false);
  box(group,0.16,0.03,CHUNK_LENGTH,9.4,-0.035,0,materials.white,false);

  // Centre lane markings
  for(let z=-CHUNK_LENGTH/2;z<CHUNK_LENGTH/2;z+=18){
    box(group,0.22,0.035,8,0,-0.025,z,materials.yellow,false);
  }

  // City buildings
  for(let side of [-1,1]){
    for(let j=0;j<5;j++){
      const z=-CHUNK_LENGTH/2+20+j*35+Math.random()*8;
      const width=12+Math.random()*13;
      const depth=17+Math.random()*16;
      const height=10+Math.random()*35;
      const x=side*(23+Math.random()*25);

      const palette=[
        materials.building1,
        materials.building2,
        materials.building3
      ];
      const building=box(
        group,width,height,depth,x,height/2-0.15,z,
        palette[Math.floor(Math.random()*palette.length)]
      );

      // Roof detail
      box(
        group,width*0.65,0.6,depth*0.65,
        x,height+0.15,z,materials.pavement
      );

      // Front windows
      for(let floor=2;floor<height-2;floor+=4){
        for(let wx=-width/2+2;wx<width/2-1;wx+=3){
          box(
            group,1.4,1.7,0.08,
            x+wx,floor,z-depth/2-0.06,
            materials.glass,false
          );
        }
      }
    }

    // Palm trees
    for(let j=0;j<4;j++){
      createPalm(
        group,
        side*(14.5+Math.random()*3),
        -CHUNK_LENGTH/2+25+j*42
      );
    }

    // Streetlights
    for(let j=0;j<3;j++){
      const z=-CHUNK_LENGTH/2+35+j*60;
      const x=side*12.3;
      cylinder(group,0.09,0.09,7,x,3.5,z,materials.black);
      box(group,1.5,0.12,0.25,x-side*0.55,7,z,materials.black);
      sphere(group,0.22,x-side*1.15,6.95,z,materials.light);
    }
  }
}

function updateChunks() {
  const current=Math.floor(-car.position.z/CHUNK_LENGTH);
  for(let i=current-3;i<=current+5;i++) createChunk(i);

  for(const [index,group] of chunks){
    if(index<current-4 || index>current+6){
      scene.remove(group);
      chunks.delete(index);
    }
  }
}

// --------------------------------------------------
// NISSAN GT-R R35-INSPIRED CAR
// --------------------------------------------------

const car=new THREE.Group();
scene.add(car);

const body=new THREE.Group();
car.add(body);

const paint=new THREE.MeshStandardMaterial({
  color:0x111c32,metalness:0.78,roughness:0.24
});
const carbon=mat(0x111318,0.42,0.45);
const redPaint=mat(0x9c1018,0.3,0.4);

// Main body
box(body,2.05,0.58,4.55,0,0.72,0,paint);
box(body,1.92,0.26,1.15,0,0.93,-1.62,paint);
box(body,1.95,0.28,0.95,0,0.91,1.62,paint);

// Bonnet
box(body,1.94,0.16,1.35,0,1.02,-1.35,paint);
box(body,0.48,0.1,0.62,0,1.13,-1.35,carbon);

// Roof and cabin
box(body,1.55,0.16,1.55,0,1.77,0.15,paint);
box(body,1.52,0.12,0.12,0,1.72,-0.69,carbon);
box(body,1.52,0.12,0.12,0,1.72,0.98,carbon);

// Side window frames
for(const side of [-1,1]){
  box(body,0.10,0.85,0.13,side*0.81,1.34,-0.64,paint);
  box(body,0.10,0.85,0.13,side*0.81,1.34,0.91,paint);

  const sideGlass=box(
    body,0.035,0.56,1.28,side*0.81,1.38,0.13,materials.glass,false
  );
  sideGlass.rotation.x=-0.02;

  box(body,0.12,0.3,2.65,side*1.0,0.74,0.05,paint);
  box(body,0.15,0.12,1.2,side*1.0,0.57,-0.7,carbon);
}

// Windshield and rear glass
const windshield=box(
  body,1.58,0.75,0.07,0,1.37,-0.68,materials.glass,false
);
windshield.rotation.x=-0.20;

const rearGlass=box(
  body,1.55,0.66,0.07,0,1.37,0.98,materials.glass,false
);
rearGlass.rotation.x=0.22;

// Front and rear bumpers
box(body,2.12,0.28,0.25,0,0.49,-2.3,carbon);
box(body,2.12,0.28,0.25,0,0.49,2.3,carbon);

// Front grille
box(body,0.95,0.24,0.04,0,0.65,-2.435,carbon);
box(body,0.55,0.07,0.035,0,0.65,-2.46,materials.black);

// Headlights
for(const side of [-1,1]){
  const lamp=box(body,0.52,0.18,0.08,side*0.69,0.91,-2.29,materials.light);
  lamp.rotation.z=side*0.08;

  // Rear lights
  cylinder(body,0.19,0.19,0.08,side*0.69,0.92,2.32,redPaint,32)
    .rotation.x=Math.PI/2;
  cylinder(body,0.12,0.12,0.09,side*0.69,0.92,2.39,materials.red,32)
    .rotation.x=Math.PI/2;
}

// GT-R-style rear wing
box(body,1.85,0.10,0.38,0,1.86,1.85,carbon);
for(const side of [-1,1]){
  box(body,0.10,0.36,0.12,side*0.62,1.68,1.82,carbon);
}

// Side mirrors
for(const side of [-1,1]){
  box(body,0.26,0.16,0.30,side*1.08,1.38,-0.55,carbon);
}

// Wheels
const wheels=[];
const wheelSteer=[];
const wheelPositions=[
  [-1.02,0.43,-1.48],
  [1.02,0.43,-1.48],
  [-1.02,0.43,1.48],
  [1.02,0.43,1.48]
];

for(let i=0;i<4;i++){
  const [x,y,z]=wheelPositions[i];
  const pivot=new THREE.Group();
  pivot.position.set(x,y,z);
  body.add(pivot);
  wheelSteer.push(pivot);

  const tyre=new THREE.Mesh(
    new THREE.CylinderGeometry(0.43,0.43,0.30,32),
    materials.rubber
  );
  tyre.rotation.z=Math.PI/2;
  tyre.castShadow=true;
  pivot.add(tyre);

  const rim=new THREE.Mesh(
    new THREE.CylinderGeometry(0.27,0.27,0.315,24),
    materials.rim
  );
  rim.rotation.z=Math.PI/2;
  pivot.add(rim);

  for(let spoke=0;spoke<10;spoke++){
    const a=spoke*Math.PI/5;
    const bar=box(
      pivot,0.055,0.34,0.045,
      0,Math.sin(a)*0.13,Math.cos(a)*0.13,
      materials.chrome,false
    );
    bar.rotation.x=a;
  }

  cylinder(pivot,0.09,0.09,0.34,0,0,0,carbon);
  wheels.push(tyre);
}

// --------------------------------------------------
// INTERIOR: DASHBOARD, SEATS, WHEEL AND DRIVER
// --------------------------------------------------

const interior=new THREE.Group();
body.add(interior);

// Floor and centre tunnel
box(interior,1.7,0.13,2.6,0,0.49,0.2,materials.leather);
box(interior,0.34,0.32,1.45,0,0.68,0.35,carbon);

// Dashboard
box(interior,1.85,0.35,0.48,0,1.12,-0.72,materials.black);
box(interior,1.8,0.08,0.48,0,1.32,-0.72,materials.leather);

// Dashboard screen
box(interior,0.48,0.22,0.035,-0.38,1.34,-0.95,mat(0x142d3c));
box(interior,0.38,0.18,0.035,0.36,1.34,-0.95,mat(0x142d3c));

// Air vents
for(const x of [-0.72,-0.53,0.53,0.72]){
  box(interior,0.12,0.07,0.035,x,1.25,-0.97,materials.chrome);
}

// Centre console and gear shifter
box(interior,0.52,0.12,0.85,0,0.77,-0.02,materials.leather);
box(interior,0.18,0.32,0.18,0,0.91,0.12,carbon);
sphere(interior,0.11,0,1.08,0.12,materials.chrome);

// Seats
function createSeat(x){
  box(interior,0.65,0.18,0.65,x,0.67,0.47,materials.leather);
  const back=box(interior,0.65,0.95,0.22,x,1.12,0.78,materials.leather);
  back.rotation.x=-0.12;
  box(interior,0.72,0.16,0.24,x,1.55,0.78,carbon);
  box(interior,0.12,0.65,0.18,x-0.25,1.12,0.78,carbon);
  box(interior,0.12,0.65,0.18,x+0.25,1.12,0.78,carbon);
}
createSeat(-0.42);
createSeat(0.42);

// Steering wheel on left side
const steeringAssembly=new THREE.Group();
steeringAssembly.position.set(-0.52,1.30,-0.42);
interior.add(steeringAssembly);

const steeringRing=new THREE.Mesh(
  new THREE.TorusGeometry(0.28,0.035,12,40),
  materials.black
);
steeringAssembly.add(steeringRing);

box(steeringAssembly,0.055,0.48,0.055,0,0,0,materials.black);
box(steeringAssembly,0.48,0.055,0.055,0,0,0,materials.black);
cylinder(steeringAssembly,0.095,0.095,0.08,0,0,0,carbon);

// Driver body and head
const driver=new THREE.Group();
driver.position.set(-0.43,0,0.55);
interior.add(driver);

const shirt=mat(0x202b39);
const skin=mat(0xb77b56);

box(driver,0.48,0.65,0.28,0,1.15,0,shirt);
sphere(driver,0.20,0,1.65,-0.02,skin);
sphere(driver,0.205,0,1.78,-0.02,materials.black);

// Driver arms
function makeArm(start,end,radius,material,parent){
  const direction=new THREE.Vector3().subVectors(end,start);
  const mesh=new THREE.Mesh(
    new THREE.CylinderGeometry(radius*0.75,radius,direction.length(),12),
    material
  );
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),direction.normalize()
  );
  parent.add(mesh);
  return mesh;
}

const leftArm=makeArm(
  new THREE.Vector3(-0.20,1.35,0.02),
  new THREE.Vector3(-0.72,1.30,-0.48),
  0.09,shirt,driver
);
const rightArm=makeArm(
  new THREE.Vector3(0.20,1.35,0.02),
  new THREE.Vector3(-0.32,1.30,-0.48),
  0.09,shirt,driver
);

sphere(driver,0.09,-0.72,1.30,-0.48,skin);
sphere(driver,0.09,-0.32,1.30,-0.48,skin);

// --------------------------------------------------
// LIGHTS
// --------------------------------------------------

const headLight1=new THREE.SpotLight(0xfff2d2,0,90,0.38,0.4,1);
const headLight2=new THREE.SpotLight(0xfff2d2,0,90,0.38,0.4,1);
headLight1.position.set(-0.7,0.9,-2.2);
headLight2.position.set(0.7,0.9,-2.2);
body.add(headLight1,headLight2);

// --------------------------------------------------
// DRIVING PHYSICS
// --------------------------------------------------

const keys={};
let velocity=0;
let steer=0;
let yaw=0;
let cameraMode=0;
let lastTime=performance.now();

const speedDisplay=document.getElementById("speed");
const gearDisplay=document.getElementById("gear");
const rpmDisplay=document.getElementById("rpm");
const statusDisplay=document.getElementById("status");
const cameraButton=document.getElementById("camera");

window.addEventListener("keydown",e=>{
  const key=e.key.toLowerCase();
  keys[key]=true;

  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(key)){
    e.preventDefault();
  }

  if(key==="c" && !e.repeat) changeCamera();
});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

window.addEventListener("blur",()=>{
  for(const key in keys) keys[key]=false;
});

function changeCamera(){
  cameraMode=(cameraMode+1)%3;
  const names=[
    "THIRD PERSON",
    "INTERIOR",
    "HOOD CAMERA"
  ];
  cameraButton.textContent="CAMERA: "+names[cameraMode];
}
cameraButton.addEventListener("click",changeCamera);

function smooth(current,target,amount){
  return current+(target-current)*Math.min(1,amount);
}

function updatePhysics(dt){
  const forward=keys["w"]||keys["arrowup"];
  const backward=keys["s"]||keys["arrowdown"];
  const left=keys["a"]||keys["arrowleft"];
  const right=keys["d"]||keys["arrowright"];
  const handbrake=keys[" "];

  // No programmed maximum speed.
  // Holding W continues adding speed.
  if(forward){
    velocity+=18*dt;
  }

  if(backward){
    if(velocity>1) velocity-=34*dt;
    else velocity-=9*dt;
  }

  // Small rolling resistance, not a speed limiter.
  if(!forward && !backward){
    if(velocity>0) velocity=Math.max(0,velocity-0.55*dt);
    if(velocity<0) velocity=Math.min(0,velocity+0.55*dt);
  }

  if(handbrake){
    velocity*=Math.max(0,1-2.5*dt);
  }

  const steeringInput=(right?1:0)-(left?1:0);
  steer=smooth(steer,steeringInput,dt*5);

  const speedFactor=Math.min(Math.abs(velocity)/12,1);
  const direction=velocity>=0?1:-1;
  yaw+=steer*1.15*speedFactor*direction*dt;

  // Moving car in the direction it faces.
  car.position.x+=Math.sin(yaw)*velocity*dt;
  car.position.z-=Math.cos(yaw)*velocity*dt;

  // Small suspension movement
  const suspension=Math.sin(performance.now()*0.012)*0.012*
    Math.min(Math.abs(velocity)/10,1);

  car.position.y=suspension;
  car.rotation.y=yaw;
  car.rotation.z=-steer*0.035*speedFactor;
  car.rotation.x=Math.sin(performance.now()*0.006)*0.004*speedFactor;

  // Front wheel steering
  wheelSteer[0].rotation.y=steer*0.42;
  wheelSteer[1].rotation.y=steer*0.42;

  // Wheel rotation
  for(const wheel of wheels){
    wheel.rotation.x-=velocity*dt*1.8;
  }

  // Moving steering wheel
  steeringAssembly.rotation.z=-steer*0.75;

  // Small driver arm movement
  leftArm.rotation.z=-steer*0.10;
  rightArm.rotation.z=-steer*0.10;

  const kmh=Math.round(Math.abs(velocity)*3.6);
  speedDisplay.textContent=kmh.toLocaleString("en-US");

  let gear="1";
  if(velocity<0) gear="R";
  else if(kmh>260) gear="6";
  else if(kmh>180) gear="5";
  else if(kmh>120) gear="4";
  else if(kmh>65) gear="3";
  else if(kmh>25) gear="2";
  else if(kmh<2) gear="N";

  gearDisplay.textContent="GEAR: "+gear;

  const rpm=Math.round(
    850+Math.min(Math.abs(velocity)*280,7800)
  );
  rpmDisplay.textContent="RPM: "+rpm.toLocaleString("en-US");

  statusDisplay.textContent=handbrake?"HANDBRAKE":
    backward?"BRAKING / REVERSE":
    forward?"ACCELERATING":"FREE ROAM";
}

// --------------------------------------------------
// CAMERA MODES
// --------------------------------------------------

const desiredCamera=new THREE.Vector3();
const lookTarget=new THREE.Vector3();

function updateCamera(dt){
  if(cameraMode===0){
    // Third person
    desiredCamera.set(
      car.position.x+Math.sin(yaw)*7,
      car.position.y+4.1,
      car.position.z+Math.cos(yaw)*8
    );

    lookTarget.set(
      car.position.x,
      car.position.y+1.0,
      car.position.z- Math.cos(yaw)*5
    );
  }
  else if(cameraMode===1){
    // Interior camera
    const localPosition=new THREE.Vector3(-0.12,1.49,0.24);
    localPosition.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
    desiredCamera.set(
      car.position.x+localPosition.x,
      car.position.y+localPosition.y,
      car.position.z+localPosition.z
    );

    const localLook=new THREE.Vector3(-0.1,1.35,-8);
    localLook.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
    lookTarget.set(
      car.position.x+localLook.x,
      car.position.y+localLook.y,
      car.position.z+localLook.z
    );
  }
  else{
    // Hood camera
    const localPosition=new THREE.Vector3(0,1.35,-1.65);
    localPosition.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
    desiredCamera.set(
      car.position.x+localPosition.x,
      car.position.y+localPosition.y,
      car.position.z+localPosition.z
    );

    const localLook=new THREE.Vector3(0,1.2,-12);
    localLook.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
    lookTarget.set(
      car.position.x+localLook.x,
      car.position.y+localLook.y,
      car.position.z+localLook.z
    );
  }

  const follow= cameraMode===1 ? 1 : Math.min(1,dt*4.5);
  camera.position.lerp(desiredCamera,follow);
  camera.lookAt(lookTarget);
}

// --------------------------------------------------
// GAME LOOP
// --------------------------------------------------

function animate(now){
  requestAnimationFrame(animate);

  const dt=Math.min((now-lastTime)/1000,0.04);
  lastTime=now;

  updatePhysics(dt);
  updateChunks();
  updateCamera(dt);

  renderer.render(scene,camera);
}

// Start the world
car.position.set(0,0,0);
updateChunks();

camera.position.set(0,5,10);
camera.lookAt(0,1,0);

loading.style.display="none";
requestAnimationFrame(animate);

// Resize
window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
})();
</script>
</body>
