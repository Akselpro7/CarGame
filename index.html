<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San Andreas Style - Endless Free Roam</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    overflow: hidden;
    background: #8dbbd5;
    font-family: Arial, sans-serif;
}

canvas { display: block; }

#loading {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #182b35;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

#loading h1 {
    font-size: 38px;
    letter-spacing: 5px;
}

#hud {
    position: fixed;
    left: 20px;
    bottom: 20px;
    padding: 15px 20px;
    min-width: 185px;
    color: white;
    background: rgba(20,20,20,.78);
    border: 2px solid rgba(255,255,255,.2);
    border-radius: 10px;
    z-index: 5;
}

#speed {
    font-size: 40px;
    font-weight: bold;
}

#gear {
    color: #ffda61;
    font-size: 18px;
}

#rpm { color: #ddd; }

#help {
    position: fixed;
    top: 15px;
    left: 15px;
    color: white;
    background: rgba(20,20,20,.72);
    padding: 12px;
    border-radius: 8px;
    line-height: 1.7;
    z-index: 5;
    font-size: 13px;
}

#cameraButton {
    position: fixed;
    top: 18px;
    right: 18px;
    padding: 14px 18px;
    color: white;
    background: #26854c;
    border: 2px solid #a4e2a8;
    border-radius: 8px;
    font-weight: bold;
    z-index: 10;
    cursor: pointer;
}

#cameraLabel {
    position: fixed;
    top: 70px;
    right: 20px;
    background: rgba(0,0,0,.6);
    color: white;
    padding: 8px 12px;
    border-radius: 7px;
    z-index: 5;
}

#error {
    display: none;
    position: fixed;
    inset: 0;
    background: #171717;
    color: white;
    padding: 30px;
    z-index: 30;
}
</style>
</head>

<body>

<div id="loading">
    <h1>ENDLESS SAN ANDREAS</h1>
    <p>Loading your city...</p>
</div>

<div id="error"></div>

<div id="help">
    <b>FREE ROAM</b><br>
    W / ↑ - Accelerate<br>
    S / ↓ - Brake<br>
    A / ← - Left<br>
    D / → - Right<br>
    SPACE - Handbrake<br>
    C - Change camera
</div>

<button id="cameraButton">CHANGE CAMERA</button>
<div id="cameraLabel">THIRD PERSON</div>

<div id="hud">
    <div id="speed">0 KM/H</div>
    <div id="gear">GEAR: 1</div>
    <div id="rpm">RPM: 900</div>
    <div id="status">FREE ROAM</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function() {
"use strict";

const loading = document.getElementById("loading");
const errorBox = document.getElementById("error");

window.onerror = function(message) {
    errorBox.style.display = "block";
    errorBox.innerHTML =
        "<h2>Game error</h2><p>" + message + "</p>";
};

if (!window.THREE) {
    loading.innerHTML =
        "<h2>Three.js did not load</h2><p>Check your internet connection.</p>";
    return;
}

const THREE = window.THREE;

// ==================================================
// GRAPHICS SETTINGS
// ==================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8fc4e4);
scene.fog = new THREE.Fog(0x8fc4e4, 150, 720);

const camera = new THREE.PerspectiveCamera(
    72,
    window.innerWidth / window.innerHeight,
    0.1,
    1800
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

document.body.appendChild(renderer.domElement);

// ==================================================
// LIGHTING
// ==================================================

const skyLight = new THREE.HemisphereLight(
    0xd9eeff,
    0x686047,
    1.5
);
scene.add(skyLight);

const sun = new THREE.DirectionalLight(0xffe5b5, 2.1);
sun.position.set(-100, 150, 100);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -110;
sun.shadow.camera.right = 110;
sun.shadow.camera.top = 110;
sun.shadow.camera.bottom = -110;
scene.add(sun);

// ==================================================
// MATERIALS
// ==================================================

function mat(color, roughness = 0.8, metalness = 0) {
    return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness
    });
}

const M = {
    road: mat(0x454448),
    grass: mat(0x6c9149),
    sidewalk: mat(0xa9a398),
    concrete: mat(0x88857c),
    white: mat(0xf4eee0),
    yellow: mat(0xf3ca43),
    dark: mat(0x17191d, 0.4),
    rubber: mat(0x090909),
    metal: mat(0x9b9b9b, 0.3, 0.8),
    blue: mat(0x1648c5, 0.35, 0.35),
    glass: new THREE.MeshStandardMaterial({
        color: 0x29475d,
        roughness: 0.2,
        metalness: 0.3,
        transparent: true,
        opacity: 0.55
    }),
    windows: mat(0x9cc8db, 0.3),
    red: new THREE.MeshStandardMaterial({
        color: 0xff2525,
        emissive: 0x650000
    }),
    lamp: new THREE.MeshStandardMaterial({
        color: 0xfff2c5,
        emissive: 0xaaaa77
    })
};

function box(parent, w, h, d, material, x, y, z) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        material
    );

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
}

function random(min, max) {
    return min + Math.random() * (max - min);
}

// ==================================================
// ENDLESS CITY
// ==================================================

const CHUNK = 180;
const chunks = new Map();

function createPalm(parent, x, z) {
    const palm = new THREE.Group();

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.35, 7, 8),
        mat(0x805532)
    );

    trunk.position.y = 3.5;
    trunk.rotation.z = -0.08;
    palm.add(trunk);

    const leavesMat = mat(0x397d39);

    for (let i = 0; i < 7; i++) {
        const angle = i * Math.PI * 2 / 7;

        const leaf = new THREE.Mesh(
            new THREE.BoxGeometry(0.35, 0.15, 4.5),
            leavesMat
        );

        leaf.position.set(
            Math.sin(angle) * 1.6,
            7.2,
            Math.cos(angle) * 1.6
        );

        leaf.rotation.y = angle;
        leaf.rotation.x = 0.4;
        palm.add(leaf);
    }

    palm.position.set(x, 0, z);
    parent.add(palm);
}

function createBuilding(parent, x, z) {
    const width = random(12, 24);
    const height = random(12, 65);
    const depth = random(12, 28);

    const colors = [
        0xd1b18b,
        0xc3a17e,
        0xa9a091,
        0xc2b7a0,
        0x9a927f,
        0x8e9a94,
        0xd2c6ad,
        0xb28d75
    ];

    const building = new THREE.Group();

    const buildingMat = mat(
        colors[Math.floor(Math.random() * colors.length)]
    );

    box(
        building,
        width,
        height,
        depth,
        buildingMat,
        0,
        height / 2,
        0
    );

    // Windows on front
    for (let y = 3; y < height - 2; y += 4) {
        for (let wx = -width / 2 + 2; wx < width / 2 - 1; wx += 4) {
            box(
                building,
                1.6,
                2,
                0.07,
                M.windows,
                wx,
                y,
                depth / 2 + 0.05
            );
        }
    }

    // Roof
    box(
        building,
        width + 0.3,
        0.35,
        depth + 0.3,
        mat(0x8b8171),
        0,
        height + 0.15,
        0
    );

    // Ground floor shopfront
    if (Math.random() > 0.45) {
        box(
            building,
            width * 0.65,
            2.7,
            0.12,
            mat(0x36566a, 0.3),
            0,
            1.6,
            depth / 2 + 0.12
        );
    }

    building.position.set(x, 0, z);
    parent.add(building);
}

function createChunk(index) {
    if (chunks.has(index)) return;

    const group = new THREE.Group();
    const centerZ = -index * CHUNK;

    const terrain = new THREE.Mesh(
        new THREE.PlaneGeometry(700, CHUNK),
        M.grass
    );

    terrain.rotation.x = -Math.PI / 2;
    terrain.position.set(0, -0.1, centerZ);
    terrain.receiveShadow = true;
    group.add(terrain);

    const road = new THREE.Mesh(
        new THREE.PlaneGeometry(24, CHUNK),
        M.road
    );

    road.rotation.x = -Math.PI / 2;
    road.position.set(0, 0, centerZ);
    road.receiveShadow = true;
    group.add(road);

    // Sidewalks
    for (const x of [-14, 14]) {
        box(
            group, 4, 0.3, CHUNK,
            M.sidewalk, x, 0.05, 0
        );
    }

    // Road lines
    for (let i = 0; i < 15; i++) {
        box(
            group,
            0.18, 0.03, 5,
            M.white,
            0, 0.03,
            -CHUNK / 2 + i * 12
        );
    }

    // Yellow lane edges
    for (const x of [-11.8, 11.8]) {
        box(
            group, 0.15, 0.025, CHUNK,
            M.yellow, x, 0.04, 0
        );
    }

    // City buildings and palm trees
    for (const side of [-1, 1]) {
        for (let i = 0; i < 4; i++) {
            const x = side * random(35, 100);
            const z = random(-80, 80);
            createBuilding(group, x, z);
        }

        for (let i = 0; i < 6; i++) {
            createPalm(
                group,
                side * random(17, 26),
                random(-85, 85)
            );
        }
    }

    // Occasional crossroad
    if (index % 3 === 0) {
        const cross = new THREE.Mesh(
            new THREE.PlaneGeometry(700, 15),
            M.road
        );

        cross.rotation.x = -Math.PI / 2;
        cross.position.y = 0.02;
        cross.position.z = 0;
        group.add(cross);
    }

    group.position.z = centerZ;
    scene.add(group);
    chunks.set(index, group);
}

function updateWorld() {
    const index = Math.floor(-carZ / CHUNK);

    for (let i = index - 2; i <= index + 5; i++) {
        createChunk(i);
    }

    for (const [key, group] of chunks) {
        if (key < index - 3 || key > index + 6) {
            scene.remove(group);
            chunks.delete(key);
        }
    }
}

// ==================================================
// PLAYER CAR
// ==================================================

const car = new THREE.Group();
scene.add(car);

// Main body
box(car, 2.15, 0.65, 4.5, M.blue, 0, 0.83, 0);
box(car, 2.05, 0.22, 1.5, M.blue, 0, 1.18, -1.45);
box(car, 2.05, 0.3, 1.1, M.blue, 0, 1.1, 1.65);

// Cabin
box(car, 1.75, 0.2, 1.9, M.blue, 0, 1.82, 0.1);

const windshield = box(
    car, 1.65, 0.7, 0.06,
    M.glass, 0, 1.52, -0.87
);
windshield.rotation.x = -0.25;

const rearWindow = box(
    car, 1.65, 0.7, 0.06,
    M.glass, 0, 1.52, 1.05
);
rearWindow.rotation.x = 0.25;

for (const x of [-0.91, 0.91]) {
    box(car, 0.06, 0.62, 1.65, M.glass, x, 1.5, 0.1);
}

// Pillars
for (const x of [-0.88, 0.88]) {
    const a = box(car, 0.12, 0.85, 0.12, M.blue, x, 1.5, -0.85);
    a.rotation.x = -0.18;

    const b = box(car, 0.12, 0.85, 0.12, M.blue, x, 1.5, 0.95);
    b.rotation.x = 0.18;
}

// Spoiler
box(car, 2.2, 0.12, 0.35, M.dark, 0, 1.7, 2.15);
box(car, 0.12, 0.35, 0.12, M.dark, -0.75, 1.5, 2.1);
box(car, 0.12, 0.35, 0.12, M.dark, 0.75, 1.5, 2.1);

// Lights
for (const x of [-0.72, 0.72]) {
    box(car, 0.55, 0.17, 0.08, M.lamp, x, 1.1, -2.3);
    box(car, 0.5, 0.17, 0.08, M.red, x, 1.05, 2.3);
}

// Wheels
const wheels = [];
const frontWheels = [];

function createWheel(x, z, front) {
    const wheel = new THREE.Group();

    const tire = new THREE.Mesh(
        new THREE.CylinderGeometry(0.43, 0.43, 0.3, 24),
        M.rubber
    );

    tire.rotation.z = Math.PI / 2;
    wheel.add(tire);

    const rim = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25, 0.25, 0.32, 20),
        M.metal
    );

    rim.rotation.z = Math.PI / 2;
    wheel.add(rim);

    wheel.position.set(x, 0.45, z);
    car.add(wheel);
    wheels.push(wheel);

    if (front) frontWheels.push(wheel);
}

createWheel(-1.08, -1.5, true);
createWheel(1.08, -1.5, true);
createWheel(-1.08, 1.5, false);
createWheel(1.08, 1.5, false);

// ==================================================
// DRIVER AND INTERIOR
// ==================================================

const driver = new THREE.Group();
car.add(driver);

// Seat
box(driver, 0.7, 0.95, 0.55, mat(0x242424), -0.48, 0.9, 0.25);

// Body
const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.23, 0.28, 0.75, 12),
    mat(0x171a20)
);

body.position.set(-0.48, 1.15, 0.05);
driver.add(body);

// Head
const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.19, 20, 20),
    mat(0xb98460)
);

head.position.set(-0.48, 1.68, -0.15);
driver.add(head);

// Hair
const hair = new THREE.Mesh(
    new THREE.SphereGeometry(0.2, 16, 12),
    mat(0x201713)
);

hair.scale.set(1, 0.65, 1);
hair.position.set(-0.48, 1.78, -0.14);
driver.add(hair);

// ==================================================
// ANIMATED STEERING WHEEL
// ==================================================

const wheelAssembly = new THREE.Group();

wheelAssembly.position.set(0.35, 1.22, -0.78);
driver.add(wheelAssembly);

const steeringWheel = new THREE.Mesh(
    new THREE.TorusGeometry(0.31, 0.045, 12, 32),
    M.dark
);

wheelAssembly.add(steeringWheel);

const wheelCenter = new THREE.Mesh(
    new THREE.CylinderGeometry(0.1, 0.1, 0.08, 16),
    M.metal
);

wheelCenter.rotation.x = Math.PI / 2;
wheelAssembly.add(wheelCenter);

// Steering spokes
for (let i = 0; i < 3; i++) {
    const spoke = box(
        wheelAssembly,
        0.045,
        0.27,
        0.04,
        M.metal,
        0,
        0,
        0
    );

    spoke.rotation.z = i * Math.PI * 2 / 3;
}

// Arms and hands are attached to the wheel assembly
// so they follow the wheel when it turns.

function makeArmBetween(parent, start, end) {
    const direction = new THREE.Vector3().subVectors(end, start);

    const arm = new THREE.Mesh(
        new THREE.CylinderGeometry(0.075, 0.09, direction.length(), 10),
        mat(0x252a32)
    );

    arm.position.copy(start).add(end).multiplyScalar(0.5);
    arm.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.clone().normalize()
    );

    parent.add(arm);
    return arm;
}

const leftShoulder = new THREE.Vector3(-0.53, 0.12, 0.35);
const rightShoulder = new THREE.Vector3(-0.36, 0.12, 0.35);

const leftHand = new THREE.Group();
const rightHand = new THREE.Group();

leftHand.position.set(-0.22, 0.08, 0);
rightHand.position.set(0.22, 0.08, 0);

wheelAssembly.add(leftHand);
wheelAssembly.add(rightHand);

const handMaterial = mat(0xb98460);

const handMesh1 = new THREE.Mesh(
    new THREE.SphereGeometry(0.08, 12, 12),
    handMaterial
);
handMesh1.position.set(0, 0, 0);
leftHand.add(handMesh1);

const handMesh2 = handMesh1.clone();
rightHand.add(handMesh2);

// Arm pivots attached to driver
const leftArm = makeArmBetween(
    driver,
    leftShoulder,
    new THREE.Vector3(0.12, 1.25, -0.78)
);

const rightArm = makeArmBetween(
    driver,
    rightShoulder,
    new THREE.Vector3(0.58, 1.25, -0.78)
);

// Dashboard
box(car, 1.8, 0.3, 0.7, mat(0x171717), 0, 1.1, -0.9);
box(car, 0.35, 0.22, 0.05, mat(0x123a4d), 0.3, 1.25, -1.1);

// ==================================================
// CAMERA MODES
// ==================================================

let cameraMode = 0;

const cameraNames = [
    "THIRD PERSON",
    "INTERIOR - YOU",
    "HOOD CAMERA"
];

function changeCamera() {
    cameraMode = (cameraMode + 1) % 3;

    document.getElementById("cameraLabel").textContent =
        cameraNames[cameraMode];
}

document.getElementById("cameraButton").onclick = changeCamera;

// ==================================================
// DRIVING
// ==================================================

const keys = {};

window.addEventListener("keydown", function(event) {
    const k = event.key.toLowerCase();
    keys[k] = true;

    if (k === "c" && !event.repeat) {
        changeCamera();
    }

    if (k === " " || k.startsWith("arrow")) {
        event.preventDefault();
    }
});

window.addEventListener("keyup", function(event) {
    keys[event.key.toLowerCase()] = false;
});

window.addEventListener("blur", function() {
    for (const key in keys) keys[key] = false;
});

let carX = 0;
let carZ = 0;
let yaw = 0;

let velocityX = 0;
let velocityZ = 0;

let speed = 0;
let steering = 0;
let steeringTarget = 0;
let rpm = 900;
let gear = 1;

let suspension = 0;
let bodyRoll = 0;

function approach(current, target, amount) {
    return current + (target - current) * Math.min(amount, 1);
}

function updatePhysics(delta) {
    const gas = keys["w"] || keys["arrowup"];
    const brake = keys["s"] || keys["arrowdown"];
    const left = keys["a"] || keys["arrowleft"];
    const right = keys["d"] || keys["arrowright"];
    const handbrake = keys[" "];

    const forwardX = -Math.sin(yaw);
    const forwardZ = -Math.cos(yaw);

    const sideX = Math.cos(yaw);
    const sideZ = -Math.sin(yaw);

    let forwardSpeed =
        velocityX * forwardX + velocityZ * forwardZ;

    let sideSpeed =
        velocityX * sideX + velocityZ * sideZ;

    if (gas) forwardSpeed += 14 * delta;
    else forwardSpeed -= 1.4 * delta;

    if (brake) forwardSpeed -= 28 * delta;

    if (handbrake) {
        forwardSpeed *= Math.max(0, 1 - 0.7 * delta);
    }

    forwardSpeed = Math.max(-8, Math.min(forwardSpeed, 75));

    steeringTarget = 0;
    if (left) steeringTarget = 1;
    if (right) steeringTarget = -1;

    steering = approach(
        steering,
        steeringTarget,
        delta * 2.8
    );

    const speedFactor = Math.min(
        Math.abs(forwardSpeed) / 12,
        1.5
    );

    yaw += steering * 0.75 * speedFactor *
        delta * (forwardSpeed >= 0 ? 1 : -1);

    const grip = handbrake ? 0.7 : 5.5;

    sideSpeed = approach(sideSpeed, 0, delta * grip);

    velocityX =
        forwardX * forwardSpeed +
        sideX * sideSpeed;

    velocityZ =
        forwardZ * forwardSpeed +
        sideZ * sideSpeed;

    carX += velocityX * delta;
    carZ += velocityZ * delta;

    speed = Math.sqrt(
        velocityX * velocityX +
        velocityZ * velocityZ
    ) * 3.6;

    suspension = approach(
        suspension,
        Math.sin(carZ * 0.35) * 0.025,
        delta * 4
    );

    bodyRoll = approach(
        bodyRoll,
        -steering * Math.min(speed / 120, 1) * 0.07,
        delta * 3
    );

    car.position.set(carX, suspension, carZ);
    car.rotation.y = yaw;
    car.rotation.z = bodyRoll;

    for (const wheel of frontWheels) {
        wheel.rotation.y = steering * 0.35;
    }

    for (const wheel of wheels) {
        wheel.rotation.x -= forwardSpeed * delta * 1.8;
    }

    // Wheel and hands turn together
    wheelAssembly.rotation.z = -steering * 0.8;

    // The driver's arms follow the steering wheel
    // with a small natural movement.
    leftArm.rotation.z = steering * 0.18;
    rightArm.rotation.z = steering * 0.18;

    // Gearbox
    if (speed < 35) gear = 1;
    else if (speed < 75) gear = 2;
    else if (speed < 120) gear = 3;
    else if (speed < 170) gear = 4;
    else if (speed < 230) gear = 5;
    else gear = 6;

    rpm = Math.min(850 + (speed % 40) * 95, 7500);

    document.getElementById("speed").textContent =
        Math.round(speed) + " KM/H";

    document.getElementById("gear").textContent =
        "GEAR: " + gear;

    document.getElementById("rpm").textContent =
        "RPM: " + Math.round(rpm);

    document.getElementById("status").textContent =
        handbrake ? "HANDBRAKE" :
        brake ? "BRAKING" :
        gas ? "ACCELERATING" :
        "FREE ROAM";
}

// ==================================================
// CAMERA POSITION
// ==================================================

function worldPoint(x, y, z) {
    const c = Math.cos(yaw);
    const s = Math.sin(yaw);

    return new THREE.Vector3(
        carX + x * c + z * s,
        y,
        carZ - x * s + z * c
    );
}

function updateCamera(delta) {
    if (cameraMode === 0) {
        const target = worldPoint(0, 4.2, 9);
        camera.position.lerp(target, Math.min(delta * 5, 1));

        camera.lookAt(worldPoint(0, 1.2, -4));

    } else if (cameraMode === 1) {
        camera.position.copy(worldPoint(-0.05, 1.55, -0.2));
        camera.lookAt(worldPoint(0, 1.45, -9));

    } else {
        camera.position.copy(worldPoint(0, 1.65, -1.65));
        camera.lookAt(worldPoint(0, 1.4, -12));
    }
}

// ==================================================
// MAIN LOOP
// ==================================================

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.04);

    updatePhysics(delta);
    updateWorld();
    updateCamera(delta);

    renderer.render(scene, camera);
}

// ==================================================
// RESIZE
// ==================================================

window.addEventListener("resize", function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

// ==================================================
// START
// ==================================================

updateWorld();

camera.position.set(0, 5, 10);

loading.style.display = "none";

animate();

})();
</script>
