<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA 5 Inspired Driving Game</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#83b9df;font-family:Arial,sans-serif}
canvas{display:block}
#hud{
 position:fixed;right:22px;bottom:20px;color:white;
 background:rgba(0,0,0,.65);padding:15px 20px;
 border-radius:12px;min-width:150px;text-align:right;
 text-shadow:1px 2px 3px black
}
#speed{font-size:35px;font-weight:bold}
#unit{font-size:12px;color:#ccc}
#gear{font-size:18px}
#help{
 position:fixed;left:18px;bottom:18px;color:white;
 background:rgba(0,0,0,.55);padding:12px;
 border-radius:8px;font-size:13px;line-height:1.6
}
#camera{
 position:fixed;top:18px;right:20px;color:white;
 background:rgba(0,0,0,.55);padding:10px 15px;border-radius:8px
}
#title{
 position:fixed;top:16px;left:50%;transform:translateX(-50%);
 color:white;font-weight:bold;letter-spacing:3px;
 text-shadow:2px 2px 5px black;font-size:18px
}
#error{
 display:none;position:fixed;inset:20px;background:#171717;
 color:white;padding:20px;z-index:10;white-space:pre-wrap
}
</style>
</head>
<body>
<div id="title">LOS SANTOS</div>
<div id="camera">CAMERA: THIRD PERSON</div>
<div id="hud">
 <div id="speed">0</div>
 <div id="unit">KM/H</div>
 <div id="gear">GEAR: N</div>
 <div id="rpm">RPM: 800</div>
</div>
<div id="help">
 <b>CONTROLS</b><br>
 W / ↑ Accelerate<br>
 S / ↓ Brake / Reverse<br>
 A / ← Turn left<br>
 D / → Turn right<br>
 SPACE Handbrake<br>
 C Change camera
</div>
<div id="error"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

const errorBox=document.getElementById('error');
function showError(message){
 errorBox.style.display='block';
 errorBox.textContent='GAME ERROR\n\n'+message+
 '\n\nCheck your internet connection and make sure Three.js loaded.';
}

if(!window.THREE){showError('Three.js could not load.');return;}

try {
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x83b9df);
scene.fog=new THREE.Fog(0x83b9df,180,850);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,2000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526044,1.5));
const sun=new THREE.DirectionalLight(0xfff0d5,2);
sun.position.set(-100,180,80);
sun.castShadow=true;
scene.add(sun);

const mat=(color,roughness=.8,metalness=0)=>
 new THREE.MeshStandardMaterial({color,roughness,metalness});

const grass=mat(0x658b45);
const roadMat=mat(0x292b2e);
const sidewalkMat=mat(0x99958a);
const white=mat(0xffffff);
const yellow=mat(0xf2c74d);
const buildingMats=[
 mat(0xc8a58b),mat(0xd2c4a4),mat(0x9eaaa8),
 mat(0xb6a08a),mat(0xd1b58e),mat(0x92999b),
 mat(0xc5c0ae)
];

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(1200,1600),grass
);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.15,-400);
ground.receiveShadow=true;
scene.add(ground);

// Roads
function makeBox(parent,w,h,d,material,x,y,z){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

const road=makeBox(scene,30,.12,1600,roadMat,0,0,-400);
road.receiveShadow=true;
makeBox(scene,2,.02,1600,yellow,0,.08,-400);

for(let z=350;z>-1200;z-=18){
 makeBox(scene,.18,.025,8,white,5,.09,z);
 makeBox(scene,.18,.025,8,white,-5,.09,z);
}

makeBox(scene,5,.2,1600,sidewalkMat,17,.02,-400);
makeBox(scene,5,.2,1600,sidewalkMat,-17,.02,-400);

// Buildings
function building(x,z,w,h,d,index){
 const group=new THREE.Group();
 group.position.set(x,0,z);
 scene.add(group);
 const material=buildingMats[index%buildingMats.length];
 makeBox(group,w,h,d,material,0,h/2,0);
 makeBox(group,w+.5,.4,d+.5,mat(0x55575a),0,h,0);

 const windowMat=mat(0x344b5d,.3,.3);
 const floors=Math.floor(h/4);
 for(let floor=1;floor<floors;floor++){
  for(let side=-1;side<=1;side++){
   if(Math.abs(side)===1){
    for(let xx=-w/2+2;xx<w/2-1;xx+=4){
     makeBox(group,1.5,1.4,.08,windowMat,xx,floor*4,side*(d/2+.05));
    }
   }
  }
 }
}

for(let z=320;z>-1300;z-=65){
 for(const side of [-1,1]){
  const x=side*(42+Math.random()*48);
  building(x,z,18+Math.random()*16,15+Math.random()*65,
   18+Math.random()*15,Math.floor(Math.random()*buildingMats.length));
 }
}

// Palm trees
const trunkMat=mat(0x775333);
const leafMat=mat(0x26733c);
function palm(x,z){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 scene.add(g);
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.3,.55,9,8),trunkMat);
 trunk.position.y=4.5;
 g.add(trunk);
 for(let i=0;i<8;i++){
  const angle=i*Math.PI/4;
  const leaf=new THREE.Mesh(
   new THREE.ConeGeometry(.65,7,5),leafMat);
  leaf.position.set(Math.sin(angle)*2.3,8,Math.cos(angle)*2.3);
  leaf.rotation.z=Math.cos(angle)*.9;
  leaf.rotation.x=Math.sin(angle)*.9;
  g.add(leaf);
 }
}
for(let z=300;z>-1200;z-=38){
 palm(23,z);
 palm(-23,z-15);
}

// GTA 5 style sign on a hillside
const hillMat=mat(0x526f38);
const hill=new THREE.Mesh(
 new THREE.ConeGeometry(75,45,7),hillMat
);
hill.position.set(95,20,-260);
hill.scale.set(1.6,1,.8);
hill.rotation.y=.3;
scene.add(hill);

// Sign frame
const signGroup=new THREE.Group();
signGroup.position.set(95,39,-260);
signGroup.rotation.y=0;
scene.add(signGroup);

const signBoardMat=mat(0xeeeeea,.6);
makeBox(signGroup,55,12,1,signBoardMat,0,0,0);
const signCanvas=document.createElement('canvas');
signCanvas.width=1800;
signCanvas.height=400;
const ctx=signCanvas.getContext('2d');
ctx.fillStyle='#f4f1e8';
ctx.fillRect(0,0,1800,400);
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.font='bold 245px Arial';
ctx.fillStyle='#222222';
ctx.fillText('GTA 5',900,195);
const signTexture=new THREE.CanvasTexture(signCanvas);
const signFace=new THREE.Mesh(
 new THREE.PlaneGeometry(54,11),
 new THREE.MeshBasicMaterial({map:signTexture,side:THREE.DoubleSide})
);
signFace.position.z=.56;
signGroup.add(signFace);

for(const x of [-22,22]){
 makeBox(signGroup,.8,8,.8,mat(0x555555),x,-9,0);
}

// Car group
const car=new THREE.Group();
scene.add(car);

const paint=mat(0x142b43,.25,.8);
const glass=mat(0x172b3b,.18,.4);
const black=mat(0x101114,.65,.1);
const leather=mat(0x17191b);
const metal=mat(0xaaaaaa,.25,.8);
const red=mat(0xd40000,.3,.2);
const headlightMat=new THREE.MeshStandardMaterial({
 color:0xffffff,emissive:0xffffff,emissiveIntensity:1.3
});

makeBox(car,4.5,1.1,8,paint,0,1.1,0);
makeBox(car,4.25,.45,2,paint,0,1.75,-2.7);
makeBox(car,4.2,.4,1.8,paint,0,1.7,3.1);

// Cabin
makeBox(car,3.5,1.25,3.5,paint,0,2.15,-.15);
makeBox(car,3.25,1.05,3.2,glass,0,2.3,-.15);
makeBox(car,3.7,.16,3.6,black,0,2.83,-.15);

// Hood and rear spoiler
makeBox(car,4.2,.12,2.5,paint,0,1.75,-2.6);
makeBox(car,3.7,.15,1.1,paint,0,2.05,3.8);
for(const x of [-1.3,1.3]){
 makeBox(car,.12,.8,.12,black,x,2.3,3.6);
}
makeBox(car,4.2,.15,.7,paint,0,2.7,3.6);

// Headlights and rear lights
for(const x of [-1.5,1.5]){
 makeBox(car,.85,.18,.12,headlightMat,x,1.65,-4.02);
 makeBox(car,.9,.25,.12,red,x,1.55,4.02);
}

// Wheels
const wheels=[];
const wheelPivots=[];
for(const x of [-2.15,2.15]){
 for(const z of [-2.6,2.7]){
  const pivot=new THREE.Group();
  pivot.position.set(x,.75,z);
  car.add(pivot);
  wheelPivots.push(pivot);

  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(.73,.73,.42,24),
   black
  );
  wheel.rotation.z=Math.PI/2;
  pivot.add(wheel);
  wheels.push(wheel);

  const rim=new THREE.Mesh(
   new THREE.CylinderGeometry(.43,.43,.44,20),
   metal
  );
  rim.rotation.z=Math.PI/2;
  pivot.add(rim);
 }
}

// Cockpit interior
makeBox(car,3.5,.16,3.3,leather,0,1.75,-.1);
makeBox(car,3.2,.3,.3,black,0,2.35,-1.75);
makeBox(car,3.2,.25,.3,black,0,2.35,1.55);

// Dashboard
makeBox(car,3.25,.45,.65,black,0,2.12,-1.5);
makeBox(car,1.1,.35,.12,mat(0x162c39),0,2.35,-1.55);
makeBox(car,.9,.2,.12,mat(0x080808),0,2.1,-1.9);

// Seats
for(const x of [-.9,.9]){
 makeBox(car,.9,1.2,.9,leather,x,1.7,.4);
 makeBox(car,.9,.8,.3,leather,x,2.3,.8);
}

// Steering wheel
const steering=new THREE.Group();
steering.position.set(-.9,2.3,-1.1);
car.add(steering);
const steeringWheel=new THREE.Mesh(
 new THREE.TorusGeometry(.42,.065,10,32),black
);
steeringWheel.rotation.y=Math.PI/2;
steering.add(steeringWheel);
const steeringHub=new THREE.Mesh(
 new THREE.CylinderGeometry(.13,.13,.15,16),metal
);
steeringHub.rotation.z=Math.PI/2;
steering.add(steeringHub);

// Driver
const driverMat=mat(0x222b3b);
const skin=mat(0xc18b65);
const head=new THREE.Mesh(
 new THREE.SphereGeometry(.27,16,16),skin
);
head.position.set(-.9,2.65,.15);
car.add(head);
makeBox(car,.55,.65,.4,driverMat,-.9,2.05,.2);

// Arms
function arm(x,y,z,rotation){
 const a=new THREE.Mesh(
  new THREE.CylinderGeometry(.1,.12,.85,10),driverMat
 );
 a.position.set(x,y,z);
 a.rotation.z=rotation;
 car.add(a);
}
arm(-.6,2.2,-.55,-.6);
arm(-1.1,2.15,-.55,.6);

// Traffic cars
const traffic=[];
function makeTraffic(z){
 const t=new THREE.Group();
 scene.add(t);
 const colors=[0xffffff,0x111111,0x174e8a,0x9b2222,0x888888];
 const body=mat(colors[Math.floor(Math.random()*colors.length)]);
 makeBox(t,3.5,1.1,6,body,0,1,0);
 makeBox(t,2.8,.9,2.8,glass,0,1.9,-.1);
 for(const x of [-1.7,1.7]){
  for(const zz of [-2,2]){
   const w=new THREE.Mesh(
    new THREE.CylinderGeometry(.48,.48,.3,16),black);
   w.rotation.z=Math.PI/2;
   w.position.set(x,.55,zz);
   t.add(w);
  }
 }
 t.position.set((Math.random()-.5)*12,.1,z);
 traffic.push(t);
}
for(let i=0;i<12;i++)makeTraffic(-50-i*65);

// Driving
const keys={};
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
 if(e.key.toLowerCase()==='c'&&!e.repeat)cameraMode=(cameraMode+1)%3;
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

let velocity=0;
let steer=0;
let yaw=0;
let cameraMode=0;
let lastTime=performance.now();

const speedDisplay=document.getElementById('speed');
const gearDisplay=document.getElementById('gear');
const rpmDisplay=document.getElementById('rpm');
const cameraDisplay=document.getElementById('camera');

function updatePhysics(dt){
 const forward=keys.w||keys.arrowup;
 const backward=keys.s||keys.arrowdown;
 const left=keys.a||keys.arrowleft;
 const right=keys.d||keys.arrowright;
 const handbrake=keys[' '];

 if(forward)velocity+=24*dt;
 if(backward)velocity-=35*dt;

 if(!forward&&!backward){
  velocity*=Math.pow(.985,dt*60);
 }
 if(handbrake)velocity*=Math.pow(.94,dt*60);

 const steerInput=(left?1:0)-(right?1:0);
 steer+=(steerInput-steer)*Math.min(1,dt*5);

 const speedFactor=Math.min(Math.abs(velocity)/12,1);
 const direction=velocity>=0?1:-1;
 yaw+=steer*1.15*speedFactor*direction*dt;

 car.position.x-=Math.sin(yaw)*velocity*dt;
 car.position.z-=Math.cos(yaw)*velocity*dt;

 car.rotation.y=yaw;
 car.rotation.z=-steer*.035*speedFactor;

 wheelPivots[0].rotation.y=-steer*.42;
 wheelPivots[1].rotation.y=-steer*.42;
 for(const wheel of wheels)wheel.rotation.x-=velocity*dt*1.8;

 steering.rotation.z=-steer*.75;
}

function updateTraffic(dt){
 for(const t of traffic){
  t.position.z+=dt*12;
  if(t.position.z>car.position.z+60){
   t.position.z=car.position.z-750-Math.random()*200;
   t.position.x=(Math.random()-.5)*12;
  }
 }
}

// Keep generating an endless-feeling road and city
function updateWorld(){
 ground.position.z=car.position.z-400;
 road.position.z=car.position.z-400;
 for(const child of scene.children){
  if(child.userData.movingWorld){
   child.position.z=car.position.z-400;
  }
 }
}

// Camera
const cameraTarget=new THREE.Vector3();
function updateCamera(dt){
 let desiredPosition,lookAt;

 if(cameraMode===0){
  desiredPosition=new THREE.Vector3(0,5,10);
  lookAt=new THREE.Vector3(0,1, -5);
  cameraDisplay.textContent='CAMERA: THIRD PERSON';
 }else if(cameraMode===1){
  desiredPosition=new THREE.Vector3(-.6,2.65,-.15);
  lookAt=new THREE.Vector3(-.6,2.5,-8);
  cameraDisplay.textContent='CAMERA: INTERIOR';
 }else{
  desiredPosition=new THREE.Vector3(0,2.2,-2.9);
  lookAt=new THREE.Vector3(0,1,-15);
  cameraDisplay.textContent='CAMERA: HOOD';
 }

 const c=Math.cos(yaw),s=Math.sin(yaw);
 const worldPos=new THREE.Vector3(
  car.position.x+desiredPosition.x*c+desiredPosition.z*s,
  desiredPosition.y,
  car.position.z-desiredPosition.x*s+desiredPosition.z*c
 );
 cameraTarget.lerp(worldPos,Math.min(1,dt*5));
 camera.position.copy(cameraTarget);

 const targetWorld=new THREE.Vector3(
  car.position.x+lookAt.x*c+lookAt.z*s,
  lookAt.y,
  car.position.z-lookAt.x*s+lookAt.z*c
 );
 camera.lookAt(targetWorld);
}

function updateHUD(){
 const speed=Math.round(Math.abs(velocity)*3.6);
 speedDisplay.textContent=speed;
 gearDisplay.textContent='GEAR: '+(
  velocity>1?'D':velocity< -1?'R':'N'
 );
 rpmDisplay.textContent='RPM: '+Math.round(
  800+Math.min(Math.abs(velocity),100)*65
 );
}

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-lastTime)/1000,.04);
 lastTime=now;

 updatePhysics(dt);
 updateTraffic(dt);
 updateWorld();
 updateCamera(dt);
 updateHUD();

 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

} catch(e){
 showError(e.stack||e.message||String(e));
}
})();
</script>
</body>
</html>
