
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GT-R Street Racing</title>
<style>
*{box-sizing:border-box;margin:0}
body{overflow:hidden;background:#8ac8ed;font-family:Arial}
canvas{display:block}
#hud{position:fixed;inset:0;color:white;pointer-events:none}
.panel{position:absolute;background:#080d18dd;padding:13px 17px;border-radius:10px}
#controls{top:12px;left:12px;line-height:1.8;font-size:13px}
#logo{top:12px;right:12px;color:#ff3045;font-weight:bold}
#speed{right:18px;bottom:18px;font-size:29px;border:2px solid #e51d35}
#stats{right:18px;bottom:100px;line-height:1.8}
#cameraLabel{left:15px;bottom:15px}
#message{position:absolute;top:90px;left:50%;transform:translateX(-50%);color:white}
</style>
</head>
<body>

<div id="hud">
<div id="controls" class="panel">
<b>DRIVING CONTROLS</b><br>
W / ↑ GAS<br>
S / ↓ BRAKE<br>
A / ← LEFT<br>
D / → RIGHT<br>
SPACE HANDBRAKE<br>
C CHANGE CAMERA
</div>
<div id="logo" class="panel">GT-R STREET RACING</div>
<div id="stats" class="panel">RPM: 800<br>GEAR: 1</div>
<div id="speed" class="panel">0 KM/H</div>
<div id="cameraLabel" class="panel">FIRST PERSON</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

// ======================================
// 1. GAME SETUP
// ======================================

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8cc8eb);
scene.fog=new THREE.Fog(0x8cc8eb,180,1500);

const camera=new THREE.PerspectiveCamera(
75,innerWidth/innerHeight,.1,4000
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// ======================================
// 2. LIGHTING
// ======================================

scene.add(new THREE.HemisphereLight(0xddeeff,0x485b37,2));

const sun=new THREE.DirectionalLight(0xffe8c4,2.4);
sun.position.set(-100,160,100);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-100;
sun.shadow.camera.right=100;
sun.shadow.camera.top=100;
sun.shadow.camera.bottom=-100;
scene.add(sun);

// ======================================
// 3. MATERIALS
// ======================================

function mat(color,rough=.5,metal=0){
return new THREE.MeshStandardMaterial({
color,roughness:rough,metalness:metal
});
}

const red=mat(0xb90024,.22,.8);
const black=mat(0x101318,.3,.5);
const rubber=mat(0x101010,.9);
const silver=mat(0xb9c1ca,.2,.9);
const white=mat(0xffffff,.2);
const leather=mat(0x201c1b,.8);
const skin=mat(0xc78b68);
const asphalt=mat(0x292d32,.95);
const grass=mat(0x557b40);
const glass=new THREE.MeshPhysicalMaterial({
color:0x253e50,
roughness:.12,
metalness:.4,
transparent:true,
opacity:.58
});

// ======================================
// 4. HELPER FUNCTIONS
// ======================================

function box(parent,w,h,d,material,x,y,z){
const m=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),material
);
m.position.set(x,y,z);
m.castShadow=true;
m.receiveShadow=true;
parent.add(m);
return m;
}

function cylinder(parent,r1,r2,h,material,x,y,z){
const m=new THREE.Mesh(
new THREE.CylinderGeometry(r1,r2,h,24),
material
);
m.position.set(x,y,z);
m.castShadow=true;
parent.add(m);
return m;
}

// ======================================
// 5. WORLD
// ======================================

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(5000,15000),
grass
);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.2,-7000);
scene.add(ground);

// Main highway
box(scene,36,.12,15000,asphalt,0,-.08,-7000);

// Road shoulders
for(const x of [-19,19]){
box(scene,2,.15,15000,mat(0xb1b1a9),x,-.02,-7000);
}

// Road lane markings
const lines=[];

for(let i=0;i<375;i++){
const line=box(
scene,.18,.035,12,white,0,.015,-i*40
);
lines.push(line);
}

// Side lane markings
for(const x of [-6,6]){
for(let i=0;i<180;i++){
box(scene,.12,.025,6,white,x,.02,-i*80);
}
}

// ======================================
// 6. CITY BUILDINGS
// ======================================

const buildings=[];

function building(x,z){

const group=new THREE.Group();

const w=12+Math.random()*16;
const h=15+Math.random()*65;
const d=12+Math.random()*18;

const colors=[
0x9caaa9,0x8c969d,0xaaa398,
0x737e89,0xb8b3a6
];

box(group,w,h,d,
mat(colors[Math.floor(Math.random()*colors.length)]),
0,h/2,0);

// Windows
const windowMaterial=mat(0x263f54,.15,.4);

for(let y=4;y<h-2;y+=5){
for(let xx=-w/2+2;xx<w/2-1;xx+=4){

box(group,2,2,.08,windowMaterial,xx,y,d/2+.05);
box(group,2,2,.08,windowMaterial,xx,y,-d/2-.05);

}
}

group.position.set(x,0,z);
scene.add(group);
buildings.push(group);
}

for(let i=0;i<90;i++){
building(-65-Math.random()*130,-100-i*160);
building(65+Math.random()*130,-100-i*160);
}

// ======================================
// 7. TREES
// ======================================

const trees=[];

function tree(x,z){

const group=new THREE.Group();

cylinder(group,.25,.35,3.5,mat(0x65422b),0,1.75,0);

const leaves=new THREE.Mesh(
new THREE.ConeGeometry(2.4,6,9),
mat(0x1b622c)
);
leaves.position.y=5;
leaves.castShadow=true;
group.add(leaves);

group.position.set(x,0,z);
scene.add(group);
trees.push(group);
}

for(let i=0;i<180;i++){
let z=-Math.random()*14000;
tree(-24-Math.random()*100,z);
tree(24+Math.random()*100,z);
}

// ======================================
// 8. STREET LIGHTS
// ======================================

for(let i=0;i<70;i++){
for(const side of [-1,1]){
const x=side*21;
const z=-i*190;

cylinder(scene,.12,.16,8,black,x,4,z);
box(scene,3,.12,.15,black,x-side*1.3,8,z);
box(scene,.5,.15,.5,white,x-side*2.6,7.9,z);
}
}

// ======================================
// 9. GT-R CAR BODY
// ======================================

const car=new THREE.Group();
scene.add(car);

// Main body
box(car,2.1,.72,4.7,red,0,.75,0);
box(car,2.18,.3,4.3,black,0,.42,0);

// Hood
box(car,2,.13,1.5,red,0,1.1,-1.4);

// Roof
box(car,1.72,.15,1.8,red,0,1.93,.1);

// Windows
const frontGlass=new THREE.Mesh(
new THREE.BoxGeometry(1.8,.85,.07),glass
);
frontGlass.position.set(0,1.5,-.83);
frontGlass.rotation.x=-.3;
car.add(frontGlass);

const rearGlass=new THREE.Mesh(
new THREE.BoxGeometry(1.7,.7,.07),glass
);
rearGlass.position.set(0,1.5,1.08);
rearGlass.rotation.x=.35;
car.add(rearGlass);

for(const side of [-1,1]){
box(car,.06,.7,1.7,glass,side*.88,1.5,.1);
box(car,.3,.16,.35,black,side*1.15,1.25,-.8);
}

// Bumpers
box(car,2.15,.35,.4,black,0,.45,-2.4);
box(car,2.15,.35,.4,black,0,.45,2.4);

// Grille
box(car,.95,.3,.05,black,0,.72,-2.6);

// Headlights
for(const side of [-1,1]){
const light=box(car,.48,.2,.08,white,side*.75,1,-2.43);
light.material.emissive=new THREE.Color(0x8299bb);
light.material.emissiveIntensity=.4;
}

// Rear lights
for(const side of [-1,1]){
const light=new THREE.Mesh(
new THREE.TorusGeometry(.17,.045,12,28),
mat(0xff1028)
);
light.position.set(side*.7,.85,2.43);
car.add(light);
}

// Spoiler
for(const side of [-1,1]){
box(car,.1,.42,.12,black,side*.7,1.35,1.8);
}
box(car,2.1,.13,.45,black,0,1.58,1.85);

// Exhausts
for(const side of [-1,1]){
const exhaust=cylinder(car,.14,.14,.3,silver,side*.72,.43,2.55);
exhaust.rotation.x=Math.PI/2;
}

// ======================================
// 10. WHEELS AND RIMS
// ======================================

const wheels=[];
const frontWheels=[];

function makeWheel(x,z,isFront){

const group=new THREE.Group();

const tire=new THREE.Mesh(
new THREE.CylinderGeometry(.43,.43,.27,36),
rubber
);
tire.rotation.z=Math.PI/2;
group.add(tire);

const rim=new THREE.Mesh(
new THREE.CylinderGeometry(.3,.3,.29,32),
silver
);
rim.rotation.z=Math.PI/2;
group.add(rim);

const center=new THREE.Mesh(
new THREE.CylinderGeometry(.09,.09,.31,24),
red
);
center.rotation.z=Math.PI/2;
group.add(center);

// Five spokes
for(let i=0;i<5;i++){
const spoke=box(group,.055,.4,.07,silver,0,0,0);
spoke.rotation.z=i*Math.PI*2/5;
}

group.position.set(x,.5,z);
car.add(group);
wheels.push(group);

if(isFront)frontWheels.push(group);
}

makeWheel(-1.08,-1.5,true);
makeWheel(1.08,-1.5,true);
makeWheel(-1.08,1.5,false);
makeWheel(1.08,1.5,false);

// ======================================
// 11. DRIVER
// ======================================

const driver=new THREE.Group();

box(driver,.6,.8,.35,leather,-.38,1.25,.2);

const head=new THREE.Mesh(
new THREE.SphereGeometry(.22,24,24),
skin
);
head.position.set(-.38,1.85,.1);
driver.add(head);

const hair=new THREE.Mesh(
new THREE.SphereGeometry(.225,20,16),
black
);
hair.scale.y=.55;
hair.position.set(-.38,1.96,.1);
driver.add(hair);

car.add(driver);

// ======================================
// 12. FIRST PERSON COCKPIT
// ======================================

const cockpit=new THREE.Group();
camera.add(cockpit);

// Dashboard
box(cockpit,3.8,.45,.8,leather,0,-.95,-1.15);
box(cockpit,3.5,.035,.04,red,0,-.72,-1.55);

// Screen
box(cockpit,1,.4,.07,mat(0x061c2a),.55,-.53,-1.6);

// Steering wheel
const steering=new THREE.Group();

const ring=new THREE.Mesh(
new THREE.TorusGeometry(.39,.055,16,48),
black
);
steering.add(ring);

const hub=new THREE.Mesh(
new THREE.CylinderGeometry(.14,.14,.1,24),
red
);
hub.rotation.x=Math.PI/2;
steering.add(hub);

// Spokes
for(let i=0;i<3;i++){
const spoke=box(steering,.065,.35,.07,silver,0,0,0);
spoke.rotation.z=i*Math.PI*2/3;
}

steering.position.set(-.55,-.55,-1.25);
cockpit.add(steering);

// Driver arms
function arm(a,b){
const start=new THREE.Vector3(...a);
const end=new THREE.Vector3(...b);
const dir=new THREE.Vector3().subVectors(end,start);

const m=new THREE.Mesh(
new THREE.CylinderGeometry(.1,.14,dir.length(),16),
leather
);
m.position.copy(start).add(end).multiplyScalar(.5);
m.quaternion.setFromUnitVectors(
new THREE.Vector3(0,1,0),dir.normalize()
);
cockpit.add(m);
}

arm([-1.2,-1.25,-.65],[-.85,-.8,-1.12]);
arm([1.1,-1.25,-.65],[-.25,-.8,-1.12]);

// Hands
for(const x of [-.31,.31]){
const hand=new THREE.Mesh(
new THREE.SphereGeometry(.11,16,16),
skin
);
hand.position.set(x,.15,.04);
steering.add(hand);
}

// Cockpit roof
box(cockpit,3.8,.12,.35,black,0,1.72,-1.55);

for(const x of [-1.85,1.85]){
box(cockpit,.12,2.7,.14,black,x,.35,-1.6);
}

// ======================================
// 13. TRAFFIC CARS
// ======================================

const traffic=[];

function createTraffic(x,z,color){

const group=new THREE.Group();

const paint=mat(color,.3,.5);

box(group,1.8,.65,3.8,paint,0,.7,0);
box(group,1.5,.55,1.7,glass,0,1.25,0);

for(const side of [-1,1]){
for(const end of [-1,1]){
const wheel=new THREE.Mesh(
new THREE.CylinderGeometry(.3,.3,.18,20),
rubber
);
wheel.rotation.z=Math.PI/2;
wheel.position.set(side*.92,.35,end*1.2);
group.add(wheel);
}
}

group.position.set(x,.05,z);
scene.add(group);
traffic.push(group);
}

for(let i=0;i<12;i++){
createTraffic(
Math.random()<.5?-10:10,
-250-i*400,
[0xeeeeee,0x222222,0x164e9a,0xc5a11a][i%4]
);
}

// ======================================
// 14. CONTROLS
// ======================================

const keys={};

window.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
if(e.key.startsWith("Arrow"))e.preventDefault();

if(e.key.toLowerCase()==="c"&&!e.repeat){
firstPerson=!firstPerson;
cockpit.visible=firstPerson;
document.getElementById("cameraLabel").textContent=
firstPerson?"FIRST PERSON":"THIRD PERSON";
}
});

window.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

// ======================================
// 15. DRIVING PHYSICS
// ======================================

let speed=0;
let steeringValue=0;
let carX=0;
let carZ=0;
let yaw=0;
let gear=1;
let drift=0;

const clock=new THREE.Clock();

function driving(dt){

const gas=keys["w"]||keys["arrowup"];
const brake=keys["s"]||keys["arrowdown"];
const handbrake=keys[" "];

if(gas)speed+=48*dt;
else speed-=4*dt;

if(brake)speed-=120*dt;
if(handbrake)speed-=45*dt;

speed=THREE.MathUtils.clamp(speed,0,320);

let input=0;
if(keys["a"]||keys["arrowleft"])input=-1;
if(keys["d"]||keys["arrowright"])input=1;

steeringValue+=(input-steeringValue)*Math.min(dt*4,1);

const strength=.3+Math.min(speed/180,1)*.7;

if(handbrake&&speed>25)drift=1;
else drift=Math.max(0,drift-dt*2);

carX+=input*speed*.00085*strength*dt;
carX=THREE.MathUtils.clamp(carX,-15,15);

yaw=-steeringValue*.3;

car.position.set(carX,0,carZ);
car.rotation.y=yaw+steeringValue*drift*.12;

frontWheels.forEach(w=>{
w.rotation.y=-steeringValue*.45;
});

wheels.forEach(w=>{
w.rotation.x+=speed*dt*.025;
});

carZ-=speed*.009*dt;

gear=Math.min(6,Math.max(1,Math.floor(speed/55)+1));
}

// ======================================
// 16. WORLD MOVEMENT
// ======================================

function moveWorld(){

lines.forEach(o=>{
if(o.position.z>carZ+50)o.position.z-=15000;
});

trees.forEach(o=>{
if(o.position.z>carZ+100)o.position.z-=14000;
});

buildings.forEach(o=>{
if(o.position.z>carZ+150)o.position.z-=14000;
});

traffic.forEach(o=>{
if(o.position.z>carZ+100){
o.position.z-=4500;
o.position.x=Math.random()<.5?-10:10;
}
});
}

// ======================================
// 17. CAMERA
// ======================================

function updateCamera(dt){

if(firstPerson){

camera.position.set(carX,1.62,carZ-.15);
camera.rotation.order="YXZ";
camera.rotation.set(0,yaw,0);

}else{

const target=new THREE.Vector3(
carX+Math.sin(yaw)*9,
4.3,
carZ+10
);

camera.position.lerp(target,Math.min(dt*4,1));
camera.lookAt(carX,1.1,carZ-2);
}

steering.rotation.z=-steeringValue*.8;
}

// ======================================
// 18. HUD
// ======================================

function updateHUD(){

document.getElementById("speed").textContent=
Math.round(speed)+" KM/H";

document.getElementById("stats").innerHTML=
"RPM: "+Math.round(800+speed*25)+
"<br>GEAR: "+gear+
"<br>TURBO: "+(speed>80?"ACTIVE":"READY");
}

// ======================================
// 19. MAIN GAME LOOP
// ======================================

function animate(){

requestAnimationFrame(animate);

const dt=Math.min(clock.getDelta(),.05);

driving(dt);
moveWorld();
updateCamera(dt);
updateHUD();

renderer.render(scene,camera);
}

// ======================================
// 20. START GAME
// ======================================

camera.position.set(0,1.62,0);
cockpit.visible=true;

animate();

// ======================================
// 21. RESIZE
// ======================================

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
