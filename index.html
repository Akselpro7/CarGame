<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Life 5 - Open World</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;color:white;font-family:Arial}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#logo{position:absolute;top:18px;left:20px;font-size:26px;font-weight:900;letter-spacing:3px;text-shadow:2px 2px #000}
#cash{position:absolute;top:55px;left:20px;color:#4dff8a;font-weight:bold;font-size:20px;text-shadow:1px 1px #000}
#wanted{position:absolute;right:22px;top:18px;color:#ffe15c;font-size:25px;letter-spacing:4px;text-shadow:2px 2px #000}
#mission{position:absolute;right:22px;top:55px;text-align:right;text-shadow:2px 2px #000}
#speedBox{position:absolute;right:25px;bottom:24px;text-align:right;text-shadow:2px 2px #000}
#speed{font-size:48px;font-weight:900}
#gear{font-size:15px;color:#ddd}
#stats{position:absolute;left:20px;bottom:22px;width:165px;text-shadow:1px 1px #000;font-size:12px}
.bar{height:9px;background:#333;border-radius:10px;margin:5px 0 12px;overflow:hidden}
.fill{height:100%;width:100%;background:#42e978}
#nitroFill{background:#00cfff}
#map{position:absolute;right:20px;top:100px;width:145px;height:145px;border:2px solid white;border-radius:50%;overflow:hidden;background:#111b}
#minimap{width:100%;height:100%}
#help{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#ddd;text-align:center;text-shadow:1px 1px #000;width:95%}
#message{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:25px;font-weight:bold;text-shadow:2px 2px #000;text-align:center;display:none}
#panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:320px;max-width:90vw;background:#101722f5;border:2px solid #00cfff;border-radius:12px;padding:18px;display:none;z-index:10}
#panel h2{color:#00cfff;margin-top:0}
#panel button,#panel select{width:100%;padding:11px;margin:5px 0;border:0;border-radius:5px;font-weight:bold}
#panel button{background:#00cfff;color:#00121b;cursor:pointer}
#panel select{background:#253747;color:white}
#panel p{font-size:12px;color:#bbb}
#crosshair{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:18px}
</style>
</head>
<body>

<div id="hud">
 <div id="logo">CITY LIFE <span style="color:#00cfff">5</span></div>
 <div id="cash">$5,000</div>
 <div id="wanted">☆☆☆☆☆</div>
 <div id="mission">Explore the city</div>
 <div id="map"><canvas id="minimap" width="200" height="200"></canvas></div>
 <div id="stats">
  HEALTH
  <div class="bar"><div id="healthFill" class="fill"></div></div>
  NITRO
  <div class="bar"><div id="nitroFill" class="fill"></div></div>
 </div>
 <div id="speedBox">
  <div id="gear">DRIVE</div>
  <div><span id="speed">0</span> KM/H</div>
 </div>
 <div id="help">
  W / ↑ Drive · S / ↓ Reverse · A / D Steer · SPACE Handbrake · SHIFT Nitro<br>
  E Enter/Exit · C Camera · F1 Admin · ESC Pause · R Repair
 </div>
 <div id="message"></div>
 <div id="crosshair">+</div>
</div>

<div id="panel">
 <h2>ADMIN MENU</h2>
 <p>Local single-player admin controls</p>
 <select id="spawnColor">
  <option value="16777215">White</option>
  <option value="16711680">Red</option>
  <option value="255">Blue</option>
  <option value="65280">Green</option>
  <option value="0">Black</option>
  <option value="16753920">Orange</option>
 </select>
 <button onclick="spawnAdminCar()">SPAWN CAR</button>
 <button onclick="spawnFiveCars()">SPAWN 5 CARS</button>
 <button onclick="clearAdminCars()">REMOVE SPAWNED CARS</button>
 <button onclick="repairCar()">REPAIR CAR</button>
 <button onclick="addMoney()">ADD $10,000</button>
 <button onclick="startMission()">START MISSION</button>
 <button onclick="closePanel()">CLOSE MENU</button>
 <p>Press F1 to open or close.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
"use strict";

if(!window.THREE){
 document.getElementById("message").style.display="block";
 document.getElementById("message").textContent="3D engine failed to load. Check internet connection.";
 return;
}

// ================= SETUP =================
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x88bde7);
scene.fog=new THREE.Fog(0x88bde7,130,650);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1200);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));
renderer.shadowMap.enabled=false;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const clock=new THREE.Clock();
const keys={};

let velocity=0;
let yaw=0;
let steer=0;
let nitro=100;
let health=100;
let money=5000;
let wanted=0;
let cameraMode=0;
let driving=true;
let paused=false;
let crashed=false;
let missionActive=false;
let missionTarget=null;
let missionReward=1000;
let policeTimer=0;

const traffic=[];
const police=[];
const adminCars=[];
const sparks=[];

const mat=(color,metalness=0,roughness=.8)=>new THREE.MeshStandardMaterial({color,metalness,roughness});
const roadMat=mat(0x292d32);
const lineMat=mat(0xf4e7a9);
const grassMat=mat(0x43804b);
const blackMat=mat(0x080a0d);
const tireMat=mat(0x080808);
const glassMat=mat(0x102c40,.4,.18);
const whiteMat=mat(0xffffff);
const redMat=mat(0xe21d28);
const metalMat=mat(0x8b969e,.8,.25);

scene.add(new THREE.HemisphereLight(0xddeeff,0x47523d,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(100,150,80);
scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),grassMat);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.1;
scene.add(ground);

const boxGeo=new THREE.BoxGeometry(1,1,1);
function box(parent,x,y,z,sx,sy,sz,material){
 const m=new THREE.Mesh(boxGeo,material);
 m.position.set(x,y,z);
 m.scale.set(sx,sy,sz);
 parent.add(m);
 return m;
}
function rand(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}

function makeRoad(x,z,width,length,horizontal){
 box(scene,x,.01,z,horizontal?length:width,.08,horizontal?width:length,roadMat);
 for(let i=-Math.floor(length/16);i<=Math.floor(length/16);i++){
  if(horizontal)box(scene,x+i*16,.065,z,.3,.02,.3,lineMat);
  else box(scene,x,.065,z+i*16,.3,.02,.3,lineMat);
 }
}
for(let i=-5;i<=5;i++){
 makeRoad(i*100,0,15,1100,true);
 makeRoad(0,i*100,15,1100,false);
}

// ================= CITY =================
function makeBuilding(x,z){
 const h=rand(12,65),w=rand(16,35),d=rand(16,35);
 const colors=[0x777e87,0x9a8e80,0x555f6b,0xb4a995,0x686e73];
 box(scene,x,h/2,z,w,h,d,mat(colors[Math.floor(Math.random()*colors.length)]));
 const windows=mat(0x80cbe8,.3,.2);
 for(let y=4;y<h-2;y+=6){
  for(let side of [-1,1]){
   for(let xx=-w/2+3;xx<w/2-1;xx+=6){
    box(scene,x+xx,y,z+side*(d/2+.04),2,2,.08,windows);
   }
  }
 }
}
for(let x=-550;x<=550;x+=100){
 for(let z=-550;z<=550;z+=100){
  if(Math.abs(x%200)<1&&Math.abs(z%200)<1)continue;
  makeBuilding(x+rand(-15,15),z+rand(-15,15));
 }
}
function makePalm(x,z){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.3,.5,8,8),mat(0x76502c));
 trunk.position.set(x,4,z);
 scene.add(trunk);
 for(let i=0;i<7;i++){
  const leaf=box(scene,x+Math.cos(i)*2.5,8,z+Math.sin(i)*2.5,1,.25,5,mat(0x187536));
  leaf.rotation.y=i*Math.PI/3.5;
 }
}
for(let x=-500;x<=500;x+=50){
 for(let z=-500;z<=500;z+=50){
  if(Math.abs(x%100)<1||Math.abs(z%100)<1)continue;
  if(Math.random()<.25)makePalm(x,z);
 }
}

// ================= CAR MODEL =================
function createCar(group,color=0x168bd4){
 const paint=mat(color,.75,.23);
 const glass=mat(0x142c3c,.45,.18);

 box(group,0,.85,0,3.1,.85,6,paint);
 box(group,0,1.48,-.3,2.5,.9,2.8,glass);
 box(group,0,1.45,2.15,2.4,.55,1.3,paint);
 box(group,0,1.35,-2.8,2.8,.35,.5,paint);
 for(const x of [-1,1]){
  box(group,x*1.1,1,3.02,.55,.25,.06,whiteMat);
  box(group,x*1.1,.85,-3.02,.5,.22,.06,redMat);
 }
 box(group,0,1.9,-2.75,2.4,.12,.45,blackMat);

 for(const x of [-1.55,1.55]){
  for(const z of [-2,2]){
   const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.35,16),tireMat);
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.48,z);
   group.add(wheel);
   const hub=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.37,12),metalMat);
   hub.rotation.z=Math.PI/2;
   hub.position.set(x,.48,z);
   group.add(hub);
  }
 }

 // Interior
 box(group,0,1.35,-.3,2.1,.12,2.1,blackMat);
 box(group,0,1.35,1.2,2.3,.22,.45,blackMat);
 for(const x of [-.65,.65]){
  box(group,x,1.15,-.65,.65,.65,.6,blackMat);
 }
 // Steering wheel
 const steering=new THREE.Mesh(new THREE.TorusGeometry(.28,.045,8,20),blackMat);
 steering.position.set(-.65,1.65,1.05);
 group.add(steering);
 // Driver
 box(group,-.65,1.65,-.1,.42,.65,.38,mat(0x202a38));
 const head=new THREE.Mesh(new THREE.SphereGeometry(.2,12,10),mat(0xd3a17d));
 head.position.set(-.65,2.1,-.1);
 group.add(head);
}

const car=new THREE.Group();
createCar(car);
scene.add(car);
car.position.set(0,0,0);

// ================= PLAYER =================
const player=new THREE.Group();
box(player,0,1,0,.65,1,.4,mat(0x243c70));
const head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,12),mat(0xd5a17d));
head.position.y=1.7;
player.add(head);
scene.add(player);
player.position.set(4,0,0);

// ================= TRAFFIC =================
function makeTrafficCar(x,z){
 const g=new THREE.Group();
 createCar(g,[0xe6e6e6,0xc9212b,0x171717,0x2e9c65,0xd2a22e][Math.floor(Math.random()*5)]);
 g.position.set(x,0,z);
 scene.add(g);
 traffic.push({group:g,speed:rand(9,18),dir:Math.random()<.5?1:-1});
}
for(let i=0;i<18;i++){
 makeTrafficCar(rand(-450,450),Math.round(rand(-5,5))*100+rand(-4,4));
}

// ================= POLICE =================
function makePolice(){
 const g=new THREE.Group();
 createCar(g,0x101a2a);
 box(g,-.45,2,0,.5,.18,.4,mat(0xff1111,0,0.2));
 box(g,.45,2,0,.5,.18,.4,mat(0x1166ff,0,0.2));
 scene.add(g);
 police.push({group:g});
}
for(let i=0;i<3;i++)makePolice();

// ================= MISSION =================
const marker=new THREE.Group();
const ring=new THREE.Mesh(new THREE.TorusGeometry(4,.25,8,32),new THREE.MeshBasicMaterial({color:0xffdd33}));
ring.rotation.x=Math.PI/2;
marker.add(ring);
const beam=new THREE.Mesh(new THREE.CylinderGeometry(.5,2,8,16,1,true),new THREE.MeshBasicMaterial({color:0xffdd33,transparent:true,opacity:.18}));
beam.position.y=4;
marker.add(beam);
marker.visible=false;
scene.add(marker);

// ================= ADMIN =================
window.spawnAdminCar=function(){
 if(crashed)return;
 const g=new THREE.Group();
 createCar(g,Number(document.getElementById("spawnColor").value));
 // Spawn behind the direction the player is facing
 g.position.set(car.position.x-Math.sin(yaw)*15,0,car.position.z+Math.cos(yaw)*15);
 g.rotation.y=yaw;
 scene.add(g);
 adminCars.push(g);
};
window.spawnFiveCars=function(){
 for(let i=0;i<5;i++){
  spawnAdminCar();
  const g=adminCars[adminCars.length-1];
  g.position.x+=(i-2)*7;
  g.position.z-=i*5;
 }
};
window.clearAdminCars=function(){
 for(const g of adminCars)scene.remove(g);
 adminCars.length=0;
};
window.repairCar=function(){
 crashed=false;
 health=100;
 velocity=0;
 car.position.set(0,0,0);
 showMessage("VEHICLE REPAIRED");
};
window.addMoney=function(){money+=10000;updateHUD()};
window.startMission=function(){
 missionActive=true;
 missionTarget=new THREE.Vector3(rand(-400,400),0,rand(-400,400));
 marker.position.copy(missionTarget);
 marker.visible=true;
 document.getElementById("mission").textContent="Reach the yellow checkpoint";
 closePanel();
};
window.closePanel=function(){
 document.getElementById("panel").style.display="none";
 paused=false;
};

// ================= UI =================
function showMessage(text){
 const el=document.getElementById("message");
 el.textContent=text;
 el.style.display="block";
 clearTimeout(showMessage.timer);
 showMessage.timer=setTimeout(()=>el.style.display="none",2500);
}
function togglePanel(){
 const p=document.getElementById("panel");
 if(p.style.display==="block"){p.style.display="none";paused=false}
 else{p.style.display="block";paused=true}
}
function toggleDriving(){
 if(driving){
  driving=false;
  player.position.copy(car.position);
  player.position.x+=4;
  player.rotation.y=yaw;
  showMessage("YOU EXITED THE CAR");
 }else if(dist(player.position,car.position)<8){
  driving=true;
  showMessage("YOU ENTERED THE CAR");
 }else{
  showMessage("GET CLOSER TO YOUR CAR");
 }
}

// ================= CONTROLS =================
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 if(e.repeat)return;

 if(e.key==="F1"){e.preventDefault();togglePanel()}
 if(e.key.toLowerCase()==="e")toggleDriving();
 if(e.key.toLowerCase()==="c"){
  cameraMode=(cameraMode+1)%3;
  showMessage(["THIRD PERSON","FIRST PERSON COCKPIT","HOOD CAMERA"][cameraMode]);
 }
 if(e.key==="Escape"){
  if(document.getElementById("panel").style.display==="block"){
   closePanel();
  }else{
   paused=!paused;
   showMessage(paused?"PAUSED":"RESUMED");
  }
 }
 if(e.key.toLowerCase()==="r"&&crashed){
  repairCar();
 }
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

// ================= FIXED DRIVING =================
function updateDriving(dt){
 if(crashed)return;

 const forward=keys.w||keys.arrowup;
 const backward=keys.s||keys.arrowdown;
 const left=keys.a||keys.arrowleft;
 const right=keys.d||keys.arrowright;
 const handbrake=keys[" "];
 const boost=keys.shift&&nitro>0&&velocity>1;

 const maxSpeed=1000/3.6;

 if(forward)velocity+=(boost?45:18)*dt;
 if(backward)velocity-=24*dt;
 if(!forward&&!backward)velocity*=Math.pow(.985,dt*60);
 if(handbrake)velocity*=Math.pow(.94,dt*60);

 velocity=THREE.MathUtils.clamp(velocity,-18,maxSpeed);

 if(boost)nitro=Math.max(0,nitro-30*dt);
 else nitro=Math.min(100,nitro+9*dt);

 const speedFactor=Math.min(1,Math.abs(velocity)/12);
 const turn=(right?1:0)-(left?1:0);
 steer=THREE.MathUtils.lerp(steer,turn,.12);

 // Positive yaw means car faces toward positive X.
 yaw+=steer*speedFactor*dt*(velocity>=0?1:-1)*1.8;

 car.rotation.y=yaw;

 // Correct Three.js forward direction: local +Z.
 car.position.x+=Math.sin(yaw)*velocity*dt;
 car.position.z+=Math.cos(yaw)*velocity*dt;

 car.position.x=THREE.MathUtils.clamp(car.position.x,-740,740);
 car.position.z=THREE.MathUtils.clamp(car.position.z,-740,740);

 // Traffic collision
 for(const t of traffic){
  const dx=car.position.x-t.group.position.x;
  const dz=car.position.z-t.group.position.z;
  if(Math.abs(dx)<3.6&&Math.abs(dz)<5.5){
   crash();
   break;
  }
 }
 if(boost&&Math.random()<.3)createSpark(car.position.x,car.position.z);
}

// ================= WALKING =================
function updateWalking(dt){
 const forward=keys.w||keys.arrowup;
 const backward=keys.s||keys.arrowdown;
 const left=keys.a||keys.arrowleft;
 const right=keys.d||keys.arrowright;

 const move=(forward?1:0)-(backward?1:0);
 const turn=(right?1:0)-(left?1:0);

 player.rotation.y+=turn*dt*2.3;
 player.position.x+=Math.sin(player.rotation.y)*move*dt*9;
 player.position.z+=Math.cos(player.rotation.y)*move*dt*9;

 player.position.x=THREE.MathUtils.clamp(player.position.x,-740,740);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-740,740);
}

// ================= TRAFFIC AND POLICE =================
function updateTraffic(dt){
 for(const t of traffic){
  t.group.position.z+=t.speed*dt*t.dir;
  if(t.group.position.z>600)t.group.position.z=-600;
  if(t.group.position.z< -600)t.group.position.z=600;
 }
}
function updatePolice(dt){
 const target=driving?car:player;
 for(const p of police){
  if(wanted>0){
   const dx=target.position.x-p.group.position.x;
   const dz=target.position.z-p.group.position.z;
   const angle=Math.atan2(dx,dz);
   p.group.rotation.y=angle;
   p.group.position.x+=Math.sin(angle)*dt*(12+wanted*3);
   p.group.position.z+=Math.cos(angle)*dt*(12+wanted*3);
  }
 }
 if(wanted>0){
  policeTimer+=dt;
  if(policeTimer>35){
   wanted=0;
   policeTimer=0;
   showMessage("WANTED LEVEL CLEARED");
  }
 }
}

// ================= CRASH EFFECT =================
function createSpark(x,z){
 const m=new THREE.Mesh(new THREE.SphereGeometry(.12,6,6),new THREE.MeshBasicMaterial({color:0xffb52b}));
 m.position.set(x,rand(.5,2),z);
 scene.add(m);
 sparks.push({mesh:m,life:.5});
}
function updateSparks(dt){
 for(let i=sparks.length-1;i>=0;i--){
  const s=sparks[i];
  s.life-=dt;
  s.mesh.position.y+=dt*2;
  if(s.life<=0){
   scene.remove(s.mesh);
   sparks.splice(i,1);
  }
 }
}
function crash(){
 if(crashed)return;
 crashed=true;
 velocity=0;
 health=Math.max(0,health-25);
 wanted=Math.min(5,wanted+1);
 showMessage("CRASH! VEHICLE DAMAGED");
 for(let i=0;i<15;i++)createSpark(car.position.x+rand(-2,2),car.position.z+rand(-2,2));
}

// ================= CAMERA MODES =================
function updateCamera(dt){
 const target=driving?car:player;
 let desired=new THREE.Vector3();
 let look=new THREE.Vector3();

 if(!driving){
  // First-person walking
  if(cameraMode===1){
   desired.set(
    target.position.x,
    target.position.y+1.65,
    target.position.z
   );
   look.set(
    target.position.x+Math.sin(target.rotation.y)*10,
    target.position.y+1.65,
    target.position.z+Math.cos(target.rotation.y)*10
   );
  }else{
   desired.set(
    target.position.x-Math.sin(target.rotation.y)*7,
    target.position.y+3.5,
    target.position.z-Math.cos(target.rotation.y)*7
   );
   look.set(target.position.x,target.position.y+1,target.position.z);
  }
 }else if(cameraMode===1){
  // Cockpit camera: local position inside car
  const offset=new THREE.Vector3(-.55,1.8,1.0);
  offset.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
  desired.set(car.position.x+offset.x,car.position.y+offset.y,car.position.z+offset.z);
  look.set(
   car.position.x+Math.sin(yaw)*20,
   car.position.y+1.6,
   car.position.z+Math.cos(yaw)*20
  );
 }else if(cameraMode===2){
  // Hood camera
  const offset=new THREE.Vector3(0,2.2,2.5);
  offset.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
  desired.set(car.position.x+offset.x,car.position.y+offset.y,car.position.z+offset.z);
  look.set(car.position.x+Math.sin(yaw)*20,car.position.y+1,car.position.z+Math.cos(yaw)*20);
 }else{
  // Third person
  desired.set(
   car.position.x-Math.sin(yaw)*12,
   car.position.y+6,
   car.position.z-Math.cos(yaw)*12
  );
  look.set(
   car.position.x+Math.sin(yaw)*10,
   car.position.y+1.5,
   car.position.z+Math.cos(yaw)*10
  );
 }

 camera.position.lerp(desired,1-Math.pow(.001,dt));
 camera.lookAt(look);
}

// ================= MISSIONS =================
function updateMission(){
 if(!missionActive||!missionTarget)return;
 const target=driving?car:player;
 if(dist(target.position,missionTarget)<8){
  money+=missionReward;
  missionActive=false;
  marker.visible=false;
  document.getElementById("mission").textContent="Mission completed!";
  showMessage("MISSION COMPLETE +$"+missionReward);
 }
}

// ================= HUD =================
function updateHUD(){
 document.getElementById("cash").textContent="$"+money.toLocaleString();
 document.getElementById("speed").textContent=Math.round(Math.abs(velocity)*3.6);
 document.getElementById("gear").textContent=!driving?"ON FOOT":velocity<0?"REVERSE":"DRIVE";
 document.getElementById("healthFill").style.width=health+"%";
 document.getElementById("nitroFill").style.width=nitro+"%";
 document.getElementById("wanted").textContent="★".repeat(wanted)+"☆".repeat(5-wanted);
}
function updateMap(){
 const c=document.getElementById("minimap");
 const ctx=c.getContext("2d");
 ctx.clearRect(0,0,200,200);
 ctx.fillStyle="#243b2a";
 ctx.fillRect(0,0,200,200);
 ctx.strokeStyle="#89959a";
 ctx.lineWidth=5;
 for(let i=0;i<200;i+=40){
  ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,200);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(200,i);ctx.stroke();
 }
 const target=driving?car:player;
 ctx.fillStyle="#00cfff";
 ctx.beginPath();ctx.arc(100,100,6,0,Math.PI*2);ctx.fill();
 if(missionActive){
  ctx.fillStyle="#ffdc33";
  ctx.beginPath();
  ctx.arc(100+(missionTarget.x-target.position.x)*.15,100+(missionTarget.z-target.position.z)*.15,5,0,Math.PI*2);
  ctx.fill();
 }
}

// ================= MAIN LOOP =================
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(!paused){
  if(driving)updateDriving(dt);
  else updateWalking(dt);

  updateTraffic(dt);
  updatePolice(dt);
  updateSparks(dt);
  updateMission();
  updateCamera(dt);
  updateHUD();
  updateMap();

  if(missionActive)marker.rotation.y+=dt;
 }
 renderer.render(scene,camera);
}

updateCamera(.016);
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

showMessage("WELCOME TO CITY LIFE 5");
})();
</script>
</body>
