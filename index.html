<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ultimate Driving Simulator</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  overflow: hidden;
  background: #87ceeb;
  font-family: Arial, sans-serif;
}

canvas { display: block; }

#speed {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: #101820dd;
  color: white;
  padding: 18px 25px;
  border-radius: 12px;
  font-size: 27px;
  z-index: 5;
  border: 1px solid #777;
}

#help {
  position: fixed;
  top: 18px;
  left: 18px;
  background: #101820cc;
  color: white;
  padding: 13px;
  border-radius: 8px;
  z-index: 5;
}

#location {
  position: fixed;
  top: 18px;
  right: 18px;
  background: #101820cc;
  color: white;
  padding: 13px;
  border-radius: 8px;
  z-index: 5;
}
</style>
</head>

<body>

<div id="speed">0 KM/H</div>
<div id="help">
  W / ↑ GAS<br>
  S / ↓ BRAKE<br>
  A / ← LEFT<br>
  D / → RIGHT
</div>
<div id="location">OPEN WORLD</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// =====================================
// 1. WORLD SETUP
// =====================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 100, 450);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 1.65, 0);
camera.rotation.order = "YXZ";

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

if (renderer.outputColorSpace !== undefined) {
  renderer.outputColorSpace = THREE.SRGBColorSpace;
}

document.body.appendChild(renderer.domElement);

scene.add(camera);

// =====================================
// 2. LIGHTING
// =====================================

scene.add(new THREE.HemisphereLight(
  0xbce7ff,
  0x53613d,
  1.8
));

const sun = new THREE.DirectionalLight(0xfff1d5, 2.5);

sun.position.set(-80, 120, 50);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

scene.add(sun);

// =====================================
// 3. MATERIALS
// =====================================

function material(color, roughness = 0.85) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness
  });
}

const grassMat = material(0x4d8738);
const roadMat = material(0x292c30);
const lineMat = material(0xf5f5f0);
const trunkMat = material(0x604027);
const leafMat = material(0x205b28);
const buildingMat = [
  material(0xaaa69d),
  material(0xc6bcae),
  material(0x777e86),
  material(0xb4a18d)
];

// =====================================
// 4. HUGE LANDSCAPE
// =====================================

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1500, 1500),
  grassMat
);

ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.15, -350);
ground.receiveShadow = true;

scene.add(ground);

// Hills

const hills = [];

for (let i = 0; i < 22; i++) {

  const hill = new THREE.Mesh(
    new THREE.SphereGeometry(1, 20, 14),
    material(
      i % 2 ? 0x557c43 : 0x648c50
    )
  );

  const side = i % 2 ? 1 : -1;

  hill.scale.set(
    25 + Math.random() * 35,
    12 + Math.random() * 20,
    35 + Math.random() * 35
  );

  hill.position.set(
    side * (70 + Math.random() * 130),
    -7,
    -i * 35 - 50
  );

  scene.add(hill);
  hills.push(hill);
}

// Distant mountains

for (let i = 0; i < 16; i++) {

  const mountain = new THREE.Mesh(
    new THREE.ConeGeometry(
      30 + Math.random() * 35,
      65 + Math.random() * 50,
      6
    ),
    material(0x718b99)
  );

  mountain.position.set(
    (i - 8) * 65,
    20,
    -350 - Math.random() * 100
  );

  scene.add(mountain);
}

// =====================================
// 5. BIG MULTI-LANE ROAD
// =====================================

const road = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 1000),
  roadMat
);

road.rotation.x = -Math.PI / 2;
road.position.set(0, 0, -400);
road.receiveShadow = true;

scene.add(road);

// Road shoulders

for (const x of [-10.5, 10.5]) {

  const shoulder = new THREE.Mesh(
    new THREE.BoxGeometry(1, 0.08, 1000),
    material(0xb5b3a7)
  );

  shoulder.position.set(x, 0, -400);
  scene.add(shoulder);
}

// Road markings

const roadLines = [];

for (let i = 0; i < 70; i++) {

  for (const x of [-3.3, 3.3]) {

    const line = new THREE.Mesh(
      new THREE.BoxGeometry(0.16, 0.025, 6),
      lineMat
    );

    line.position.set(x, 0.04, -i * 14);
    scene.add(line);
    roadLines.push(line);
  }
}

// Road edges

for (const x of [-9.5, 9.5]) {

  const edge = new THREE.Mesh(
    new THREE.BoxGeometry(0.2, 0.03, 1000),
    lineMat
  );

  edge.position.set(x, 0.04, -400);
  scene.add(edge);
}

// =====================================
// 6. FORESTS
// =====================================

const trees = [];

function createTree(x, z, scale = 1) {

  const group = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2, 0.3, 3, 8),
    trunkMat
  );

  trunk.position.y = 1.5;
  group.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(1.8, 5, 9),
    leafMat
  );

  leaves.position.y = 4.5;
  group.add(leaves);

  const top = new THREE.Mesh(
    new THREE.ConeGeometry(1.3, 3.5, 9),
    material(0x286b31)
  );

  top.position.y = 6;
  group.add(top);

  group.scale.setScalar(scale);
  group.position.set(x, 0, z);

  scene.add(group);
  trees.push(group);
}

for (let i = 0; i < 65; i++) {

  const z = -i * 9;

  createTree(-14 - Math.random() * 20, z, 0.8 + Math.random());
  createTree(14 + Math.random() * 20, z, 0.8 + Math.random());
}

// =====================================
// 7. BUILDINGS
// =====================================

const buildings = [];

function createBuilding(x, z) {

  const group = new THREE.Group();

  const width = 8 + Math.random() * 9;
  const height = 10 + Math.random() * 25;
  const depth = 8 + Math.random() * 8;

  const building = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    buildingMat[Math.floor(Math.random() * buildingMat.length)]
  );

  building.position.y = height / 2;
  group.add(building);

  // Windows

  const windowMat = new THREE.MeshStandardMaterial({
    color: 0x263e4c,
    roughness: 0.3,
    metalness: 0.2
  });

  for (let y = 3; y < height - 1; y += 4) {

    for (let w = -width / 2 + 1.5; w < width / 2 - 1; w += 3) {

      const windowMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1.3, 1.8, 0.08),
        windowMat
      );

      windowMesh.position.set(w, y, depth / 2 + 0.05);
      group.add(windowMesh);
    }
  }

  group.position.set(x, 0, z);

  scene.add(group);
  buildings.push(group);
}

for (let i = 0; i < 20; i++) {

  createBuilding(-42 - Math.random() * 20, -i * 35 - 30);
  createBuilding(42 + Math.random() * 20, -i * 35 - 30);
}

// =====================================
// 8. STREETLIGHTS
// =====================================

const lights = [];

function createStreetlight(x, z) {

  const group = new THREE.Group();

  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.17, 8, 8),
    material(0x55585b, 0.5)
  );

  pole.position.y = 4;
  group.add(pole);

  const arm = new THREE.Mesh(
    new THREE.BoxGeometry(2, 0.12, 0.12),
    material(0x55585b)
  );

  arm.position.set(x > 0 ? -0.9 : 0.9, 7.8, 0);
  group.add(arm);

  const bulb = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 0.18, 0.4),
    material(0xfff1bd, 0.3)
  );

  bulb.position.set(x > 0 ? -1.5 : 1.5, 7.7, 0);
  group.add(bulb);

  group.position.set(x, 0, z);

  scene.add(group);
  lights.push(group);
}

for (let i = 0; i < 30; i++) {
  createStreetlight(-12, -i * 22);
  createStreetlight(12, -i * 22);
}

// =====================================
// 9. CAR INTERIOR
// =====================================

const interior = new THREE.Group();

camera.add(interior);

const blackMat = material(0x111316, 0.45);
const leatherMat = material(0x282321, 0.8);
const metalMat = material(0x777c80, 0.4);

// Dashboard

const dash = new THREE.Mesh(
  new THREE.BoxGeometry(3.8, 0.65, 1.1),
  leatherMat
);

dash.position.set(0, -0.85, -1.15);
interior.add(dash);

// Dashboard top

const dashTop = new THREE.Mesh(
  new THREE.BoxGeometry(3.9, 0.13, 1.1),
  blackMat
);

dashTop.position.set(0, -0.5, -1.15);
interior.add(dashTop);

// Steering wheel

const wheelGroup = new THREE.Group();

const wheel = new THREE.Mesh(
  new THREE.TorusGeometry(0.42, 0.065, 16, 48),
  blackMat
);

wheelGroup.add(wheel);

const wheelHub = new THREE.Mesh(
  new THREE.CylinderGeometry(0.13, 0.13, 0.12, 24),
  metalMat
);

wheelHub.rotation.x = Math.PI / 2;
wheelGroup.add(wheelHub);

// Steering spokes

for (let i = 0; i < 3; i++) {

  const spoke = new THREE.Mesh(
    new THREE.BoxGeometry(0.07, 0.36, 0.07),
    blackMat
  );

  spoke.rotation.z = i * Math.PI * 2 / 3;
  wheelGroup.add(spoke);
}

wheelGroup.position.set(-0.55, -0.48, -0.9);
interior.add(wheelGroup);

// Instrument panel

const instrument = new THREE.Mesh(
  new THREE.BoxGeometry(1.5, 0.35, 0.1),
  material(0x071b25)
);

instrument.position.set(0, -0.45, -1.7);
interior.add(instrument);

// Windshield frame

for (const x of [-1.8, 1.8]) {

  const pillar = new THREE.Mesh(
    new THREE.BoxGeometry(0.13, 2.8, 0.18),
    blackMat
  );

  pillar.position.set(x, 0.5, -1.6);
  pillar.rotation.z = x > 0 ? -0.08 : 0.08;
  interior.add(pillar);
}

// Roof edge

const roof = new THREE.Mesh(
  new THREE.BoxGeometry(3.7, 0.18, 0.5),
  blackMat
);

roof.position.set(0, 1.8, -1.5);
interior.add(roof);

// Rearview mirror

const mirror = new THREE.Mesh(
  new THREE.BoxGeometry(0.65, 0.22, 0.12),
  blackMat
);

mirror.position.set(0, 1.05, -1.1);
interior.add(mirror);

// =====================================
// 10. DRIVING CONTROLS
// =====================================

const keys = {};

window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;

  if (e.key.startsWith("Arrow")) e.preventDefault();
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

let speed = 0;
let steering = 0;
let carX = 0;

// =====================================
// 11. GAME LOOP
// =====================================

function animate() {

  requestAnimationFrame(animate);

  // Gas

  if (keys["w"] || keys["arrowup"]) {
    speed = Math.min(speed + 0.16, 200);
  } else {
    speed = Math.max(speed - 0.035, 0);
  }

  // Brake

  if (keys["s"] || keys["arrowdown"]) {
    speed = Math.max(speed - 0.45, 0);
  }

  // STEERING FIX
  // A = LEFT
  // D = RIGHT

  if (keys["a"] || keys["arrowleft"]) {
    steering = Math.min(steering + 0.025, 0.65);
  }

  else if (keys["d"] || keys["arrowright"]) {
    steering = Math.max(steering - 0.025, -0.65);
  }

  else {
    steering *= 0.92;
  }

  // Corrected camera direction

  carX -= steering * speed * 0.0008;

  carX = THREE.MathUtils.clamp(carX, -7, 7);

  camera.position.x = carX;

  // Steering wheel

  wheelGroup.rotation.z = -steering * 1.8;

  // Movement

  const movement = speed * 0.018;

  // Road markings

  roadLines.forEach(line => {

    line.position.z += movement;

    if (line.position.z > 8) {
      line.position.z -= 980;
    }

  });

  // Forests

  trees.forEach(tree => {

    tree.position.z += movement;

    if (tree.position.z > 15) {
      tree.position.z -= 585;
    }

  });

  // Buildings

  buildings.forEach(building => {

    building.position.z += movement;

    if (building.position.z > 30) {
      building.position.z -= 700;
    }

  });

  // Streetlights

  lights.forEach(light => {

    light.position.z += movement;

    if (light.position.z > 20) {
      light.position.z -= 660;
    }

  });

  // Speed display

  document.getElementById("speed").textContent =
    Math.round(speed) + " KM/H";

  renderer.render(scene, camera);
}

animate();

// =====================================
// 12. SCREEN RESIZING
// =====================================

window.addEventListener("resize", () => {

  camera.aspect = window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

</script>
</body>
</html>
